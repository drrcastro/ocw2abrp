openapi: 3.0.3
info:
  title: Iternio Planning API v2
  description: |
    The Iternio EV route planner is built around the same route optimizer which powers the
    well-known and highly trusted ABetterRoutePlanner app, available at
    [https://abetterrouteplanner.com](https://abetterrouteplanner.com) as well as
    [https://apps.apple.com/us/app/a-better-routeplanner-abrp/id1490860521](https://apps.apple.com/us/app/a-better-routeplanner-abrp/id1490860521)
    and [https://play.google.com/store/apps/details?id=com.iternio.abrpapp](https://play.google.com/store/apps/details?id=com.iternio.abrpapp).

    As ABRP is developed, the same features also become available in the route planning API; new car models, weather features,
    charger database updates and so on.

    To be able to use the API, you will need to obtain an API key.
    The pricing is simple: There is a small setup cost for new customers and thereafter we charge per successful plan delivered
    by the API, that is specifically the plan endpoint documented below.
    All other calls are free of charge. Contact us to discuss your need and obtain an API key.

    Endpoints have three maturity levels:
      - *alpha*: Experimental endpoints without any guarantees of compatibility. Mainly used for development.
      - *beta*: Endpoints where breaking changes might be introduced on short notice.
      - *stable* (omitted): Endpoints where no breaking changes will be introduced without major precautions.
  version: 2.0.3
  termsOfService: https://www.iternio.com/terms-of-use
  contact:
    name: API Support
    email: contact@iternio.com
servers:
  - url: https://api.iternio.com/2
tags:
  - name: plan
    description: Endpoints related to planning and driving.
  - name: charger
    description: Endpoints related to charger.
  - name: vehicle
    description: Endpoints related to vehicles.
  - name: network
    description: Endpoints related to charger networks.
  - name: charge-card
    description: Endpoints related to charge-cards.
  - name: price
    description: Endpoints related to charger prices.
  - name: media
    description: Endpoints related to media.
  - name: app
    description: Endpoints related to the ABRP app.
  - name: poi
    description: Endpoints related to points of interests.
  - name: route-share
    description: Endpoints related to route sharing.
  - name: development
    description: Endpoints that are currently being developed.
  - name: developer
    description: Endpoints that require the `devel` role.
paths:
  /plan:
    post:
      security:
        - ApiKeyAuth: []
      summary: Create a plan
      description: |
        Create an EV route plan and return routes with guidance instructions.
      operationId: plan
      tags:
        - plan
      parameters:
        - $ref: "#/components/parameters/apiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
            examples:
              Simple:
                value:
                  destinations:
                    - location:
                        type: ADDRESS
                        value: Lund, Sweden
                    - location:
                        type: ADDRESS
                        value: Stockholm, Sweden
                  vehicle:
                    identifier:
                      type: TYPECODE
                      value: rivian:r1s:21:135
      responses:
        "200":
          $ref: "#/components/responses/PlanOk"
        "400":
          $ref: "#/components/responses/PlanBadRequest"
        "401":
          $ref: "#/components/responses/WithMessage"
        "403":
          $ref: "#/components/responses/WithMessage"
        "500":
          $ref: "#/components/responses/WithMessage"
  /plan/amenity-candidates:
    post:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: (alpha) Amenity Candidate Search
      description: |
        Get amenity candidates for a new plan.
      operationId: amenity_candidates_with_plan
      tags:
        - development
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmenityCandidatesRequest"
      responses:
        "200":
          $ref: "#/components/responses/AmenityCandidatesOk"
        "400":
          $ref: "#/components/responses/WithMessage"
        "401":
          $ref: "#/components/responses/WithMessage"
        "403":
          $ref: "#/components/responses/WithMessage"
        "500":
          $ref: "#/components/responses/WithMessage"
  /app/route-preliminary:
    post:
      security:
        - ApiKeyAuth: []
      summary: (alpha) Preliminary route
      description: |
        Road route through the given points, computed by OSRM only: no chargers and no consumption.
        Returns just the route geometry. Meant for fast previews, for example while dragging a waypoint.

        Requires an API key with the `abrp_data` feature.
      operationId: preliminary_route
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/apiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreliminaryRouteRequest"
      responses:
        "200":
          $ref: "#/components/responses/PreliminaryRouteOk"
        "400":
          $ref: "#/components/responses/WithMessage"
        "401":
          $ref: "#/components/responses/WithMessage"
        "403":
          $ref: "#/components/responses/WithMessage"
        "500":
          $ref: "#/components/responses/WithMessage"
        "502":
          $ref: "#/components/responses/WithMessage"
  /route/refresh:
    post:
      security:
        - ApiKeyAuth: []
      summary: Refresh a plan
      description: |
        Create an EV route plan and return routes with guidance instructions.
      operationId: refresh
      tags:
        - plan
      parameters:
        - $ref: "#/components/parameters/apiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          $ref: "#/components/responses/RefreshOk"
        "400":
          $ref: "#/components/responses/PlanBadRequest"
        "401":
          $ref: "#/components/responses/WithMessage"
        "403":
          $ref: "#/components/responses/WithMessage"
        "500":
          $ref: "#/components/responses/WithMessage"
  /route/amenity-candidates:
    post:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: (alpha) Amenity Candidate Search
      description: |
        Search for amenity candidates based on a given plan.
        This endpoint is used to find suitable amenities along the route.
      operationId: amenity_candidates_along_route
      tags:
        - development
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmenityCandidatesAlongRouteRequest"
      responses:
        "200":
          $ref: "#/components/responses/AmenityCandidatesAlongRouteOk"
        "400":
          $ref: "#/components/responses/WithMessage"
        "401":
          $ref: "#/components/responses/WithMessage"
        "403":
          $ref: "#/components/responses/WithMessage"
        "500":
          $ref: "#/components/responses/WithMessage"
  /abrp/plan:
    post:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: Create a plan
      description: |
        Create an EV route plan and return routes with guidance instructions.
      operationId: abrp_plan
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
        - in: header
          name: X-ABRP-V1-Plan-UUID
          required: false
          schema:
            type: string
          description: Original v1 plan UUID for correlation and comparison purposes (development only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbrpPlanRequest"
      responses:
        "200":
          $ref: "#/components/responses/AbrpPlanOk"
        "400":
          $ref: "#/components/responses/PlanBadRequest"
        "401":
          $ref: "#/components/responses/WithMessage"
        "403":
          $ref: "#/components/responses/WithMessage"
        "500":
          $ref: "#/components/responses/WithMessage"
  /abrp/plan/alternatives:
    post:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: Generate plan alternatives
      description: |
        Generate alternative EV route plans based on an existing plan.
      operationId: abrp_plan_alternatives
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanAlternativesRequest"
      responses:
        "200":
          $ref: "#/components/responses/AbrpPlanOk"
        "400":
          $ref: "#/components/responses/PlanBadRequest"
        "401":
          $ref: "#/components/responses/WithMessage"
        "403":
          $ref: "#/components/responses/WithMessage"
        "500":
          $ref: "#/components/responses/WithMessage"
  /abrp/route/refresh:
    post:
      security:
        - ApiKeyAuth: []
      summary: Refresh a plan
      description: |
        Create an EV route plan and return routes with guidance instructions.
      operationId: abrp_refresh
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - in: header
          name: X-ABRP-V1-Plan-UUID
          required: false
          schema:
            type: string
          description: Original v1 plan UUID for correlation and comparison purposes (development only)
        - name: X-ABRP-RS
          in: header
          required: false
          description: Secret key that identifies one share
          schema:
            type: string
            description: The Access key to the share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbrpRefreshRequest"
      responses:
        "200":
          $ref: "#/components/responses/AbrpRefreshOk"
        "400":
          $ref: "#/components/responses/PlanBadRequest"
        "401":
          $ref: "#/components/responses/WithMessage"
        "403":
          $ref: "#/components/responses/WithMessage"
        "500":
          $ref: "#/components/responses/WithMessage"
  /abrp/plan/amenity-candidates:
    post:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: (alpha) ABRP Amenity Candidate Search
      description: |
        Get amenity candidates for a new plan.
      operationId: amenity_candidates_with_abrp_plan
      tags:
        - development
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbrpAmenityCandidatesRequest"
      responses:
        "200":
          $ref: "#/components/responses/AbrpAmenityCandidatesOk"
        "400":
          $ref: "#/components/responses/WithMessage"
        "401":
          $ref: "#/components/responses/WithMessage"
        "403":
          $ref: "#/components/responses/WithMessage"
        "500":
          $ref: "#/components/responses/WithMessage"
  /abrp/plan/ev-comparison:
    get:
      security:
        - ApiKeyAuth: []
      summary: (alpha) EV Comparison
      description: |
        Get an EV comparison for a given plan.
      operationId: ev_comparison
      tags:
        - development
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - name: waypoints
          in: query
          required: true
          schema:
            type: string
            example: 59.33,18.07|55.60,13.00|48.85,2.35
          description: Pipe-separated list of lat,lon coordinate pairs. Order is significant â€” first waypoint is origin, last is destination.
        - name: typecode
          in: query
          required: true
          schema:
            type: string
          example: rivian:r1s:21:135
        - name: temperatureC
          in: query
          schema:
            type: number
            example: 20
          description: The temperature in Celsius.
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 1
          description: The month of the year to use for the seasonal weather.
      responses:
        "200":
          $ref: "#/components/responses/EvComparisonOk"
        "400":
          $ref: "#/components/responses/PlanBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /abrp/plan/{planId}/request:
    get:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: Retrieve the original plan request
      description: Returns the request parameters that were used to generate the specified plan.
      operationId: get_plan_request
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
        - name: planId
          in: path
          required: true
          description: The ID of the plan.
          schema:
            type: string
            example: 12345678-1234-1234-1234-123456789012
      responses:
        "200":
          description: Successfully retrieved the plan request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPlanRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: (Alpha) Persist the original plan request
      description: |
        Persists the plan request used to generate a route for future retrieval.
      operationId: persist_plan_request
      tags:
        - development
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
        - name: planId
          in: path
          required: true
          description: The ID of the plan.
          schema:
            type: string
            example: 12345678-1234-1234-1234-123456789012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersistPlanRequest"
      responses:
        "201":
          description: Plan request successfully persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPlanRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: (alpha) Delete a persisted plan request.
      description: Removes the persisted plan request associated with the given UUID.
      operationId: delete_plan_request
      tags:
        - development
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
        - in: path
          name: planId
          required: true
          description: The ID of the plan.
          schema:
            type: string
            example: 12345678-1234-1234-1234-123456789012
      responses:
        "204":
          description: Successfully deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /abrp/plan/_saved-requests:
    get:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: (alpha) List saved plan requests for the user.
      description: |
        Returns all saved plan requests associated with the current user session.
      operationId: list_saved_plan_requests
      tags:
        - development
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
      responses:
        "200":
          description: List of saved plan requests
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    $ref: "#/components/schemas/SavedPlanRequestList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /abrp/voice/_text:
    post:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: (alpha) Plan a route from a voice transcript
      description: |
        Take a free-text transcript ("drive home", "from Lund to Stockholm") plus
        the same context as `/abrp/plan`, and return a `VoiceResponse`.
      operationId: abrp_voice_text
      tags:
        - development
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceTextRequest"
      responses:
        "200":
          $ref: "#/components/responses/VoiceResponseOk"
        "400":
          $ref: "#/components/responses/PlanBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/WithMessage"
        "503":
          $ref: "#/components/responses/WithMessage"
  /abrp/voice/_audio:
    post:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: (alpha) Plan a route from a voice recording
      description: |
        Take a recorded audio clip plus the same context as `/abrp/plan`,
        transcribe it server-side, and return a `VoiceResponse`.
      operationId: abrp_voice_audio
      tags:
        - development
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/VoiceAudioRequest"
      responses:
        "200":
          $ref: "#/components/responses/VoiceResponseOk"
        "400":
          $ref: "#/components/responses/PlanBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/WithMessage"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/WithMessage"
        "503":
          $ref: "#/components/responses/WithMessage"
  /range:
    post:
      security:
        - ApiKeyAuth: []
      summary: (alpha) Create a range plot
      description: Create a range plot showing reachable points from a given location based on vehicle and conditions.
      operationId: range
      tags:
        - development
      parameters:
        - $ref: "#/components/parameters/apiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RangeRequest"
      responses:
        "200":
          $ref: "#/components/responses/RangeOk"
        "400":
          $ref: "#/components/responses/PlanBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/login:
    post:
      security:
        - ApiKeyAuth: []
      summary: (alpha) Login
      description: |
        Logs in a user and returns a session token.
      operationId: login
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/apiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: The username
                password:
                  type: string
                  description: The password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                  - expires_in
                  - refresh_token
                properties:
                  access_token:
                    type: string
                    description: Access token
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                    description: The time in seconds until the token expires
                    example: 300
                  refresh_token:
                    type: string
                    description: The refresh token
                    example: 1234567890
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /charger/_debug:
    post:
      security:
        - ApiKeyAuth: []
      summary: Charger debug info
      description: |
        Returns debug info for a batch of chargers, keyed by charger id.
        Requires the `devel` role. Ids with no data are omitted. Accepts up to
        100 distinct ids; repeats are ignored.
      operationId: charger_debug
      tags:
        - developer
      parameters:
        - $ref: "#/components/parameters/apiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chargerIds
              properties:
                chargerIds:
                  type: array
                  items:
                    $ref: "#/components/schemas/ChargerId"
                  minItems: 1
      responses:
        "200":
          $ref: "#/components/responses/ChargerDebugOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /charger/_get:
    post:
      security:
        - ApiKeyAuth: []
      summary: (alpha) Charger get
      description: |
        Returns information about chargers based on multiple ids. Note that the order of the input ids is preserved in the output.
      operationId: charger_get
      tags:
        - charger
      parameters:
        - $ref: "#/components/parameters/apiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chargerIds
              properties:
                chargerIds:
                  type: array
                  items:
                    $ref: "#/components/schemas/ChargerId"
                  maxItems: 1000
      responses:
        "200":
          $ref: "#/components/responses/ChargerGetOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /charger/{chargerId}:
    get:
      security:
        - ApiKeyAuth: []
      summary: (alpha) Charger by id
      operationId: charger_by_id
      tags:
        - charger
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/chargerIdRequired"
      responses:
        "200":
          $ref: "#/components/responses/ChargerOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /charger/{chargerId}/deeplink/{operator}/event:
    post:
      security:
        - ApiKeyAuth: []
      summary: Report deeplink press event for a charger
      description: Endpoint for the app to report that a user has pressed a deeplink for a given charger and operator.
      operationId: charger_deeplink_event
      tags:
        - charger
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/chargerIdRequired"
        - name: operator
          in: path
          required: true
          description: The operator connected to the deeplink
          schema:
            type: string
      requestBody:
        description: Event details
        content:
          application/json:
            schema:
              type: object
              properties:
                requestId:
                  type: string
                  description: Optional unique request identifier for correlation or billing
                platform:
