      properties:
        type:
          type: string
          enum:
            - afterTime
        afterTimeSec:
          type: integer
          minimum: 0
          description: |
            [s] Search after this time from the start of the leg. 
            Typically used to search for chargers after the current vehicle position.
    AroundPointOption:
      type: object
      required:
        - type
        - aroundPoint
      properties:
        type:
          type: string
          enum:
            - aroundPoint
        aroundPoint:
          $ref: "#/components/schemas/Coordinates"
    AmenityChargerCandidatesSearchFilter:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/AmenityChargerCandidateCategory"
        distanceM:
          type: integer
          minimum: 0
          default: 1000
          description: |
            The maximum distance from the route to search for amenities.
        stayTimeSec:
          type: integer
          minimum: 0
          default: 300
          description: |
            [s] The time the vehicle is expected to stay at the amenity.
            This is used to filter out amenities that are too far away from the route.
        subcategories:
          type: array
