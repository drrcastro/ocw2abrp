          $ref: "#/components/schemas/VoltageInput"
        heading:
          $ref: "#/components/schemas/HeadingInput"
        current:
          $ref: "#/components/schemas/CurrentInput"
        provider:
          type: string
          description: The provider of the data
          enum:
            - APP_LOCATION
            - APP_OBD
            - APP_AUTOMOTIVE
            - APP_AUTO
            - ABRP_OTA
    InputPointList:
      type: array
      description: A non-empty list of telemetry points to ingest in one call.
      items:
        $ref: "#/components/schemas/InputPoint"
      minItems: 1
      maxItems: 1000
    LocationType:
      type: string
      example: ON_STREET
      description: |
        Indicates the type of location where the charge point is located. Example values:
        - ON_STREET
        - PARKING_GARAGE
        - UNDERGROUND_GARAGE
        - PARKING_LOT
    DerivedLocationTypeObject:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          example: ON_STREET
          description: |
            Indicates the type of location where a charge point is located. Examples are:
              - ALONG_MOTORWAY
              - PARKING_GARAGE
              - PARKING_LOT
              - ON_STREET
        description:
          type: string
          example: ON_STREET
          description: The description of the location type.
      description: This attribute is enriched using Eco-Movement's research methods to improve the value in the data.type attribute.
    DerivedLocationType:
      type: array
      items:
        $ref: "#/components/schemas/DerivedLocationTypeObject"
    ChargingWhenClosed:
      type: boolean
      example: true
      description: Indicates if the EVSEs can be used for charging outside the opening hours of the location. For example, when the parking garage closes its barriers overnight, this attribute indicates if you can still charge until the next morning.
    EnergySource:
      type: object
      required:
        - source
      properties:
        source:
          type: string
          example: WATER
          description: |
            The type of energy source. Examples are:
              - NUCLEAR: Nuclear power source
              - GENERAL_FOSSIL: All kinds of fossil power sources
              - COAL: Fossil power form coal
              - GAS: Fossil power from gas
              - GENERAL_GREEN: All kinds of regenerative power sources
              - SOLAR: Regenerative power from PV
              - WIND: Regenerative power from wind turbines
              - WATER: Regenerative power from water turbines
        percentage:
          type: number
          minimum: 0
          maximum: 100
          example: 33
          description: The percentage of the source in the mix.
    EnvironImpact:
      type: object
      properties:
        source:
          type: string
          description: |
            The type of pollutant. Exmaples are:
              - NUCLEAR_WASTE: Produced nuclear waste in grams per kilowatt-hour.
              - CARBON_DIOXIDE: Exhausted carbon dioxide in grams per kilowatt-hour.
        amount:
          type: integer
          description: The amount of nuclear waste produced or carbon dioxide exhausted in grams per kilowatt-hour
    EnergyMix:
      type: object
      required:
        - energySource
      properties:
        isGreenEnergy:
          type: boolean
          example: true
          description: Indicates true if the supplied energy at the location is 100% from regenerative sources. (CO2 and nuclear waste is zero.)
        supplierName:
          type: string
          example: Octopus Energy
          description: The name of the energy supplier that delivers the energy for the location.
        energyProductName:
          type: string
          example: Octopus Energy
          description: The name of the energy supplier's product that is used at the location.
        energySources:
          type: array
          items:
            $ref: "#/components/schemas/EnergySource"
        environImpact:
          type: array
          items:
            $ref: "#/components/schemas/EnvironImpact"
    PredictedOccupancyObject:
      type: object
      required:
        - weekday
        - periodBegin
        - periodEnd
        - occupancy
      properties:
        weekday:
          type: integer
          example: 3
          description: The number of the day in the week. It starts from Monday (1) and ends in Sunday (7).
        periodBegin:
          type: string
          example: "05:00"
          description: The beginning of the regular period.
        periodEnd:
          type: string
          example: "05:59"
          description: The ending of the regular period.
        occupancy:
          type: integer
          example: 4
          minimum: 1
          maximum: 10
          description: Indicates the occupancy on a scale from 1 to 10, where 1 means the location is available for charging and 10 means the location is fully occupied.
      description: The predicted occupancy.
    PredictedOccupancy:
      type: array
      items:
        $ref: "#/components/schemas/PredictedOccupancyObject"
    RoamingObject:
      type: object
      required:
        - emsp
      properties:
        emsp:
          type: string
        partnerId:
          type: string
        emaId:
          type: array
          items:
            type: string
        card:
          type: string
        androidAppLink:
          type: string
        iosAppLink:
          type: string
    Roaming:
      type: array
      items:
        $ref: "#/components/schemas/RoamingObject"
    SupportPhone:
      type: string
      example: +46-236578
      description: The phone number that EV drivers should call when they need assistance at the charge location.
    AdhocAuthorisationPaymentMethodObject:
      type: object
      properties:
        code:
          type: string
          example: ONLINE_APPLE_PAY
          description: |
            Indicates the authentication and payment methods. Examples are:
              - AUTH_BY_CAR_PLUG&CHARGE
              - ONLINE_APPLE_PAY
              - TERMINAL_IN_APP
              - ONLINE_PAYPAL
              - SERVICE_PROVIDER_RFID_CARD
              - TERMINAL_QR_CODE
              - TERMINAL_CREDIT_CARD
              - TERMINAL_DEBIT_CARD
              - TERMINAL_SMS
              - ONLINE_CREDIT_CARD
              - OTHER_OTHER
              - TERMINAL_CONTACTLESS
              - ONLINE_GOOGLE_PAY
              - ONLINE_BANK_PAYMENT
              - AUTH_BY_CAR_AUTOCHARGE
        description:
          type: string
          example: ONLINE_APPLE_PAY_DESCRIPTION
          description: A description of the code
    AdhocAuthorisationPaymentMethod:
      type: array
      items:
        $ref: "#/components/schemas/AdhocAuthorisationPaymentMethodObject"
    DeepLink:
      type: object
      required:
        - operator
        - urls
      properties:
        operator:
          type: string
          description: The name of the operator that the deeplinks are related to.
        urls:
          type: array
          items:
            type: string
          description: A list of urls that can be used to deeplink to the charger.
    Oem2AmenityDistance:
      type: object
      required:
        - type
        - distance
      properties:
        type:
          type: string
          description: The type of the amenity.
          example: restaurant
        distance:
          type: integer
          description: The distance in meters.
          example: 100
    Oem2Evse:
      type: object
      description: |
        Per-EVSE source data the parsed charger does not model. An EVSE appears only
        if it carries at least one of these fields.
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/EvseUId"
        parking:
          type: object
          additionalProperties: true
          description: |
            Parking information as published by the data-source, passed through
            unmodified. The fields are source-defined rather than part of this API:
            they are not validated and may change without a version bump, so
            consumers must tolerate unknown and missing keys.

            Currently only populated for the Eco-Movement trucks feed, which sends:

            | Field | Type | Notes |
            |-------|------|-------|
            | `vehicle_types` | array of string | `VAN`, `RIGID`, `SEMI_TRACTOR`, `TRUCK_WITH_TRAILER` |
            | `truck_with_trailer_verification` | string | `VERIFIED`, `DESIGNED` |
            | `reservation_required` | boolean | |
            | `dangerous_goods_allowed` | boolean | |
            | `direction` | string | `PARALLEL`, `PERPENDICULAR` |
            | `max_vehicle_height` | integer | centimetres |
            | `max_vehicle_width` | integer | centimetres |
            | `max_vehicle_length` | integer | centimetres |
            | `max_vehicle_weight` | integer | kilograms |
          example:
            vehicle_types:
              - TRUCK_WITH_TRAILER
            truck_with_trailer_verification: DESIGNED
            reservation_required: false
        parkingRestrictions:
          type: array
          items:
            type: string
          description: |
            Who may park at this EVSE, passed through from the data-source unmodified
            and unvalidated. OCPI `parking_restrictions`, so expect the OCPI 2.2.1
            values: `CUSTOMERS`, `DISABLED`, `EMPLOYEES`, `EV_ONLY`, `MOTORCYCLES`,
            `PLUGGED`, `TAXI`, `TOW_TRUCK`.
          example:
            - CUSTOMERS
            - EV_ONLY
    ExtendedInfo:
      type: object
      required:
        - amenityDistances
      properties:
        type:
          $ref: "#/components/schemas/LocationType"
        locationType:
          $ref: "#/components/schemas/DerivedLocationType"
        chargingWhenClosed:
          $ref: "#/components/schemas/ChargingWhenClosed"
        openingTimes:
          $ref: "#/components/schemas/OpeningTimes"
        derivedOpeningTimes:
          $ref: "#/components/schemas/OpeningTimes"
        energyMix:
          $ref: "#/components/schemas/EnergyMix"
        predictedOccupancy:
          $ref: "#/components/schemas/PredictedOccupancy"
        roaming:
          $ref: "#/components/schemas/Roaming"
        supportPhoneNumber:
          $ref: "#/components/schemas/SupportPhone"
        adhocAuthorisationPaymentMethod:
          $ref: "#/components/schemas/AdhocAuthorisationPaymentMethod"
        deepLinks:
          type: array
          description: A list of deeplinks that can be used for additional information, payment, etc.
          items:
            $ref: "#/components/schemas/DeepLink"
        amenityDistances:
          type: array
          items:
            $ref: "#/components/schemas/Oem2AmenityDistance"
          description: |
            The distance to the closest amenity, grouped by amenity-type. If an entry is missing
            there are no amenities of the type located closely.
        evses:
          type: array
          items:
            $ref: "#/components/schemas/Oem2Evse"
          description: |
            Per-EVSE information that is only available for some sources. Entries are
            omitted for EVSEs that carry none, so this array may be shorter than the
            charger's own `evses`.
        restrictions:
          type: array
          items:
            type: string
          description: |
            Charger-level access restrictions, passed through from the data-source
            unmodified and unvalidated. `item.accessibility` carries the same fact in
            normalised form; this is the source's exact strings, including values the
            normalised enum drops.
          example:
            - ONLY_TRUCKS
    SuccessOem2DetailedCharger:
      type: object
      required:
        - status
        - item
        - additionalInfo
      properties:
        status:
          type: string
          enum:
            - ok
          description: Describes the status of the request.
        item:
          $ref: "#/components/schemas/DetailedCharger"
        additionalInfo:
          $ref: "#/components/schemas/ExtendedInfo"
    Oem2GetDetailedCharger:
      type: object
      oneOf:
        - $ref: "#/components/schemas/GetItemError"
        - $ref: "#/components/schemas/SuccessOem2DetailedCharger"
      discriminator:
        propertyName: status
        mapping:
          ok: "#/components/schemas/SuccessOem2DetailedCharger"
          error: "#/components/schemas/GetItemError"
  responses:
    PlanOk:
      description: A positive response from the plan endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlanResult"
    PlanBadRequest:
      description: A response with a message.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
              - errors
            properties:
              message:
                type: string
              errors:
                type: array
                items:
                  $ref: "#/components/schemas/PlanUsageError"
                description: An array with enums specifying the type of usage error.
    WithMessage:
      description: A response with a message.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    AmenityCandidatesOk:
      description: A positive response from the amenity candidates endpoint.
      content:
        application/json:
          schema:
            type: object
            required:
              - searches
              - plan
            properties:
              searches:
                type: array
                items:
                  $ref: "#/components/schemas/AmenityCandidateSearchResult"
              plan:
                $ref: "#/components/schemas/PlanResult"
    PreliminaryRouteOk:
      description: The route geometry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PreliminaryRoutePolyline"
    RefreshOk:
      description: A positive response from the refresh endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlanResult"
    AmenityCandidatesAlongRouteOk:
      description: A positive response from the amenity candidates endpoint.
      content:
        application/json:
          schema:
            type: object
            required:
              - searches
            properties:
              searches:
                type: array
                items:
                  $ref: "#/components/schemas/AmenityCandidateSearchResult"
    AbrpPlanOk:
      description: A positive response from the plan endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AbrpPlan"
    AbrpRefreshOk:
      description: A positive response from the refresh endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AbrpPlan"
    AbrpAmenityCandidatesOk:
      description: A positive response from the amenity candidates endpoint.
      content:
        application/json:
          schema:
            type: object
            required:
              - searches
