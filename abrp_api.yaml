      description: |
        Get point-of-interest (POI) autosuggest for a given query using multiple search modes.
        This endpoint provides POI suggestions including places, addresses, chargers, ferries,
        and other POIs based on the specified modes.

        **Modes:**
        - `FERRY` - Search for ferry routes
        - `CHARGER` - Search for EV chargers
        - `HERE` - Search for places using HERE API
        - `GOOGLE_AUTOSEARCH` - Search for places using Google Places API

        Each mode type can only appear once in the modes array. All modes run in parallel
        and results are merged into a single response.

        When using `GOOGLE_AUTOSEARCH` mode, the `google_session` field in the response should
        be reused in subsequent calls and is required for the `/poi/autosuggest/result` endpoint.
