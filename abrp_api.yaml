      properties:
        polyline:
          type: string
          description: Route geometry as a polyline6 string, `lat, lon` order.
        waypoints:
          type: array
          description: Each requested point as OSRM snapped it onto the road, `[lat, lon]`, in request order.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
              format: double
    Degrees:
      type: number
