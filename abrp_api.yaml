          discriminator:
            propertyName: type
            mapping:
              afterDestinationIndex: "#/components/schemas/AfterDestinationIndexOption"
              atDestinationIndex: "#/components/schemas/AtDestinationIndexOption"
              afterCurrentPosition: "#/components/schemas/AfterCurrentPositionOption"
        whereOnLeg:
          oneOf:
            - $ref: "#/components/schemas/AfterTimeOption"
            - $ref: "#/components/schemas/AroundPointOption"
          discriminator:
            propertyName: type
            mapping:
              afterTime: "#/components/schemas/AfterTimeOption"
              aroundPoint: "#/components/schemas/AroundPointOption"
        cursor:
          type: string
          description: Opaque token for retrieving the next set of results.
    AmenityCandidatesRequest:
      type: object
      required:
        - searches
        - planRequest
      properties:
        searches:
          type: array
          items:
            $ref: "#/components/schemas/AmenityChargerCandidatesSearchFilter"
        planRequest:
          $ref: "#/components/schemas/PlanRequest"
    AmenityCandidate:
      type: object
