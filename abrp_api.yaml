            $ref: "#/components/schemas/ReducedSpeedSegment"
          description: TO BE WRITTEN.
        polyline:
          $ref: "#/components/schemas/PolylineWithPrecision"
        geometryPointInfo:
          $ref: "#/components/schemas/GeometryPointInfo"
        instructions:
          type: array
          items:
            $ref: "#/components/schemas/Instruction"
          description: TO BE WRITTEN.
        speedLimits:
          type: array
          items:
            $ref: "#/components/schemas/SpeedLimitSegment"
          description: TO BE WRITTEN.
        ferries:
          type: array
          items:
            $ref: "#/components/schemas/FerrySegment"
          description: TO BE WRITTEN.
        tolls:
          type: array
          items:
            $ref: "#/components/schemas/TollSegment"
