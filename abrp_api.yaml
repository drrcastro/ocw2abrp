        variants:
          type: array
          items:
            $ref: "#/components/schemas/ChargerImageVariant"
        blurHash:
          type: string
          description: A hash that can be used to create a blurred placeholder of the image.
          example: L5H2EC=PM+yV0g-mq.wG9G9G9G9G
    ChargerImages:
      type: object
      required:
        - images
      properties:
        images:
          type: array
          items:
            $ref: "#/components/schemas/ChargerImage"
    ChargerEvseStatusesEntry:
      type: object
      required:
        - chargerId
        - evses
      properties:
        chargerId:
          $ref: "#/components/schemas/ChargerId"
        evses:
          type: object
          description: Mapping of EVSE uIDs to the index of the charger status array.
          additionalProperties:
            type: integer
          example:
            "1": 0
            "2": 2
    NetworkId:
      type: integer
      format: int64
      description: Unique identifier for a network.
      minimum: 1
    ChargerTileKey:
      type: string
      format: byte
      description: A key describing a quantized area of chargers.
      example: ChIJAAAAAGDAS0ARAAAAAAAxKkASEgkAAAAAAMZLQBEAAAAAAF4qQBgMIJURKO8ZMAFCDAj8udWwBhC8m8n6Ag==
    GeoSearchGroupEntry:
      type: object
      required:
        - id
        - score
        - lat
        - long
        - maxPower
      properties:
        id:
          type: integer
          description: A unique identifier for the charger.
        score:
          type: number
          description: The score of the charger. Comparable across tiles.
        lat:
          $ref: "#/components/schemas/Lat"
        long:
          $ref: "#/components/schemas/Long"
        maxPower:
          type: number
          description: The maximum power that the charger can supply [W].
          example: 107500
      description: A charger entry that is hidden by a better charger.
    GeoSearchChargerTags:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/CardId"
          description: A list of card ids supported by the charger.
        features:
          type: array
          items:
            $ref: "#/components/schemas/ChargerFeature"
        truckCompatible:
          type: boolean
          example: true
          description: |
            Present and true when the charger can physically accommodate a truck with
            trailer. Derived from the charger belonging to the `trucks` group, which is
            set when the operator advertises truck-with-trailer parking for any of its
            evses. This is a capability rather than a restriction: such a charger is
            usually open to cars as well.
        truckOnly:
          type: boolean
          example: true
          description: |
            Present and true when the charger is in the `only_trucks` group (an
            `ONLY_TRUCKS` access restriction). Independent of `truckCompatible`.
      description: |
        A tag is only present iff it is requested and the charger matches it.
    TiledCharger:
      allOf:
        - $ref: "#/components/schemas/GeoChargerBase"
        - type: object
          required:
            - evseSummary
            - score
            - normalizedScore
          properties:
            evseSummary:
              type: array
              items:
                $ref: "#/components/schemas/EvseSummary"
              description: A summary of the evses of the chargers. Grouped by the standards supported by the evse.
            score:
              type: number
              description: The score of the charger. Can be used to order chargers across tiles.
            normalizedScore:
              type: number
              minimum: 0
              maximum: 1
              description: The normalized score of the charger (0-1). Can be used to order the objects within a tiles.
            group:
              type: array
              items:
                $ref: "#/components/schemas/GeoSearchGroupEntry"
              description: A list of chargers that are hidden due to this entry.
            tags:
              $ref: "#/components/schemas/GeoSearchChargerTags"
              description: Conditional based on the requested tags. If no tags are present, the object is omitted.
    ChargerTile:
      type: object
      required:
        - chargers
        - key
      properties:
        chargers:
          type: array
          items:
            $ref: "#/components/schemas/TiledCharger"
          description: A list of chargers contained in the box.
        key:
          $ref: "#/components/schemas/ChargerTileKey"
    TiledChargerSearchMetaBBox:
      type: object
      required:
        - southWest
        - northEast
      description: |
        The corners of the bbox. The bbox is never tiled, i.e. these are the max/min values.
      properties:
        southWest:
          $ref: "#/components/schemas/Coordinates"
        northEast:
          $ref: "#/components/schemas/Coordinates"
    TiledChargerSearchMeta:
      type: object
      required:
        - onlyFastChargers
        - boundingBox
      properties:
        onlyFastChargers:
          type: boolean
          description: |
            Slow chargers is only allowed at closer zoom-levels. This value conveys if slow-chargers was considered.
            A chargers is considered slow if all outlets have power bellow 50kWh.
        boundingBox:
          $ref: "#/components/schemas/TiledChargerSearchMetaBBox"
    GeoSearchCharger:
      allOf:
        - $ref: "#/components/schemas/TiledCharger"
        - type: object
          properties:
            name:
              $ref: "#/components/schemas/Name"
            address:
              $ref: "#/components/schemas/Address"
    GeoSearchChargerIdGroupEntry:
      type: object
      required:
        - id
        - score
      properties:
        id:
          $ref: "#/components/schemas/ChargerId"
        score:
          type: number
          description: The score of the charger. Comparable across tiles.
        lat:
          $ref: "#/components/schemas/Lat"
          description: Only present when `annotations.coordinates` is true on the request.
        long:
          $ref: "#/components/schemas/Long"
          description: Only present when `annotations.coordinates` is true on the request.
        maxPower:
          type: number
          description: |
            The maximum power that the charger can supply [W].
            Only present when `annotations.maxPower` is true on the request.
          example: 107500
      description: A charger entry that is hidden by a better charger.
    GeoSearchChargerId:
      type: object
      required:
        - id
        - score
        - normalizedScore
      properties:
        id:
          $ref: "#/components/schemas/ChargerId"
        score:
          type: number
          description: The score of the charger. Can be used to order chargers across tiles.
        normalizedScore:
          type: number
          minimum: 0
          maximum: 1
          description: The normalized score of the charger (0-1). Can be used to order the objects within a tiles.
        lat:
          $ref: "#/components/schemas/Lat"
          description: Only present when `annotations.coordinates` is true on the request.
        long:
          $ref: "#/components/schemas/Long"
          description: Only present when `annotations.coordinates` is true on the request.
        maxPower:
          type: number
          description: |
            The maximum power that the charger can supply [W].
            Only present when `annotations.maxPower` is true on the request.
          example: 107500
        group:
          type: array
          items:
            $ref: "#/components/schemas/GeoSearchChargerIdGroupEntry"
          description: A list of chargers that are hidden due to this entry.
    ChargerIdTile:
      type: object
      required:
        - chargers
      properties:
        chargers:
          type: array
          items:
            $ref: "#/components/schemas/GeoSearchChargerId"
          description: A list of chargers contained in the box.
    ChargerDetourStatus:
      type: string
      enum:
        - OK
        - UNROUTABLE
        - TIMEOUT
        - UNAVAILABLE
      x-enum-varnames:
        - ChargerDetourStatusOK
        - ChargerDetourStatusUNROUTABLE
        - ChargerDetourStatusTIMEOUT
        - ChargerDetourStatusUNAVAILABLE
      description: |
        Outcome of the detour measurement for one charger.
        - `OK`: `detourDistanceM`, `detourDurationS`, `accessFromPointIdx`,
          `accessDistanceM` and `accessDurationS` are set.
        - `UNROUTABLE`: no road route reaches the charger from this route (on
          an island, say). Retrying will not help.
        - `TIMEOUT`: the request ran out of time before this charger was measured.
          Retrying may help.
        - `UNAVAILABLE`: the detour could not be measured right now.
    ChargerDetour:
      type: object
      required:
        - id
        - detourStatus
      properties:
        id:
          $ref: "#/components/schemas/ChargerId"
        distanceAlongRouteM:
          type: number
          minimum: 0
          description: |
            Driving distance in meters from the start of the polyline to the
            charger: the distance along the polyline to `accessFromPointIdx` plus
            `accessDistanceM`. Present only when `detourStatus` is `OK`.
        detourDistanceM:
          type: number
          minimum: 0
          description: |
            Extra driving distance in meters for stopping at the charger. Present
            only when `detourStatus` is `OK`.
        detourDurationS:
          type: number
          minimum: 0
          description: |
            Extra driving time in seconds for stopping at the charger. Driving
            only; charging time is not included. Present only when
            `detourStatus` is `OK`.
        accessFromPointIdx:
          type: integer
          minimum: 0
          description: |
            Index into the request polyline's points, before the charger, that
            `accessDurationS` and `accessDistanceM` are measured from. Present only
            when `detourStatus` is `OK`.
        accessDistanceM:
          type: number
          minimum: 0
          description: |
            Driving distance in meters from `accessFromPointIdx` to the charger,
            including the part still on the route before the turn-off. Present only
            when `detourStatus` is `OK`.
        accessDurationS:
          type: number
          minimum: 0
          description: |
            Driving time in seconds from `accessFromPointIdx` to the charger,
            including leaving the route and any turn needed to reach the charger's
            side of the road. To get the time to reach the charger from the current
            position, take the plan leg's `remainingRouteDurationSec` at the current
            point, subtract it at `accessFromPointIdx`, and add this value. Present
            only when `detourStatus` is `OK`.
        detourStatus:
          $ref: "#/components/schemas/ChargerDetourStatus"
    MetaPagination:
      type: object
      required:
        - endCursor
      properties:
        endCursor:
          type: string
          description: |
            The opaque cursor to start from. Note that the curser has a limited lifetime.
          example: opaque-cursor
        hasNextPage:
          type: boolean
          description: |
            If present tells the caller that there are more items to fetch with the
            provided cursor
          example: true
