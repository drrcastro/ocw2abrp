            - afterDestinationIndex
        index:
          type: integer
          minimum: 0
    AtDestinationIndexOption:
      type: object
      required:
        - type
        - index
      properties:
        type:
          type: string
          enum:
            - atDestinationIndex
        index:
          type: integer
          minimum: 0
    AfterCurrentPositionOption:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - afterCurrentPosition
    AfterTimeOption:
      type: object
      required:
        - type
