                      $ref: "#/components/schemas/ChargeCard"
    ChargeCardByIdOk:
      description: Detailed information about a single charge card.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChargeCard"
    ChargeCardSearchOk:
      description: Returns a list of charge cards.
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/ChargeCard"
    ChargeCardGetOk:
      description: Detailed information about a list of charge cards.
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/GetChargeCard"
    AmenitiesOk:
      description: Query result.
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/AmenityFullDistance"
    ChargingSessionsOk:
      description: Positive response with information about the charging sessions.
      content:
        application/json:
          schema:
            required:
              - vehicleTelemetry
              - chargerTelemetry
              - userReports
            properties:
              vehicleTelemetry:
                $ref: "#/components/schemas/VehicleTelemetryChargingSessions"
              chargerTelemetry:
                $ref: "#/components/schemas/ChargerTelemetryChargingSessions"
              userReports:
                $ref: "#/components/schemas/UserReportedChargingSessions"
    VehicleListOk:
      description: Positive response with the reference consumption.
      content:
        application/json:
          schema:
            type: object
            required:
              - vehicles
              - options
              - display
            properties:
              vehicles:
                type: array
                items:
                  $ref: "#/components/schemas/ListVehicle"
              options:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleOptionItem"
              display:
                type: array
                items:
                  $ref: "#/components/schemas/ListVehicleDisplay"
    Found:
      description: 302 Found redirect response with Location header
      headers:
        Location:
          description: The URL of the found resource
          schema:
            type: string
            format: uri
            example: https://example.com/resource/123
      content:
        application/json:
          schema:
            type: string
            example: Found
    ChargerCurveOk:
      description: Positive response with the charger requested charger curve.
      content:
        application/json:
          schema:
            type: object
            required:
              - times
            properties:
              times:
                type: array
                items:
                  $ref: "#/components/schemas/ChargerCurveTime"
    RefConsOk:
      description: Positive response with the reference consumption.
      content:
        application/json:
          schema:
            type: object
            required:
              - refCons
            properties:
              refCons:
                type: number
                description: The reference consumption [Wh/km].
              trailerConsumption:
                type: array
                description: |
                  Consumption with the requested trailer at common towing speeds: 80, 90, 100
                  and 110 km/h, and 50, 55, 60 and 65 mph. Only present when a trailer is
                  requested.
                items:
                  $ref: "#/components/schemas/ConsumptionAtSpeed"
    RouteShareListOk:
      description: A list of shares
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/RouteShareGroup"
    RouteShareVehicleStatusOk:
      description: The status of the vehicle in the share
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VehicleStatusTime"
        text/event-stream:
          schema:
            type: string
          example: |
            Same as the normal response but as a stream of events with data: as prefix
    SpeedCamerasOk:
      description: A list of speed cameras, potentially empty, ordered.
      content:
        application/json:
          schema:
            allOf:
              - type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SpeedCamera"
    TlmGetForVehicleOk:
      description: |
        Returns a tlm point, If content type is streaming it returns a stream of tlm points
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OutputPoint"
        text/event-stream:
          schema:
            type: string
          example: |
            Same as the normal response but as a stream of events with data: as prefix 
            e.g. `data: {"voltageV": 704}`
    TlmGetForVehiclesOk:
      description: |
        Not used used for help documenting the stream return
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OutputPointWithVehicleId"
        text/event-stream:
          schema:
            type: string
          example: |
            Same as the normal response but as a stream of events with data: as prefix 
            e.g. `data: {"voltageV": 704, "vehicleId": 1}`
    AppTlmPostTlmResponse:
      description: |
        The response to a tlm post request
      content:
        application/json:
          schema:
            type: object
            properties:
              mapInfo:
                $ref: "#/components/schemas/MapInfo"
              elevation:
                $ref: "#/components/schemas/Elevation"
    ExtendedInfoOk:
      description: Extended information.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExtendedInfo"
