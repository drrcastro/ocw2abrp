  /app/tlm:
    post:
      security:
        - TlmTokenAuth: []
          ApiKeyOptionalAuth: []
        - TlmTokenAuth: []
          ApiKeyInSessionAuth: []
      summary: (alpha) Post a batch of telemetry points using a legacy v1 telemetry token
      description: |
        The telemetry token authorizes the write. An api key is also required and must
        carry `post_data`; it attributes the points to an integration.

        Send it in `X-API-KEY`, or in `X-ABRP-SESSION` for clients that can only set that
        header; `X-API-KEY` wins when both are present. Create a key at
        https://abetterrouteplanner.com/home/app/api-keys/telemetry

        ### Signed requests

        Instead of `X-TLM-TOKEN`, a client can sign the request with the token, so the
        token never crosses the wire. This is one fixed profile of HTTP Message Signatures
        (RFC 9421) with a Content-Digest (RFC 9530); nothing else is accepted. Send all of:

        - `Content-Digest: sha-256=:<base64 SHA-256 of the body>:` over the body bytes
          exactly as sent, so over the gzip bytes when `Content-Encoding: gzip` is used.
        - `Signature-Input: s=("content-digest");keyid="<keyid>"`, where `<keyid>` is the
          first 32 characters of the lowercase hex SHA-256 of the token. No other label,
          component or parameter (no `alg`, no `created`).
        - `Signature: s=:<base64 HMAC-SHA256>:`, keyed with the token's bytes, over the
          RFC 9421 signature base: these two lines joined by `\n`, no trailing newline:

        ```
        "content-digest": <the Content-Digest value>
        "@signature-params": <the Signature-Input value after "s=">
        ```

        Test vector: token `0f1e2d3c-4b5a-6978-8796-a5b4c3d2e1f0` and body
        `[{"utc":1760360000,"soc":50}]` give keyid `40ed71cc50fb44c60cf82ea1061807ec`,
        `Content-Digest: sha-256=:04AX1We39fbKv2dKjfojft1+HxpZdbfMK2oFVt8xWIQ=:` and
        `Signature: s=:4f9JYu+fOS6wvT/Yn7ZhG1zEQjk0fDBzJvVEXXZ06cg=:`.

        The api key is still required. Sending `X-TLM-TOKEN` together with a signature
        header, or only some of the three, is `400`. Every signature that does not verify
        is `401` with the same response, whatever the reason. The signature covers only the
        body, so the endpoint binds it: a signed request must be a `POST` to exactly
        `/2/app/tlm`, with no query string. Any future endpoint that accepts this key must
        cover `@method` and `@path` in its own profile. A signed body may be at most 16 KiB
        as sent. There is no timestamp: an exact replay is accepted.
      operationId: app_tlm_post_with_token
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/tlmTokenOptional"
        - $ref: "#/components/parameters/tlmContentDigest"
        - $ref: "#/components/parameters/tlmSignatureInput"
        - $ref: "#/components/parameters/tlmSignature"
        - $ref: "#/components/parameters/apiKeyOptional"
        - $ref: "#/components/parameters/abrpSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InputPointList"
      responses:
        "200":
          $ref: "#/components/responses/AppTlmPostTlmResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /app/route-summarize:
    get:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: Get recent route summaries
      description: |
        Returns a list of recent route planning results with simplified data optimized for display.
        Useful for displaying route visualizations on kiosk displays or dashboards.

        Returns globally recent plans, so it requires a logged-in user holding the `kiosk` role
        (passed via `X-ABRP-SESSION`) in addition to an API key with the `kiosk` feature. Callers
        without a valid kiosk session receive `401`; logged-in users lacking the role receive `403`.
      operationId: get_app_route_summarize
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
        - in: query
          name: max_age_seconds
          schema:
            type: integer
            minimum: 1
            maximum: 3600
            default: 60
          description: Maximum age of routes to return in seconds
        - in: query
          name: cursor
          schema:
            type: string
          description: Pagination cursor from previous response to fetch next page of results
      responses:
        "200":
          description: Successfully retrieved route summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteSummaryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /ferry:
    get:
      security:
        - ApiKeyAuth: []
      summary: Search ferries by location
      description: |
        Search for ferry routes by geographic criteria. Supports both bounding box and radius-based searches.

        * For bounding box searches, returns ferries whose route geometry intersects with the specified area.
        * For radius searches, returns ferries with departure point locations within the radius from the given coordinates.
      operationId: ferry_search
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - in: query
          name: bbox
          schema:
            type: string
            pattern: ^-?\d+\.?\d*,-?\d+\.?\d*,-?\d+\.?\d*,-?\d+\.?\d*$
            example: 10.0,54.0,20.0,60.0
          description: |
            Bounding box as "west,south,east,north" coordinates.
            Returns ferries whose route geometry intersects with the specified bounding box.
        - in: query
          name: lat
          schema:
            $ref: "#/components/schemas/Lat"
          description: Latitude for radius search (must be used with lng and radius)
        - in: query
          name: lng
          schema:
            $ref: "#/components/schemas/Long"
          description: Longitude for radius search (must be used with lat and radius)
        - in: query
          name: radius
          schema:
            type: integer
            minimum: 100
            maximum: 100000
            example: 5000
          description: |
            Search radius in meters from the specified coordinates.
            Ferries are matched by their departure point location.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 10
          description: Maximum number of ferry routes to return
      responses:
        "200":
          description: Successfully retrieved ferry routes
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/Ferry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /ferry/{ferryId}:
    get:
      security:
        - ApiKeyAuth: []
      summary: Get ferry details by ID
      description: |
        Returns detailed information about a specific ferry route.
      operationId: ferry_by_id
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - in: path
          name: ferryId
          required: true
          schema:
            type: string
          description: Unique identifier for the ferry route
          example: 1349018822:{|alI}_xgArfqAana@
      responses:
        "200":
          description: Successfully retrieved ferry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ferry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /oem2/charger/{chargerId}/extended-info:
    get:
      security:
        - ApiKeyAuth: []
      summary: Get additional information about a specific charger.
      operationId: stellantis_extended_info
      tags:
        - charger
        - beta
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/chargerId"
      responses:
        "200":
          $ref: "#/components/responses/ExtendedInfoOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /oem2/charger/_get/details:
    post:
      security:
        - ApiKeyAuth: []
      summary: Get details about a specific charger.
      operationId: oem2_charger_details
      tags:
        - charger
      parameters:
        - $ref: "#/components/parameters/apiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargerDetailsRequest"
      responses:
        "200":
          $ref: "#/components/responses/Oem2ChargerDetailsOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
    ApiKeyOptionalAuth:
      type: apiKey
      in: header
      name: X-API-KEY
    AbrpSessionAuth:
      type: apiKey
      in: header
      name: X-ABRP-SESSION
    TlmTokenAuth:
      type: apiKey
      in: header
      name: X-TLM-TOKEN
    ApiKeyInSessionAuth:
      type: apiKey
      in: header
      name: X-ABRP-SESSION
      description: |
        An api key presented in the user-session header. `X-API-KEY` is the preferred
        location; this one is accepted for client compatibility on `/app/tlm` only. A
        value shaped like an ABRP user session is never treated as a key.
  parameters:
    abrpSession:
      name: X-ABRP-SESSION
      in: header
      description: The user session key for abrp users
      schema:
        type: string
        example: abrp_session_token
    abrpSessionRequired:
      name: X-ABRP-SESSION
      in: header
      description: The user session key for abrp users
      schema:
        type: string
        example: abrp_session_token
      required: true
    tlmTokenOptional:
      name: X-TLM-TOKEN
      in: header
      description: |
        Legacy telemetry token from v1 user_tokens table. Required unless the request is
        signed with Content-Digest, Signature-Input and Signature; never sent with them.
      schema:
        type: string
        example: 123a4567-8bcd-9012-e345-fgh6789i0123
    tlmContentDigest:
      name: Content-Digest
      in: header
      description: RFC 9530 digest of the body as sent, for a signed /app/tlm request.
      schema:
        type: string
        example: "sha-256=:04AX1We39fbKv2dKjfojft1+HxpZdbfMK2oFVt8xWIQ=:"
    tlmSignatureInput:
      name: Signature-Input
      in: header
      description: RFC 9421 signature parameters, for a signed /app/tlm request.
      schema:
        type: string
        example: s=("content-digest");keyid="40ed71cc50fb44c60cf82ea1061807ec"
    tlmSignature:
      name: Signature
      in: header
      description: RFC 9421 HMAC-SHA256 signature, for a signed /app/tlm request.
      schema:
        type: string
        example: "s=:4f9JYu+fOS6wvT/Yn7ZhG1zEQjk0fDBzJvVEXXZ06cg=:"
    typecodeParam:
      name: typecode
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Typecode"
    countryCode3:
      in: query
      name: countryCode3
      schema:
        $ref: "#/components/schemas/Country3"
    extraMassKg:
      name: extraMassKg
      in: query
      schema:
        type: number
        minimum: 0
        default: 0
        description: The extra mass of the vehicle in kg.
    vehicleConfigKey:
      name: vehicleConfigKey
      in: query
      schema:
        type: string
        description: The key of the vehicle configuration.  Typically either "default" or a UUID.  Sometimes associated with a drive mode (EG - Rivian).
        example: 123a4567-8bcd-9012-e345-fgh6789i0123
    vehicleConfigType:
      name: vehicleConfigType
      in: query
      schema:
        type: string
        description: The config type used to determine reference consumption.
        enum:
          - NORMAL
          - BICYCLE-BACK
          - BICYCLE-TOP
          - CARGO-BACK
          - CARGO-TOP
          - TRAILER-SMALL
          - TRAILER-MEDIUM
          - TRAILER-LARGE
          - TRAILER
          - ROLE
          - TYRES
          - OTHER
    trailerSize:
      name: trailerSize
      in: query
      description: |
        Size of a towed trailer. Requires trailerShape and trailerMassKg. By vehicle id, a
        trailer or configuration type saved with the vehicle configuration takes precedence.
      schema:
        $ref: "#/components/schemas/TrailerSize"
    trailerShape:
      name: trailerShape
      in: query
      description: |
        Shape of a towed trailer. Requires trailerSize and trailerMassKg. By vehicle id, a
        trailer or configuration type saved with the vehicle configuration takes precedence.
      schema:
        $ref: "#/components/schemas/TrailerShape"
    trailerMassKg:
      name: trailerMassKg
      in: query
      description: |
        Loaded mass of a towed trailer [kg]. Requires trailerSize and trailerShape. By vehicle
        id, a trailer or configuration type saved with the vehicle configuration takes
        precedence.
      schema:
        $ref: "#/components/schemas/TrailerMassKg"
    manualRefCons:
      name: manualRefCons
      in: query
      schema:
        type: number
        minimum: 50
        description: User Input reference consumption in Wh/km.  Only include if provided by the user.  If not included, the default consumption for the vehicle model will be used.
    apiKey:
      name: X-API-KEY
      in: header
      description: The api key
      required: true
      schema:
        type: string
        example: api_key
    chargerIdRequired:
      in: path
      required: true
      name: chargerId
      schema:
        $ref: "#/components/schemas/ChargerId"
      examples:
        Rifil:
          value: 134525594
          summary: Rifil MalmÃ¶
        tesla:
          value: 168
          summary: Tesla LÃ¶ddekÃ¶pinge
    chargerImageIdRequired:
      in: path
      required: true
      name: chargerImageId
      schema:
        $ref: "#/components/schemas/ChargerImageId"
    limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 500
      description: Maximum number of items to return.
    cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: The opaque cursor to start from, if not start from the beginning
      example: ""
    allowDeprecated:
      in: query
      name: allowDeprecated
      schema:
        $ref: "#/components/schemas/AllowDeprecated"
    typecodeInPath:
      in: path
      required: true
      name: typecode
      schema:
        $ref: "#/components/schemas/schemas-Typecode"
    apiKeyOptional:
      name: X-API-KEY
      in: header
      description: The api key
      schema:
        type: string
        example: api_key
    vehicleIdInPath:
      in: path
      required: true
      name: vehicleId
      description: The id of the vehicle .
      schema:
        type: integer
        format: int64
    routeShareHeaderKey:
      name: X-ABRP-RS
      in: header
      description: Secret key that identifies one share
      required: true
      schema:
        $ref: "#/components/schemas/RouteShareKeyEntry"
    wait:
      in: query
      name: wait
      required: false
      schema:
        type: boolean
      description: |
        Set this to try to wait for the operation to complete. This is not guaranteed to work,
        and are on best effort bases
      example: true
    routeShareHeaderKeyList:
      name: X-ABRP-RS
      in: header
      description: Secret keys that identifies one share, separated by comma
      required: true
      schema:
        type: array
        minItems: 1
        maxItems: 10
        items:
          $ref: "#/components/schemas/RouteShareKeyEntry"
    acceptHeader:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        example: application/json
        default: application/json
    routeShareHeaderKeyListOptional:
      name: X-ABRP-RS
      in: header
      description: Secret keys that identifies one share, separated by comma
      required: false
      schema:
        type: array
        minItems: 1
        maxItems: 10
        items:
          $ref: "#/components/schemas/RouteShareKeyEntry"
    vehiclesIdInQuery:
      in: query
      name: vehicleIds
      required: true
      explode: false
      schema:
        type: array
        items:
          type: integer
          format: int64
        uniqueItems: true
        description: |
          A list of vehicle ids to filter on.
    chargerId:
      in: path
      required: true
      name: chargerId
      schema:
        $ref: "#/components/schemas/ChargerId"
      examples:
        Rifil:
          value: 134525594
          summary: Rifil MalmÃ¶
        tesla:
          value: 168
          summary: Tesla LÃ¶ddekÃ¶pinge
  schemas:
    PerformanceMetricsGps:
      type: object
      properties:
        delaySeconds:
          type: number
          description: The delay in seconds between the GPS and the app.
        okCount:
          type: integer
          description: The number of times the GPS was ok.
        lowAccuracyCount:
          type: integer
          description: The number of times the GPS was low accuracy.
        laggingCount:
          type: integer
          description: The number of times the GPS was lagging.
    PerformanceMetricsBattery:
      type: object
      properties:
        levelPct:
          type: number
          minimum: -1
          maximum: 100
          description: Battery level of the device as a percentage. A negative value means that the device doesn't support retrieving the battery level.
        state:
          type: string
          enum:
            - CHARGING
            - UNPLUGGED
            - FULL
          description: Current charging state of the battery.
    PerformanceMetricsDevice:
      type: object
      properties:
        platformName:
          type: string
          description: The name of the platform.
        manufacturer:
          type: string
          description: The manufacturer of the device.
        model:
          type: string
          description: The model of the device.
        osVersion:
          type: string
          description: The operating system version.
        totalMemoryBytes:
          type: integer
          description: The total memory of the device in bytes.
        totalHeapBytes:
          type: integer
          description: The total heap of the device in bytes.
    ThreadMetrics:
      type: object
      properties:
        totalUserTimeSeconds:
          type: number
        totalSystemTimeSeconds:
          type: number
        totalTimeSeconds:
          type: number
        deltaSystemTimeSeconds:
          type: number
        deltaUserTimeSeconds:
          type: number
        deltaTimeSeconds:
          type: number
    MapThread:
      type: object
      properties:
        deltaLoadFrac:
          type: number
        totalLoadFrac:
          type: number
    PerformanceMetrics:
      type: object
      required:
        - timestamp
        - appVersion
        - buildNumber
        - platform
      properties:
        timestamp:
          type: string
          format: date-time
          description: Time the metric was recorded.
        appVersion:
          type: string
          description: Version of the app.
        buildNumber:
          type: integer
          description: The build number of the app.
        platform:
          $ref: "#/components/schemas/Platform"
        mode:
          type: string
          enum:
            - PLANNING
            - DRIVING
        device:
          $ref: "#/components/schemas/PerformanceMetricsDevice"
        gps:
          $ref: "#/components/schemas/PerformanceMetricsGps"
        battery:
          $ref: "#/components/schemas/PerformanceMetricsBattery"
        heapUsageBytes:
          type: integer
          description: The heap usage of the app in bytes.
        uiFps:
          type: number
          description: The UI frames per second.
        jsFps:
          type: number
          description: The JS frames per second.
        mapFps:
          type: number
          description: The map frames per second.
        uptimeSeconds:
          type: number
        ramUsedBytes:
          type: integer
        ramLoadPercent:
          type: number
        uiThread:
          $ref: "#/components/schemas/ThreadMetrics"
        jsThread:
          $ref: "#/components/schemas/ThreadMetrics"
        mapThread:
          $ref: "#/components/schemas/MapThread"
        isPerfTest:
          type: boolean
          description: |
            Set to true when the metrics originate from an automated
            performance test client (e.g. the BrowserStack long-drive perf
            pipeline). The backend stores the flag on the doc as
            `is_perf_test`; downstream consumers (Kibana dashboards, the
            perf-CSV scraper) filter on it to include or exclude these
            rows. Optional; defaults to false.
    NetworkCountryBoost:
      type: object
      required:
        - type
        - country
      properties:
        type:
          type: string
          description: Discriminator for the boost type.
        country:
          $ref: "#/components/schemas/Country3"
      description: |
        Impacts the sorting of the items. Increases the score of items with a lot of chargers in the specified country.
    NetworkLocationBoost:
      allOf:
        - $ref: "#/components/schemas/Coordinates"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              description: Discriminator for the boost type.
      description: |
        Impacts the sorting of the items. Looks up a country based on the coordinates, and improve the rating of networks with lots of chargers within the country.
    NetworkFilter:
      type: object
      properties:
        name:
          type: string
          example: ion
          description: |
            Only networks with names matching the provided string will be returned.
            The quality of the match is weighted in the result order. Intended to be used as a search as you type feature.
    NetworkBoost:
      type: object
      properties:
        geoCount:
          type: object
          oneOf:
            - $ref: "#/components/schemas/NetworkCountryBoost"
            - $ref: "#/components/schemas/NetworkLocationBoost"
          discriminator:
            propertyName: type
            mapping:
              country: "#/components/schemas/NetworkCountryBoost"
              location: "#/components/schemas/NetworkLocationBoost"
        totalCount:
          type: boolean
          description: |
            Impacts the sorting of the items. Increases the score of items with a lot of chargers.
    AllowDefaultPrice:
      type: boolean
      description: If false, excludes cards that doesn't alter the price (same price as someone without a charge card).
      default: true
    CardSearchFilter:
      type: object
      properties:
        name:
          type: string
          example: Be Med
          description: |
            Only cards with names matching the provided string will be returned.
            The quality of the match is weighted in the results sort order. Intended to be used as a search as you type feature.
        allowDeprecated:
          $ref: "#/components/schemas/AllowDeprecated"
        allowDefaultPrice:
          $ref: "#/components/schemas/AllowDefaultPrice"
    CardSearchBoost:
      type: object
      properties:
        totalCount:
          type: boolean
          default: false
          description: |
            Impacts the sorting of the items. Increases the score of items with a lot of chargers.
    NotAccessible:
      type: object
      description: |
        Indicates that the charger is not accessible.
      required:
        - type
        - reason
      properties:
        type:
          type: string
          example: NotAccessible
        reason:
          type: string
          enum:
            - CLOSED_TO_PUBLIC
            - WRONG_OPENING_HOURS
            - OTHER
          description: An enum entry indicating why the charger is not accessible.
        description:
          type: string
          description: A text description of why the charger is not accessible.
    IssuesChargingReason:
      type: string
      enum:
        - NOT_OPERATIONAL
        - BLOCKED
        - ALL_STALLS_USED
        - MULTIPLE_ATTEMPTS_NEEDED
        - SLOW_CHARGING_SPEED
        - PAYMENT
        - OTHER
    IssuesCharging:
      type: object
      description: |
        Indicates that there was an issue with the charger.
      required:
        - type
        - reasons
      properties:
        type:
          type: string
          example: IssuesCharging
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/IssuesChargingReason"
        description:
          type: string
          description: A text description of what the issue is.
    IncorrectLocation:
      type: object
      description: Indicates that the location of the charger was incorrect.
      required:
        - type
      properties:
        type:
          type: string
          example: IncorrectLocation
        correctLocation:
          $ref: "#/components/schemas/Coordinates"
    IncorrectConnectorsCorrection:
      type: object
      required:
        - types
        - power
        - stalls
      properties:
        types:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorType"
        power:
          type: number
          description: The maximum power that can be supplied by the connector [kW].
          example: 150
          minimum: 0
        stalls:
          type: integer
          description: Number of stalls.
          example: 2
          minimum: 0
    IncorrectConnectors:
      type: object
      description: Indicates that the connectors of the charger are incorrect.
      required:
        - type
        - data
      properties:
        type:
          type: string
          example: IncorrectConnectors
        corrections:
          type: array
          items:
            $ref: "#/components/schemas/IncorrectConnectorsCorrection"
    IncorrectPricing:
      type: object
      description: Indicates that the pricing information is incorrect.
      required:
        - type
      properties:
        type:
          type: string
          example: IncorrectPricing
    IncorrectProvider:
      type: object
      description: |
        Indicates that the provider (CPO) is incorrect
      required:
        - type
        - correctProvider
      properties:
        type:
          type: string
          example: IncorrectProvider
        correctProvider:
          type: string
          example: Another Provider
    IncorrectLiveData:
      type: object
      description: Indicates that the availability is incorrect.
      required:
        - type
      properties:
        type:
          type: string
          example: IncorrectLiveData
        correction:
          type: string
          enum:
            - LESS_BUSY
            - MORE_BUSY
    CreateIssuePayloadIssue:
      oneOf:
        - $ref: "#/components/schemas/NotAccessible"
        - $ref: "#/components/schemas/IssuesCharging"
        - $ref: "#/components/schemas/IncorrectLocation"
        - $ref: "#/components/schemas/IncorrectConnectors"
        - $ref: "#/components/schemas/IncorrectPricing"
        - $ref: "#/components/schemas/IncorrectProvider"
        - $ref: "#/components/schemas/IncorrectLiveData"
      discriminator:
        propertyName: type
    CreateIssuePayload:
      type: object
      required:
        - issue
      properties:
        issue:
          $ref: "#/components/schemas/CreateIssuePayloadIssue"
        userLocation:
          $ref: "#/components/schemas/Coordinates"
          description: Users located close to the charger are more likely to be able to provide accurate information.
    AppUserFeedback:
      type: object
      required:
        - message
        - version
        - platform
      properties:
        message:
          type: string
          example: Great app, but I don't like the color schema.
          description: Free-text feedback message.
        version:
          type: string
          example: 1.0.1
          description: The current version of the application.
        platform:
          type: string
          example: ios
          description: The current platform.
      description: Payload for giving feedback on the application.
    VehicleTlmProviderLastSeen:
      type: object
      required:
        - provider
        - lastSeen
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        lastSeen:
          $ref: "#/components/schemas/DateTimeString"
      description: The latest indexed raw telemetry receipt from one provider within the 7-day window.
    TlmTokenTag:
      type: string
      enum:
        - carscanner
      example: carscanner
      description: |
        Which integration a vehicle telemetry token belongs to. A server-side
        vocabulary: unknown values are rejected rather than stored, so the set of
        tags cannot drift client-side. Tokens carrying no tag are the Generic
        connection: `create_vehicle_tlm_token` mints one when `tag` is omitted,
        but they are not listable and not revocable by tag.
    VehicleTlmToken:
      type: object
      required:
        - id
        - token
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 909
          description: Stable identifier for this token row.
        token:
          type: string
          example: 54ac054f-0412-4747-b788-bcc8c6b60f27
          description: |
            The token value to paste into the integration. Newly minted tokens are
            UUIDv4, but this is not constrained to that: the column is free-form and
            holds tokens minted by older code paths. Unlike a self-managed
            API key this is re-readable: a user replacing a phone must be able to
            re-enter the same token without breaking the existing setup.
        tag:
          $ref: "#/components/schemas/TlmTokenTag"
        createdAt:
          $ref: "#/components/schemas/DateTimeString"
      description: |
        A vehicle-scoped telemetry token. `tag` is absent for an untagged token â€”
        the Generic connection.
    CreateVehicleTlmTokenRequest:
      type: object
      properties:
        tag:
          $ref: "#/components/schemas/TlmTokenTag"
      description: |
        Optional configuration for `create_vehicle_tlm_token`. Omit `tag` â€” or the
        whole body â€” to mint an untagged Generic-connection token. An
        unrecognised `tag`, including an empty string, is rejected with `400`
        rather than treated as untagged.
    SelfManagedApiKey:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 909
          description: Stable, user-scoped identifier; pass to `delete_self_api_key`.
        appName:
          type: string
          nullable: true
          x-omitempty: false
          example: tesla-mobile
          description: Optional caller-supplied label set at creation.
      description: |
        Listing entry for a self-managed API key. Intentionally omits
        the secret value â€” secrets are returned exactly once at create
        time and cannot be re-fetched afterwards.
    CreateSelfManagedApiKeyRequest:
      type: object
      properties:
        appName:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9._\s-]{1,64}$
          example: Tesla Mobile
          description: |
            Optional human-readable label for the key. Visible only to
            the key's owner. Allowed characters: letters, digits, dot,
            underscore, hyphen, and whitespace (e.g. space, tab); length 1â€“64.
            Leading and trailing whitespace is trimmed server-side before storage.
      description: Optional configuration for `create_self_api_key`.
    CreatedSelfManagedApiKey:
      type: object
      required:
        - id
        - apiKey
      properties:
        id:
          type: integer
          format: int64
          example: 909
        apiKey:
          type: string
          format: uuid
          example: 54ac054f-0412-4747-b788-bcc8c6b60f27
          description: |
            The UUIDv4 secret. Returned exactly once â€” store it
            immediately. There is no API to retrieve it again; rotate
            by deleting and re-creating.
      description: Response body for `create_self_api_key`.
    UsageKey:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 367
          description: Pass as `keyId` to the other usage endpoints.
        name:
          type: string
          example: partner acme
          description: The key's operator-assigned name.
        appName:
          type: string
          nullable: true
          x-omitempty: false
          example: acme-ios
          description: Optional label set when the key was created.
      description: |
        One API key the caller may report on. Carries no secret and no traffic
        figures â€” only what the picker needs to name and select it.
    UsageHotspotBucket:
      type: object
      required:
        - lat
        - lng
        - count
      properties:
        lat:
          type: number
          format: double
          description: Latitude of the bucket centre (coarse grid).
        lng:
          type: number
          format: double
          description: Longitude of the bucket centre (coarse grid).
        count:
          type: integer
          format: int64
          minimum: 0
          description: Number of plans whose origin/destination fell in this bucket.
      description: A single coarse origin/destination hotspot bucket.
    UsageHotspots:
      type: object
      required:
        - origins
        - destinations
      properties:
        origins:
          type: array
          items:
            $ref: "#/components/schemas/UsageHotspotBucket"
          description: Anonymized origin hotspots, densest first.
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/UsageHotspotBucket"
          description: Anonymized destination hotspots, densest first.
      description: |
        Coarse, anonymized origin/destination hotspots for a business partner.
        Buckets below a minimum plan count are suppressed (k-anonymity); no
        exact coordinates or individual routes are exposed. Part of
        `UsageMetrics`, over its `windowStart`/`windowEnd`.
    UsageMetrics:
      type: object
      required:
        - totalRoutes
        - describedPlans
        - avgChargingStops
        - avgDistanceKm
        - avgDurationMin
        - avgWaypoints
        - plansPerUserPartialWindow
        - dayOfWeek
        - vehicleMix
        - vehicleMixTotal
        - vehicleMixDistinct
        - endpointMix
        - networkPreferences
        - granularity
        - series
        - hotspots
        - windowStart
        - windowEnd
      properties:
        totalRoutes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Successful `plan` calls in the window â€” the `ok` share of
            `endpointMix`'s `plan` row, and `series[].total` sums to it. Counted
            on the request path, so it includes plans that were served but whose
            stored plan document was never written; label a spread or a share
            with `describedPlans` instead.

            Failures are per-operation, in `endpointMix[].statuses`.
        describedPlans:
          type: integer
          format: int64
          minimum: 0
          example: 60847
          description: |
            How many of those plans have a stored plan document â€” the population
            every average, percentile, distribution, mix and hotspot here is
            computed over. Lower than `totalRoutes`, and covering only the window
            from `firstPlanAt` on.
        avgChargingStops:
          type: number
          format: double
          minimum: 0
          description: Mean number of charging stops per successful route.
        avgWaypoints:
          type: number
          format: double
          minimum: 0
          description: |
            Mean number of waypoints the caller asked to visit, per successful
            route. A REQUEST-side figure, unlike the other averages here, and
            independent of `avgChargingStops`: a two-waypoint trip can require
            no charges or six. Plans that recorded no waypoint count are absent
            from the average rather than counted as zero.
        avgDistanceKm:
          type: number
          format: double
          minimum: 0
          description: Mean planned route distance in kilometres.
        avgDurationMin:
          type: number
          format: double
          minimum: 0
          description: Mean estimated travel time in minutes.
        plansPerUser:
          type: number
          format: double
          minimum: 0
          nullable: true
          x-omitempty: false
          description: |
            Mean number of plans one identified end user made. Omitted/null
            when the partner's keys carry no user identifier, or when the
            window holds no identified traffic to measure.

            Measured directly, never extrapolated â€” but only over the part of
            the window that per-user records still cover, which is the last few
            weeks. See `plansPerUserPartialWindow`.

            No distinct-user headcount is returned alongside it: per-plan
            records carry no user identifier by design, so a headcount could
            only be `totalRoutes` divided by this ratio, which adds an
            extrapolation step and no information.
        plansPerUserPartialWindow:
          type: boolean
          description: |
            True when the requested window ran past the retention of the
            per-user records, so `plansPerUser` describes only the recent part
            of it rather than the whole. False when the ratio was measured over
            exactly the window asked for. Long windows are the true case.
        avgArrivalEnergyWh:
          type: number
          format: double
          minimum: 0
          nullable: true
          x-omitempty: false
          description: |
            Mean battery energy (Wh, already scaled by each vehicle's own
            capacity â€” not a state-of-charge percentage, and not comparable
            across a mixed fleet of different battery sizes) on arrival at
            the final destination, over successful routes. Omitted/null when
            no successful route in the window has a computable value.
        avgDepartureEnergyWh:
          type: number
          format: double
          minimum: 0
          nullable: true
          x-omitempty: false
          description: |
            Mean battery energy (Wh, same caveats as avgArrivalEnergyWh) at
            departure, over successful routes. Omitted/null when no
            successful route in the window has a computable value.
        dayOfWeek:
          type: array
          items:
            $ref: "#/components/schemas/UsageDayCount"
          description: |
            Route-calculation counts by day of week (UTC, 0 = Sunday), summed
            across the window, each entry carrying its own hour-of-day
            breakdown. Only weekdays the window actually spans are present, and
            a spanned weekday with no routes is present with a count of 0 â€” so
            an empty bar means "no traffic" while a missing bar means "outside
            the window". Summing every entry's `hourOfDay` gives the
            window-wide hour histogram; there is deliberately no separate
            top-level field for it.
        dayOfWeekLocal:
          type: array
          items:
            $ref: "#/components/schemas/UsageDayCount"
          description: |
            `dayOfWeek` bucketed by the local weekday and hour at each plan's
            ORIGIN rather than in UTC, using the zone the planner resolved for
            that route. `dayOfWeek` answers "when do the API calls arrive"; this
            answers "when are drivers planning".

            OMITTED when no plan in the window carries an origin timezone (every
            plan recorded before this field existed, and any unresolvable zone).
            Absent means "cannot be answered", never "no traffic", so its totals
            are less than or equal to `dayOfWeek`'s and the two must not be
            diffed. Weekday coverage can differ too: local days straddle UTC
            days.
        hourOfDayByCountry:
          type: array
          items:
            $ref: "#/components/schemas/UsageCountryHourCount"
          description: |
            The origin-local hour histogram split by the plan's country of
            origin, busiest country first. Countries beyond the response cap are
            dropped, not folded into an "other" row. OMITTED under the same rule
            as `dayOfWeekLocal`.
        vehicleMix:
          type: array
          items:
            $ref: "#/components/schemas/UsageVehicleCount"
          description: |
            Route-calculation counts by vehicle MODEL, densest first. Grouped
            to the `make:model` prefix â€” year, battery and trim are folded
            together, so every Elroq is one entry â€” and the FULL list is
            returned (a few hundred entries at most), not a top-N. Best-effort:
            a plan whose vehicle couldn't be resolved to a typecode is not
            represented.

            Use `vehicleMixTotal` / `vehicleMixDistinct` to size what this
            truncation hides â€” do NOT infer it from
            `totalRoutes - sum(vehicleMix)`, which conflates the long tail with
            plans that carried no resolvable vehicle:

              long-tail routes = vehicleMixTotal - sum(vehicleMix[].count)
              long-tail models = vehicleMixDistinct - vehicleMix.length
              no typecode      = totalRoutes - vehicleMixTotal
        vehicleMixTotal:
          type: integer
          format: int64
          minimum: 0
          description: |
            Route calculations across **all** typecodes in the window, not just
            the returned entries â€” i.e. the plans whose vehicle resolved to a
            typecode. Always >= the sum of `vehicleMix[].count`.
        vehicleMixDistinct:
          type: integer
          minimum: 0
          description: |
            Number of distinct typecodes seen in the window, from an approximate
            cardinality count. Always >= `vehicleMix.length`, and an UPPER bound
            on models: two trims of one model are two typecodes but one entry in
            `vehicleMix`.
        endpointMix:
          type: array
          items:
            $ref: "#/components/schemas/UsageEndpointCount"
          description: |
            Call volume per planner operation, busiest first â€” suitable for a
            share-of-calls chart. NOTE: this covers **every** planner call, not
            just the route calculations `totalRoutes` counts â€” most notably the
            periodic refreshes of an in-progress drive, which outnumber plans by
            roughly an order of magnitude. Its total is therefore a different
            (larger) denominator than `totalRoutes`.
        networkPreferences:
          $ref: "#/components/schemas/UsageNetworkPreferences"
        distanceKmPercentiles:
          $ref: "#/components/schemas/UsagePercentiles"
        durationMinPercentiles:
          $ref: "#/components/schemas/UsagePercentiles"
        chargingStopsPercentiles:
          $ref: "#/components/schemas/UsagePercentiles"
        waypointsPercentiles:
          $ref: "#/components/schemas/UsagePercentiles"
        distanceKmDistribution:
          $ref: "#/components/schemas/UsageDistribution"
        durationMinDistribution:
          $ref: "#/components/schemas/UsageDistribution"
        chargingStopsDistribution:
          $ref: "#/components/schemas/UsageDistribution"
        waypointsDistribution:
          $ref: "#/components/schemas/UsageDistribution"
        granularity:
          type: string
          enum:
            - day
          description: Bucket size of the `series` time-series. Always "day".
        series:
          type: array
          items:
            $ref: "#/components/schemas/UsageSeriesPoint"
          description: |
            Successful plan volume over time at the resolution given by
            `granularity`, from the same source as `totalRoutes` â€” the bars sum
            to it. The averages on each point come from the plan documents.
        windowStart:
          type: string
          format: date-time
          description: Window start (inclusive), as requested.
        windowEnd:
          type: string
          format: date-time
          description: Window end (exclusive).
        hotspots:
          $ref: "#/components/schemas/UsageHotspots"
        firstPlanAt:
          type: string
          format: date-time
          example: "2026-08-17T13:53:04Z"
          description: |
            Where this key's stored plan documents begin, present when that falls
            inside the window, and whenever the window holds no plans at all. The
            counts cover the whole window; the averages, distributions, mixes and
            hotspots start here, and a client should say so rather than presenting
            a short answer as the window's.

            In the empty case it is there to be offered: it names a period that
            does have route detail, alongside `planHistory`.
        planHistory:
          $ref: "#/components/schemas/UsagePlanHistory"
      description: |
        Aggregated, privacy-safe route-planning usage for a B2B partner.
        Contains only scalar aggregates â€” never individual routes,
        coordinates, or user identifiers.
    UsagePlanHistory:
      type: object
      required:
        - firstDay
        - lastDay
        - days
        - latestStart
        - latestDays
      properties:
        firstDay:
          type: string
          format: date
          example: "2026-01-14"
          description: Earliest UTC day with at least one successful plan.
        lastDay:
          type: string
          format: date
          example: "2026-09-03"
          description: Latest UTC day with at least one successful plan.
        days:
          type: integer
          minimum: 1
          example: 187
          description: |
            How many days carry plans, which is at most the span
            `firstDay`..`lastDay` and less than it wherever the key was quiet.
        latestStart:
          type: string
          format: date
          example: "2026-04-02"
          description: |
            Start of the shortest range ending on `lastDay` that holds
            `latestDays` plan-producing days. Gaps make this later than
            `lastDay` minus `latestDays`.
        latestDays:
          type: integer
          minimum: 1
          example: 30
          description: |
            Days of plans that range holds: the requested window's own length,
            or `days` when the key has fewer.
      description: |
        Where this key's plans are, independent of the requested window. Present
        only when the window holds none of them, which is the one case a client
        has to offer a different window instead of figures.

        Read from the same daily counts as `totalRoutes`, which run further back
        than the stored plan documents â€” so this is a DIFFERENT boundary from
        `firstPlanAt` and the two are not interchangeable. "On record" is the
        honest qualifier: the log's own start is not known here.
    UsageHourCount:
      type: object
      required:
        - hour
        - count
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
          description: Hour of day, UTC (0-23).
        count:
          type: integer
          format: int64
          minimum: 0
          description: Number of routes calculated in this hour, summed across the window.
      description: One hour-of-day bucket of the route-calculation histogram.
    UsageFlowHeatCell:
      type: object
      required:
        - lat
        - lng
        - count
      properties:
        lat:
          type: number
          format: double
          description: Cell centre latitude.
        lng:
          type: number
          format: double
          description: Cell centre longitude.
        count:
          type: integer
          format: int64
          minimum: 0
          description: Planned traversals summed over every road in this cell, both directions.
      description: One square of the density grid returned for wide viewports.
    UsageFlow:
      type: object
      required:
        - cells
        - precision
        - maxCount
        - truncated
        - windowStart
        - windowEnd
      properties:
        cells:
          type: array
          items:
            $ref: "#/components/schemas/UsageFlowHeatCell"
          description: |
            Density grid, busiest first. Not a top-N: every matching road
            contributes to a cell, so the grid represents all the data in view
            rather than the busiest slice.
        precision:
          type: integer
          minimum: 0
          maximum: 17
          description: |
            Geotile zoom of `cells`, so a client can compute a cell's extent
            (`360 / 2^precision` degrees of longitude) and draw it at the right
            size. Returned rather than re-derived by the client: it fixes the
            on-screen cell size, and a client guessing the server's rule would
            silently mis-size every cell once the rule changed.
        maxCount:
          type: integer
          format: int64
          minimum: 0
          description: Highest `count` present, so colour can be scaled in one pass.
        truncated:
          type: boolean
          description: |
            True when more cells matched than were returned. geotile_grid drops
            the SPARSEST buckets at its size limit, which in a heat map reads as
            holes in the data rather than as truncation.
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
      description: Road-traffic density for a viewport, as a grid of cells.
    UsageCountryHourCount:
      type: object
      description: |
        One country's own hour-of-day histogram, in the ORIGIN-local time of each
        plan â€” local rather than UTC because that is what makes two countries
        comparable at all. A country spanning several zones (USA) buckets per
        plan, so its histogram is its own mixture rather than one clock.
      required:
        - country
        - count
        - hourOfDay
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-3, capitals, as the planner resolved it.
          example: SWE
        count:
          type: integer
          format: int64
          minimum: 0
          description: |
            Plans from this country in the window. Always the sum of this
            entry's own `hourOfDay` counts.
        hourOfDay:
          type: array
          items:
            $ref: "#/components/schemas/UsageHourCount"
          description: |
            This country's 0-23 histogram in origin-local time, summed across
            every day of the window. Hours with no plans are omitted.
    UsageDayCount:
      type: object
      required:
        - weekday
        - count
        - hourOfDay
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Day of week, UTC, 0 = Sunday through 6 = Saturday.
        count:
          type: integer
          format: int64
          minimum: 0
          description: Number of routes calculated on this weekday, summed across the window.
        hourOfDay:
          type: array
          items:
            $ref: "#/components/schemas/UsageHourCount"
          description: |
            This weekday's own hour-of-day histogram (UTC, 0-23). Weekend and
            weekday demand are shaped differently, so a window-wide hour
            histogram averages the difference away.
      description: One day-of-week bucket of the route-calculation histogram.
    UsageStatusCount:
      type: object
      required:
        - status
        - count
      properties:
        status:
          type: string
          description: |
            `ok` for any 2xx, otherwise the HTTP status code as a string
            (`400`, `500`). Not a closed enum â€” treat an unrecognised value as
            its own bucket rather than assuming success.
        count:
          type: integer
          format: int64
          minimum: 0
          description: Calls that ended with this status, summed across the window.
      description: One outcome bucket of an endpoint's call volume.
    UsageEndpointCount:
      type: object
      required:
        - operation
        - count
        - statuses
      properties:
        operation:
          type: string
          description: The API operation (endpoint) name.
        count:
          type: integer
          format: int64
          minimum: 0
          description: |
            Total calls to this operation across the window â€” the sum over
            `statuses`. Use this alone for a share-of-calls chart.
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/UsageStatusCount"
          description: Per-outcome breakdown, most common first.
      description: Call volume for one API operation across the window.
    UsageNetworkCount:
      type: object
      required:
        - name
        - count
      properties:
        name:
          type: string
          description: |
            Display name of the charging network (e.g. `Ionity`, `Tesla
            Supercharger`). The only identifier returned â€” the network's numeric
            id is deliberately not exposed, since it is an internal key.
        count:
          type: integer
          format: int64
          minimum: 0
          description: |
            Plans that expressed this preference about this network, summed
            across the window.
      description: One charging network, and how many plans said this about it.
    UsageNetworkPreferences:
      type: object
      required:
        - extraLike
        - like
        - dislike
      properties:
        extraLike:
          type: array
          items:
            $ref: "#/components/schemas/UsageNetworkCount"
          description: Networks drivers asked to favour STRONGLY, busiest first.
        like:
          type: array
          items:
            $ref: "#/components/schemas/UsageNetworkCount"
          description: Networks drivers asked to favour, busiest first.
        dislike:
          type: array
          items:
            $ref: "#/components/schemas/UsageNetworkCount"
          description: Networks drivers asked to avoid, busiest first.
      description: |
        Which charging networks this partner's drivers asked the planner to
        favour or avoid, split by how strongly. The full list is returned, not a
        top-N. Each list is empty when no plan in the window expressed that
        preference â€” which is the common case, since the planner's default is
        "no opinion" and only an explicitly set preference is recorded.

        **These counts do not partition the plans.** One plan may name several
        networks, and may favour some while avoiding others, so it contributes to
        several buckets across all three lists. Summing them is meaningless; the
        only honest denominator for a share is `totalRoutes`.
    UsageVehicleCount:
      type: object
      required:
        - typecode
        - count
      properties:
        typecode:
          type: string
          description: |
            `make:model` prefix of the plan typecode (e.g. `skoda:elroq`), not
            a full typecode â€” trim, year and battery are grouped away.
        count:
          type: integer
          format: int64
          minimum: 0
          description: Number of routes calculated for this vehicle, summed across the window.
      description: One vehicle-typecode bucket of the vehicle mix.
    UsageBin:
      type: object
      required:
        - from
        - count
      properties:
        from:
          type: number
          format: double
          minimum: 0
          description: |
            Lower edge of the bin, inclusive. The bin covers
            `[from, from + width)` of the enclosing distribution, except the
            overflow bin which has no upper bound.
        count:
          type: integer
          format: int64
          minimum: 0
          description: Plans whose value fell in this bin.
        overflow:
          type: boolean
          description: |
            True for the final catch-all bin, which holds every plan at or above
            `from` with no upper bound. Render it as "from+" rather than as a
            range. At most one bin per distribution has this set.
      description: One bar of a value histogram.
    UsageDistribution:
      type: object
      required:
        - width
        - bins
      properties:
        width:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: |
            Bin width in the metric's own units. 1 for an integer metric, where
            each bin is therefore one exact value.
        bins:
          type: array
          items:
            $ref: "#/components/schemas/UsageBin"
          description: |
            Ascending by `from`, and only populated bins are present â€” a gap means
            no plan had a value there. Counts sum to every plan in the window that
            had a value for this quantity, including the overflow bin.
      description: |
        An exact value histogram over the window's plans, for drawing the shape of
        a distribution. Prefer this over deriving a shape from percentile points:
        for an integer metric several consecutive percentiles routinely share the
        same value, which yields zero-width bands rather than a readable shape.
    UsagePercentile:
      type: object
      required:
        - p
        - v
      properties:
        p:
          type: integer
          minimum: 0
          maximum: 100
          description: Which percentile this point is, e.g. 90.
        v:
          type: number
          format: double
          description: The value at that percentile, in the metric's own units.
      description: One point on a distribution.
    UsagePercentiles:
      type: array
      items:
        $ref: "#/components/schemas/UsagePercentile"
      description: |
        A distribution, as an ascending list of percentile points. Computed
        over the raw per-plan values, so unlike the retired rollup these are
        not quantised to a bucket width.

        Which percentiles are present is server-chosen and MAY change: read the
        list, and look points up by `p` rather than assuming a fixed length or
        order-position. Currently 1, 5, 10, 25, 50, 75, 90, 95, 99.
    UsageSeriesPoint:
      type: object
      required:
        - bucketStart
        - total
        - avgChargingStops
        - avgDistanceKm
        - avgDurationMin
      properties:
        bucketStart:
          type: string
          format: date-time
          description: Start of the day bucket (inclusive), RFC 3339.
        total:
          type: integer
          format: int64
          minimum: 0
          description: |
            Successful route calculations in this bucket. Failures are not
            bucketed per day â€” see `endpointMix` on the enclosing response.
        avgChargingStops:
          type: number
          format: double
          minimum: 0
          description: Mean charging stops per successful route in this bucket.
        avgDistanceKm:
          type: number
          format: double
          minimum: 0
          description: Mean planned route distance in kilometres in this bucket.
        avgDurationMin:
          type: number
          format: double
          minimum: 0
          description: Mean estimated travel time in minutes in this bucket.
      description: One day bucket of the route-volume time-series.
    FeaturebaseSsoOk:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: JWT token
    SimpleGeoSearchBoost:
      type: object
      properties:
        networkIds:
          type: array
          items:
            $ref: "#/components/schemas/NetworkId"
          description: Increases the score for chargers from the given list of networks.
        cardIds:
          type: array
          items:
            $ref: "#/components/schemas/CardId"
            description: Increases the score for chargers from the given list of charge cards.
      description: Alters the sorting of the chargers, and thereby also what chargers to be returned.
    DetailedGeoSearchBoost:
      type: object
      properties:
        reliability:
          type: boolean
          description: |
            Increase the score for chargers that are deemed more reliable. The score is a weighting
            of multiple factors, such as user reports, live data and the number of available stalls.
    GeoSearchBoost:
      type: object
      allOf:
        - $ref: "#/components/schemas/SimpleGeoSearchBoost"
        - $ref: "#/components/schemas/DetailedGeoSearchBoost"
    GeoSearchExclude:
      type: object
      properties:
        networkIds:
          type: array
          items:
            $ref: "#/components/schemas/NetworkId"
          description: Exclude chargers from the given list of networks.
    GeoSearchAvoid:
      type: object
      properties:
        networkIds:
          type: array
          items:
            $ref: "#/components/schemas/NetworkId"
          description: Avoid (dislike) chargers from the given list of networks.
    AmenityFilter:
      type: object
      required:
        - maxDistance
        - categories
      properties:
        maxDistance:
          type: integer
          minimum: 0
          example: 1500
          description: The maximum allowed distance in meters.
        categories:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AmenityType"
        subcategories:
          type: array
          items:
            $ref: "#/components/schemas/AmenitySubtype"
    PowerRangeEntry:
      type: object
      properties:
        lowerBound:
          type: integer
          minimum: 0
          example: 150000
          description: The lower-bound of the filter [W].
        upperBound:
          type: integer
          minimum: 0
          example: 150000
          description: The upper-bound of the filter [W].
    GeoSearchFilter:
      type: object
      properties:
        connectorTypes:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorType"
          example:
            - CCS
            - SC
            - TYPE2
          description: |
            Specifies the allowed types of connectors to return. An empty or not supplied value is interpreted as allow all.
        networkIds:
          type: array
          items:
            $ref: "#/components/schemas/NetworkId"
          description: Only include chargers from the given list of networks.
        cardIds:
          type: array
          items:
            $ref: "#/components/schemas/CardId"
          description: Only include chargers from the given list of charge cards.
        features:
          type: array
          items:
            $ref: "#/components/schemas/ChargerFeature"
          description: Only include chargers with the provided features.
        groups:
          type: array
          items:
            type: string
          example:
            - trucks
          description: Only include chargers in at least one of the given groups, e.g. `trucks` (fits a truck with trailer).
        amenities:
          $ref: "#/components/schemas/AmenityFilter"
          description: Only include chargers that matches the provided amenity filter.
        minimumRating:
          type: number
          minimum: 1
          maximum: 5
          example: 3.5
          description: Only include chargers that has an average rating higher than the provided value.
        minimumStalls:
          type: integer
          minimum: 1
          example: 2
          description: Only include chargers that have at least this many stalls (EVSEs).
        powerRanges:
          type: array
          items:
            $ref: "#/components/schemas/PowerRangeEntry"
          description: Only include chargers that has allowed outlets within one of the supplied ranges.
      description: Filters the result to only include chargers that matches the specified conditions.
    GeoSearchGroupingAuto:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          example: auto
          enum:
            - auto
        expand:
          type: boolean
          default: false
          example: false
          description: |
            Automatically removes the grouping when the number of chargers from a tiles is limited.
            Will automatically show a cluster of overlapping chargers for lower zoom-levels.
        excludeHiddenChargers:
          type: boolean
          default: false
          example: false
          description: |
            Determines if information about the hidden chargers is returned in the response.
      description: Automatically determine how the grouping of chargers is performed
    GeoSearchGroupingRadius:
      type: object
      required:
        - type
        - radiusM
      properties:
        type:
          type: string
          example: radius
          enum:
            - radius
        radiusM:
          type: number
          minimum: 1
          default: 1000
          description: |
            The radius in meters that chargers need to be within to be grouped.
      description: Automatically determine how the grouping of chargers is performed
    GeoSearchGrouping:
      type: object
      oneOf:
        - $ref: "#/components/schemas/GeoSearchGroupingAuto"
        - $ref: "#/components/schemas/GeoSearchGroupingRadius"
      discriminator:
        propertyName: type
        mapping:
          auto: "#/components/schemas/GeoSearchGroupingAuto"
          radius: "#/components/schemas/GeoSearchGroupingRadius"
      description: |
        Chargers that are located closely will be grouped and only one of them is returned.
        An additional group field will be returned with the chargers that describes which chargers has been hidden.
    GeoSearchTypecode:
      type: string
      description: |
        Customizes the behaviour of the endpoint based on the specified vehicle.
        For example it will only return chargers with supported connectorTypes and accounts for
        the vehicle limitations when weighting chargers. Any manually supplied parameters
        will override the attributes derived from the vehicle model.
      example: rivian:r1s:21:135
    GeosearchParamsBase:
      type: object
      properties:
        boost:
          $ref: "#/components/schemas/GeoSearchBoost"
        filter:
          $ref: "#/components/schemas/GeoSearchFilter"
          description: Filters the result to only include values that matches the specified conditions.
        avoid:
          $ref: "#/components/schemas/GeoSearchAvoid"
          description: Sets a lower score to chargers that matches any of the conditions.
        exclude:
          $ref: "#/components/schemas/GeoSearchExclude"
          description: Filters the result to exclude values that matches the conditions.
        typecode:
          $ref: "#/components/schemas/GeoSearchTypecode"
        grouping:
          $ref: "#/components/schemas/GeoSearchGrouping"
    GeoSearchParams:
      allOf:
        - $ref: "#/components/schemas/GeosearchParamsBase"
        - type: object
          properties:
            tags:
              $ref: "#/components/schemas/GeoSearchTags"
            mergeConnectorTypes:
              $ref: "#/components/schemas/MergeConnectorTypes"
            limit:
              type: integer
              minimum: 1
              maximum: 500
              default: 10
              description: Maximum number of chargers to be returned.
    GeoSearchTags:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/CardId"
        features:
          type: boolean
          description: If true, charger features will be included in the tag response.
        truckCompatible:
          type: boolean
          description: |
            If true, a truckCompatible tag will be included for chargers that can
            accommodate a truck with trailer.
        truckOnly:
          type: boolean
          description: |
            If true, a truckOnly tag will be included for chargers whose operator
            restricts them to trucks.
      description: |
        The payload of the returned chargers will include a tag for each condition they satisfies.
    GeoSearchIdAnnotations:
      type: object
      properties:
        coordinates:
          type: boolean
          description: |
            When true, include `lat` and `long` on each id-search result entry.
            Both are always returned together; partial coordinate opt-in is not supported.
        maxPower:
          type: boolean
          description: When true, include `maxPower` [W] on each id-search result entry.
      description: |
        Optional fields on id-only bbox search results.
        Omitted or false flags leave the default id-only payload unchanged.
    TiledParams:
      type: object
      properties:
        boost:
          $ref: "#/components/schemas/SimpleGeoSearchBoost"
        filter:
          $ref: "#/components/schemas/GeoSearchFilter"
        avoid:
          $ref: "#/components/schemas/GeoSearchAvoid"
        grouping:
          $ref: "#/components/schemas/GeoSearchGrouping"
        typecode:
          $ref: "#/components/schemas/GeoSearchTypecode"
        tags:
          $ref: "#/components/schemas/GeoSearchTags"
        mergeConnectorTypes:
          $ref: "#/components/schemas/MergeConnectorTypes"
        cachedTiles:
          type: array
          items:
            $ref: "#/components/schemas/ChargerTileKey"
          description: The clients currently cached tiles. There is a limit of 500 on how many tiles are allowed to cache.
          maximum: 500
        chargerDensity:
          type: number
          maximum: 1
          minimum: 0
          default: 0.6
          description: Determines the density of the chargers returned. A linear scale where 1 is the highest.
        expansion:
          type: object
          oneOf:
            - $ref: "#/components/schemas/RelativeTileExpansion"
          discriminator:
            propertyName: type
            mapping:
              relative: "#/components/schemas/RelativeTileExpansion"
    CoordsArray:
      allOf:
        - type: object
          required:
            - coordinates
          properties:
            coordinates:
              type: array
              items:
                $ref: "#/components/schemas/Coordinates"
          description: An array of coordinates.
    DirectionsBBox:
      allOf:
        - type: object
          required:
            - southWest
            - northEast
          properties:
            southWest:
              $ref: "#/components/schemas/Coordinates"
              description: The south-west corner of the bounding box.
            northEast:
              $ref: "#/components/schemas/Coordinates"
              description: The north-east corner of the bounding box.
          description: A bounding box constructed by the south-west and north-east corners.
    TiledSchema:
      allOf:
        - oneOf:
            - $ref: "#/components/schemas/DirectionsBBox"
            - $ref: "#/components/schemas/CoordsArray"
        - $ref: "#/components/schemas/TiledParams"
    RelativeTileExpansion:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - relative
        x:
          type: number
          minimum: 0
          default: 1
          maximum: 5
          example: 1
        "y":
          type: number
          minimum: 0
          default: 1
          maximum: 5
          example: 1
        preserveZoom:
          type: boolean
          default: false
          description: |
            This flag is highly recommended to enable.
            Use the original bounding box to determine the zoom level.
            It will ensure that the number of chargers returned within the current view of the user is more static.
      description: |
        Modifies the bounding-box from where the chargers are fetched.
        Commonly used with a values of ~1.25 to ensure that chargers are pre-loaded when panning.
        The functionality is the same as sending in a larger bounding-box.
        Note that it is common to send different values for x & y based in the proportions of the screen.
    UpgradeType:
      description: The type of upgrade that is available.
      example: LATEST
      type: string
      enum:
        - LATEST
        - CODE_PUSH
        - AVAILABLE
        - REQUIRED
    ReportChargingSessionPayload:
      type: object
      oneOf:
        - $ref: "#/components/schemas/ReportSuccessfulChargingSession"
      discriminator:
        propertyName: status
        mapping:
          SUCCESS: "#/components/schemas/ReportSuccessfulChargingSession"
    ChargeCurveEntryWithDuration:
      type: object
      required:
        - secondsSinceStart
      properties:
        secondsSinceStart:
          type: integer
          description: The duration since the start of the session in seconds.
        socFrac:
          $ref: "#/components/schemas/FracWiggle"
        powerW:
          $ref: "#/components/schemas/PowerW"
    ReportSuccessfulChargingSession:
      type: object
      required:
        - status
      properties:
        status:
          enum:
            - SUCCESS
        typecode:
          $ref: "#/components/schemas/Typecode"
          description: The typecode of the vehicle being charged.
        vehicleId:
          type: integer
          format: int64
          description: The vehicle ID of the vehicle being charged. If provided, `typecode` will be ignored.
        startTime:
          type: string
          format: date-time
          description: The start time of the session.
        chargeCurveWithDuration:
          type: array
          items:
            $ref: "#/components/schemas/ChargeCurveEntryWithDuration"
          description: The charge curve of the session.
        location:
          $ref: "#/components/schemas/Coordinates"
          description: The location of the charging session.
    AutoCompleteQuery:
      type: object
      required:
        - input
        - location
      properties:
        input:
          type: string
          description: |
            Input is the text string on which to search. The api will return matches based
            on this string and order results based on their relevance.
          example: Berlin
        offset:
          type: integer
          format: uint
          description: |
            Offset is the character position in the input term at which the service uses text
            for predictions. For example, if the input is 'Lond' and the completion point is
            3, the service will match on 'Lon'. The offset should generally be set to the
            position of the text caret. If no offset is supplied, the service will use the
            entire term.
          example: 0
        location:
          $ref: "#/components/schemas/Coordinates"
          description: |
            Origin is the point from which to calculate the straight-line distance to the
            destination.
        lang:
          type: string
          description: The language to use for the response. If not specified here it the language from the 'accept-language' header will be used.
          example: en-US
        connectorTypes:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorType"
          example:
            - CCS
            - SC
            - TYPE2
          maxItems: 20
          uniqueItems: true
          description: |
            Specifies the allowed types of connectors. An empty or not supplied value is interpreted
            as allow all.
    PoiProvider:
      type: string
      description: |
        The point-of-interest provider to use for the request.
      enum:
        - HERE
        - GOOGLE
        - PELIAS
    AutoCompleteProvider:
      type: string
      description: |
        Which search backend produced this result: the location providers, our own
        charger/ferry search, or a device-local source. Analytics only.
      enum:
        - HERE
        - GOOGLE
        - PELIAS
        - CHARGER
        - FERRY
        - HISTORY
        - SAVED
    AutoCompleteReportedItem:
      type: object
      description: |
        One found item as rendered. A `HISTORY` entry comes from client-side
        matching, so it carries no backend indexes.
      properties:
        name:
          type: string
          maxLength: 512
          description: Display name of the entry, as rendered to the user.
          example: Stockholm Central Station
        provider:
          $ref: "#/components/schemas/AutoCompleteProvider"
        providerIndex:
          type: integer
          minimum: 0
          description: |
            0-based rank within this entry's own provider list, before blending.
            Omit for `HISTORY`, which never came from the backend.
          example: 0
        resultIndex:
          type: integer
          minimum: 0
          description: |
            0-based position this entry held in the `result` array of the
            autocomplete response. Omit for `HISTORY`.
          example: 2
    AutoCompleteSelection:
      type: object
      description: |
        One result selection, reported after the user picks an item from an
        autocomplete list. Only `sessionId` is required.
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          maxLength: 128
          description: Client-minted search session id, stable for one search interaction. Analytics only.
          example: 0f6c9f5a-5f0e-4d1c-9f0e-2b5f3f9a1c77
        query:
          type: string
          maxLength: 512
          description: |
            The query text on screen when the user picked, so a selection stands
            on its own without replaying the session's requests.
          example: tugg
        results:
          type: array
          description: |
            The found items as displayed, in display order, never truncated:
            a cut array breaks `selectedIndex`. UI buttons are not included.
          items:
            $ref: "#/components/schemas/AutoCompleteReportedItem"
        selectedIndex:
          type: integer
          minimum: 0
          description: |
            0-based position of the picked entry within `results`. Omit when the
            user picked nothing.
          example: 3
        platform:
          $ref: "#/components/schemas/Platform"
          description: |
            Where the search ran: a car head unit renders fewer rows than a phone,
            so ranking metrics only compare within one platform.
    AutosuggestQueryWithSession:
      allOf:
        - $ref: "#/components/schemas/AutoCompleteQuery"
        - type: object
          properties:
            session:
              $ref: "#/components/schemas/AutoCompleteSession"
    AutoCompleteQueryWithSession:
      allOf:
        - $ref: "#/components/schemas/AutoCompleteQuery"
        - type: object
          properties:
            session:
              $ref: "#/components/schemas/AutoCompleteSession"
            sessionId:
              type: string
              maxLength: 128
              description: Client-minted search session id, stable for one search interaction. Analytics only.
              example: 0f6c9f5a-5f0e-4d1c-9f0e-2b5f3f9a1c77
            backend:
              allOf:
                - $ref: "#/components/schemas/PoiProvider"
              description: |
                Developer-only location-search backend override (GOOGLE / PELIAS).
                Non-developers and auto-test users always get the default (HERE).
            platform:
              $ref: "#/components/schemas/Platform"
              description: |
                Where the search ran: a car head unit renders fewer rows than a phone,
                so ranking metrics only compare within one platform.
    AutoCompleteItem:
      type: object
      oneOf:
        - $ref: "#/components/schemas/AutoCompleteItemWithLocation"
        - $ref: "#/components/schemas/AutoCompleteItemLookup"
        - $ref: "#/components/schemas/AutoCompleteItemQuery"
        - $ref: "#/components/schemas/AutoCompleteItemCharger"
        - $ref: "#/components/schemas/AutoCompleteItemFerry"
      discriminator:
        propertyName: type
        mapping:
          LOCATION: "#/components/schemas/AutoCompleteItemWithLocation"
          LOOKUP: "#/components/schemas/AutoCompleteItemLookup"
          QUERY: "#/components/schemas/AutoCompleteItemQuery"
          CHARGER: "#/components/schemas/AutoCompleteItemCharger"
          FERRY: "#/components/schemas/AutoCompleteItemFerry"
    AutoCompleteItemWithLocation:
      type: object
      required:
        - type
        - name
        - location
      properties:
        type:
          type: string
          enum:
            - LOCATION
        name:
          type: string
          description: A constructed full address name.
          example: Stanford University, Jane Stanford Way, Stanford, United States
        title:
          type: string
          description: The title of a place, null if not a place
          example: Stanford University
        location:
          $ref: "#/components/schemas/Coordinates"
        distanceM:
          $ref: "#/components/schemas/DistanceM"
        address:
          $ref: "#/components/schemas/AutoCompleteAddress"
        category:
          $ref: "#/components/schemas/AutoCompleteCategory"
        provider:
          $ref: "#/components/schemas/AutoCompleteProvider"
        providerIndex:
          type: integer
          minimum: 0
          description: 0-based rank within this item's own provider list, before blending.
          example: 0
    AutoCompleteCategory:
      type: string
      description: Normalized place category, coarsened to a recognition-sized icon set, best-effort mapped from the upstream provider (HERE category IDs / Google place types). Mapping walks HERE Level-3 overrides -> Level-2 group -> Level-1 domain generic, then falls back to the master value `place`. Geo/address results (addresses, streets, cities, ...) also resolve to the master `place` pin.
      enum:
        - restaurant
        - cafe
        - bar
        - entertainment
        - landmark
        - nature
        - airport
        - train
        - bus
        - ferry
        - transport_other
        - accommodation
        - camping
        - shopping
        - business
        - atm
        - healthcare
        - parking
        - school
        - sports
        - restroom
        - building
        - place
    AutoCompleteAddress:
      type: object
      description: Address of a location.
      properties:
        CountryCode:
          type: string
          example: USA
          description: The three letter country code (ISO 3166-1 alpha-3) in capital letters
        CountryName:
          type: string
          example: United States
        State:
          type: string
          description: Name of the state. In some countries, e.g. Sweden, this may be the name of a county.
          example: California
        County:
          type: string
          description: Name of the county. In some countries, e.g. Sweden, this may be the name of a municipality.
          example: Santa Clara
        City:
          type: string
          example: Stanford
        Street:
          type: string
          example: Ayrshire Farm Ln
        PostalCode:
          type: string
          example: 95118
        HouseNumber:
          type: string
          example: 228
    AutoCompleteItemLookup:
      type: object
      required:
        - type
        - id
        - name
      properties:
        type:
          type: string
          enum:
            - LOOKUP
        id:
          type: string
          description: The id of the location.
          example: "123456"
        name:
          type: string
          description: The name of the location.
          example: Berlin
        distanceM:
          $ref: "#/components/schemas/DistanceM"
        category:
          $ref: "#/components/schemas/AutoCompleteCategory"
        provider:
          $ref: "#/components/schemas/AutoCompleteProvider"
        providerIndex:
          type: integer
          minimum: 0
          description: 0-based rank within this item's own provider list, before blending.
          example: 0
    AutoCompleteItemQuery:
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum:
            - QUERY
        name:
          type: string
          description: The suggested search query.
          example: restaurants near me
        provider:
          $ref: "#/components/schemas/AutoCompleteProvider"
        providerIndex:
          type: integer
          minimum: 0
          description: 0-based rank within this item's own provider list, before blending.
          example: 0
    AutoCompleteItemChargerBase:
      type: object
      required:
        - id
        - name
        - connectorTypes
        - coordinates
      properties:
        id:
          type: integer
          description: The id of the location.
          example: 123456
        name:
          type: string
          description: The name of the location.
          example: Berlin
        network:
          type: string
          description: The name of the network.
          example: Ionity
        powerW:
          type: integer
          description: The maximum power of the charger in W.
          example: 150000
        connectorTypes:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorType"
          example:
            - CCS
            - SC
            - TYPE2
          description: The types of connectors available at the charger.
        coordinates:
          $ref: "#/components/schemas/Coordinates"
    AutoCompleteItemCharger:
      allOf:
        - $ref: "#/components/schemas/AutoCompleteItemChargerBase"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - CHARGER
            provider:
              $ref: "#/components/schemas/AutoCompleteProvider"
            providerIndex:
              type: integer
              minimum: 0
              description: 0-based rank within this item's own provider list, before blending.
              example: 0
    AutoCompleteSession:
      type: string
      description: The session id from the start session.
      example: "1234567890"
    AutosuggestModeFerry:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - FERRY
          description: Search for ferry routes.
    AutosuggestModeCharger:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - CHARGER
          description: Search for EV chargers.
        connectorTypes:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorType"
          example:
            - CCS
            - SC
            - TYPE2
          maxItems: 20
          uniqueItems: true
          description: |
            Specifies the allowed types of connectors to filter charger results.
            An empty or not supplied value is interpreted as allow all connector types.
    AutosuggestModeHere:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - HERE
          description: Search for places using HERE API.
    AutosuggestModeGoogle:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - GOOGLE_AUTOSEARCH
          description: Search for places using Google Places API.
        session:
          type: string
          description: |
            Google Places session token. Reuse the same session token for related
            autosuggest calls to group them for billing purposes. The session returned
            in the response should be used for subsequent calls.
          example: abc123-session-token
        radius:
          type: integer
          description: |
            Search radius in meters from the provided location. If not specified,
            the default radius is used.
          example: 50000
          minimum: 50
          maximum: 50000
        includeQueryPredictions:
          type: boolean
          description: |
            Includes query predictions in prediction result, if true.
        offset:
          type: integer
          format: uint
          description: |
            Offset is the character position in the input term at which the service uses text
            for predictions. For example, if the input is 'Lond' and the completion point is
            3, the service will match on 'Lon'. The offset should generally be set to the
            position of the text caret. If no offset is supplied, the service will use the
            entire term.
          example: 0
    AutosuggestModePelias:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - PELIAS
          description: Search for places using the self-hosted Pelias geocoder.
    AutosuggestMode:
      type: object
      oneOf:
        - $ref: "#/components/schemas/AutosuggestModeFerry"
        - $ref: "#/components/schemas/AutosuggestModeCharger"
        - $ref: "#/components/schemas/AutosuggestModeHere"
        - $ref: "#/components/schemas/AutosuggestModeGoogle"
        - $ref: "#/components/schemas/AutosuggestModePelias"
      discriminator:
        propertyName: type
        mapping:
          FERRY: "#/components/schemas/AutosuggestModeFerry"
          CHARGER: "#/components/schemas/AutosuggestModeCharger"
          HERE: "#/components/schemas/AutosuggestModeHere"
          GOOGLE_AUTOSEARCH: "#/components/schemas/AutosuggestModeGoogle"
          PELIAS: "#/components/schemas/AutosuggestModePelias"
    AutosuggestRequest:
      type: object
      required:
        - input
        - location
        - modes
      properties:
        input:
          type: string
          description: |
            Input is the text string on which to search. The API will return matches based
            on this string and order results based on their relevance.
          example: Berlin
        location:
          $ref: "#/components/schemas/Coordinates"
          description: |
            Origin is the point from which to calculate the straight-line distance to the
            destination.
        lang:
          type: string
          description: |
            The language to use for the response. If not specified here the
            language from the 'accept-language' header will be used.
          example: en-US
        modes:
          type: array
          items:
            $ref: "#/components/schemas/AutosuggestMode"
          minItems: 1
          description: |
            Array of search modes to use. Each mode type can only appear once in the array.
            Results from all modes are merged into a single response.
          example:
            - type: CHARGER
            - type: HERE
            - type: GOOGLE_AUTOSEARCH
              session: abc123
    RouteSummaryResult:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/RouteSummaryData"
        cursor:
          type: string
          description: Cursor for pagination. Use this value in the next request to fetch more results.
    RouteSummaryData:
      type: object
      required:
        - routes
      properties:
        source:
          type: string
          enum:
            - app
            - api
          description: Source of the route plan
          example: app
        planTime:
          type: number
          format: float
          description: Time taken to generate the plan in seconds
          example: 0.45
        country3:
          type: string
          description: Three-letter country code (ISO 3166-1 alpha-3) of the route origin
          example: SWE
        vehicle:
          $ref: "#/components/schemas/RouteSummaryVehicle"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteSummaryItem"
    RouteSummaryVehicle:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Full display name of the vehicle
          example: Tesla Model 3 Long Range
        manufacturer:
          type: string
          description: Vehicle manufacturer
          example: Tesla
        model:
          type: string
          description: Vehicle model
          example: Model 3 Long Range
        typecode:
          $ref: "#/components/schemas/schemas-Typecode"
    RouteSummaryItem:
      type: object
      required:
        - totalDist
        - totalDriveDuration
        - totalChargeDuration
        - steps
      properties:
        totalDist:
          type: integer
          description: Total distance in meters
          example: 425000
        totalDriveDuration:
          type: integer
          description: Total driving duration in seconds
          example: 14400
        totalChargeDuration:
          type: integer
          description: Total charging duration in seconds
          example: 1800
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RouteSummaryStep"
    RouteSummaryStep:
      type: object
      required:
        - lat
        - lon
        - type
        - path
      properties:
        lat:
          $ref: "#/components/schemas/Lat"
        lon:
          $ref: "#/components/schemas/Long"
        type:
          $ref: "#/components/schemas/StepType"
        chargerType:
          $ref: "#/components/schemas/ConnectorType"
        path:
          type: array
          description: Array of coordinate pairs [lat, lon] representing the path to the next step
          items:
            type: array
            items:
              type: number
              format: double
            minItems: 2
            maxItems: 2
          example:
            - - 59.3293
              - 18.0686
            - - 59.3295
              - 18.069
    StepType:
      type: string
      enum:
        - start
        - finish
        - charger
        - waypoint
        - ferry
      description: Type of route step
    Ferry:
      type: object
      required:
        - id
        - name
        - from
        - to
        - via
        - lengthM
        - geometry
      properties:
        id:
          type: string
          description: The unique identifier of the ferry route.
          example: 1349018822:{|alI}_xgArfqAana@
        name:
          type: string
          description: The name of the ferry route.
          example: Trelleborg (SWE) -> Rostock (DEU) by Stena Line
        lengthM:
          type: integer
          description: The length of the ferry route in meters.
          example: 158187
        geometry:
          $ref: "#/components/schemas/LineString"
        from:
          type: object
          required:
            - coordinate
            - heading
          properties:
            coordinate:
              $ref: "#/components/schemas/Coordinates"
              description: The coordinates of the start of the ferry route.
            heading:
              type: number
              description: Heading (azimuth) in degrees in the range [0.0, 360.0) degrees, measured clockwise from North. 0.0 is North, 90.0 is East, 180.0 is South and 270.0 is West.
        to:
          type: object
          required:
            - coordinate
            - heading
          properties:
            coordinate:
              $ref: "#/components/schemas/Coordinates"
              description: The coordinates of the end of the ferry route.
            heading:
              type: number
              description: Heading (azimuth) in degrees in the range [0.0, 360.0) degrees, measured clockwise from North. 0.0 is North, 90.0 is East, 180.0 is South and 270.0 is West.
        via:
          type: object
          required:
            - coordinate
            - heading
          properties:
            coordinate:
              $ref: "#/components/schemas/Coordinates"
              description: The coordinates of the ferry route waypoint, that allows to precisely select the exact ferry route.
            heading:
              type: number
              description: Heading (azimuth) in degrees in the range [0.0, 360.0) degrees, measured clockwise from North. 0.0 is North, 90.0 is East, 180.0 is South and 270.0 is West.
    AutoCompleteItemFerry:
      allOf:
        - $ref: "#/components/schemas/Ferry"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - FERRY
            provider:
              $ref: "#/components/schemas/AutoCompleteProvider"
            providerIndex:
              type: integer
              minimum: 0
              description: 0-based rank within this item's own provider list, before blending.
              example: 0
    SavedPlanDestinationDetails:
      type: object
      required:
        - coordinates
      properties:
        coordinates:
          $ref: "#/components/schemas/Coordinates"
          description: The coordinates of the destination.
    PersistPlanRequest:
      type: object
      description: |
        A supplied clientContext overrides the clientContext from the original plan request.
      required:
        - reason
      properties:
        clientContext:
          $ref: "#/components/schemas/ClientContext"
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/Destination"
          description: The list of destinations to plan for. If not supplied, the destinations from the plan request will be used.
        reason:
          type: string
          enum:
            - SHARED
            - SAVED
    SavedPlanVehicleState:
      type: object
      required:
        - referenceConsumption
        - degradationFrac
        - speedScaling
        - maximumSpeedMs
      properties:
        referenceConsumption:
          minimum: 0
          maximum: 1000
          $ref: "#/components/schemas/ReferenceConsumption"
        degradationFrac:
          $ref: "#/components/schemas/DegradationFrac"
        speedScaling:
          $ref: "#/components/schemas/SpeedScaling"
        maximumSpeedMs:
          $ref: "#/components/schemas/MaximumSpeedMs"
    SavedPlanRequest:
      type: object
      required:
        - planId
        - request
        - typecode
        - destinationDetails
        - vehicleState
      properties:
        planId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        request:
          $ref: "#/components/schemas/AbrpPlanRequest"
        typecode:
          $ref: "#/components/schemas/Typecode"
          description: The typecode of the vehicle for which the plan was saved.
        destinationDetails:
          type: array
          description: Optional additional information about the destination. Matched to the destinations in the plan request by order.
          items:
            $ref: "#/components/schemas/SavedPlanDestinationDetails"
        vehicleState:
          $ref: "#/components/schemas/SavedPlanVehicleState"
    SavedPlanRequestList:
      type: array
      items:
        $ref: "#/components/schemas/SavedPlanRequest"
    ChargerDetourBody:
      type: object
      required:
        - route
        - chargerIds
      properties:
        route:
          $ref: "#/components/schemas/ChargerDetourRoute"
        chargerIds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChargerId"
          description: Charger ids to measure against the route.
    ChargerDetourRoute:
      oneOf:
        - $ref: "#/components/schemas/ChargerDetourPolylineRoute"
      discriminator:
        propertyName: type
        mapping:
          POLYLINE: "#/components/schemas/ChargerDetourPolylineRoute"
      description: |
        The route to measure against, selected by `type`. Point indices in the
        response refer to this route's polyline exactly as sent.
    ChargerDetourPolylineRoute:
      type: object
      additionalProperties: false
      required:
        - type
        - polyline
      properties:
        type:
          type: string
          enum:
            - POLYLINE
          x-enum-varnames:
            - ChargerDetourRouteTypePOLYLINE
        polyline:
          $ref: "#/components/schemas/PolylineWithPrecision"
      description: A route given as an encoded polyline, such as a plan leg's `polyline`.
    ChargerDetailsRequest:
      type: object
      required:
        - chargerIds
      properties:
        chargerIds:
          type: array
          items:
            $ref: "#/components/schemas/ChargerId"
          maxItems: 1000
          example:
            - 123123
            - 25
        cardIds:
          type: array
          items:
            $ref: "#/components/schemas/CardId"
          maxItems: 1000
          example:
            - 12
            - 85
          description: |
            Only the adhoc-price and prices related to the supplied charge-cards will be returned.
        currency:
          type: string
          example: SEK
          description: |
            The three digit currency code. All prices will be converted to the specified currency.
            The local price of the charger will be returned if not specified.
        typecode:
          type: string
          description: Enables vehicle specific fields in the response.
          example: rivian:r1s:21:135
        connectorTypes:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorType"
          example:
            - CCS
            - SC
            - TYPE2
          description: |
            Specifies the allowed types of connectors. An empty or not supplied value is interpreted as allow all.
            This attribute overrides connector types derived from the typecode.
        mergeConnectorTypes:
          $ref: "#/components/schemas/MergeConnectorTypes"
    GeoChargerGetRequest:
      type: object
      required:
        - chargerIds
      properties:
        chargerIds:
          type: array
          items:
            $ref: "#/components/schemas/ChargerId"
          maxItems: 1000
          example:
            - 123123
            - 25
    ChargerId:
      type: integer
      format: int64
      description: A unique identifier for the charger.
      example: 134525594
      minimum: 1
    WaypointChargerId:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: Discriminator field.
          enum:
            - CHARGER_ID
          example: CHARGER_ID
        value:
          $ref: "#/components/schemas/ChargerId"
    Lat:
      type: number
      format: double
      minimum: -90
      maximum: 90
      example: 55.6
      description: The latitude of the coordinate.
    Long:
      type: number
      format: double
      minimum: -180
      maximum: 180
      example: 13.24
      description: The longitude of the coordinate
    WaypointCoordinates:
      type: object
      required:
        - type
        - lat
        - long
      properties:
        type:
          type: string
          description: Discriminator field.
          enum:
            - COORDINATES
          example: COORDINATES
        lat:
          $ref: "#/components/schemas/Lat"
        long:
          $ref: "#/components/schemas/Long"
    WaypointAddress:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: Discriminator field.
          enum:
            - ADDRESS
          example: ADDRESS
        value:
          type: string
          description: The address of the location.
    DestinationLocation:
      oneOf:
        - $ref: "#/components/schemas/WaypointChargerId"
        - $ref: "#/components/schemas/WaypointCoordinates"
        - $ref: "#/components/schemas/WaypointAddress"
      discriminator:
        propertyName: type
        mapping:
          CHARGER_ID: "#/components/schemas/WaypointChargerId"
          COORDINATES: "#/components/schemas/WaypointCoordinates"
          ADDRESS: "#/components/schemas/WaypointAddress"
    DestinationEnergySettingsTimeAndSocCharging:
      type: object
      required:
        - type
        - seconds
        - socFrac
      properties:
        type:
          type: string
          enum:
            - TIME_AND_SOC
        seconds:
          type: integer
          minimum: 0
          description: |
            [s] The time available to charge at the destination.
        socFrac:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            The target SoC fraction to charge to at the destination.
    DestinationEnergySettingsTimeAndPowerCharging:
      type: object
      required:
        - type
        - seconds
        - watts
      properties:
        type:
          type: string
          enum:
            - TIME_AND_POWER
        seconds:
          type: integer
          minimum: 0
          description: |
            [s] The time available to charge at the destination.
        watts:
          type: number
          description: |
            [W] The power of the charger at the destination.
    DestinationEnergySettingsSocAndPower:
      type: object
      required:
        - type
        - socFrac
        - watts
      properties:
        type:
          type: string
          enum:
            - SOC_AND_POWER
        socFrac:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            The target SoC fraction to charge to at the destination.
        watts:
          type: number
          description: |
            [W] The power of the charger at the destination.
    DestinationEnergySettingsPowerOnly:
      type: object
      required:
        - type
        - watts
      properties:
        type:
          type: string
          enum:
            - POWER
        watts:
          type: number
          minimum: 0
          description: |
            [W] The power of the charger at the destination. No time or SoC target is specified.
    DestinationEnergySettingsCharging:
      oneOf:
        - $ref: "#/components/schemas/DestinationEnergySettingsTimeAndSocCharging"
        - $ref: "#/components/schemas/DestinationEnergySettingsTimeAndPowerCharging"
        - $ref: "#/components/schemas/DestinationEnergySettingsSocAndPower"
        - $ref: "#/components/schemas/DestinationEnergySettingsPowerOnly"
      discriminator:
        propertyName: type
        mapping:
          TIME_AND_SOC: "#/components/schemas/DestinationEnergySettingsTimeAndSocCharging"
          TIME_AND_POWER: "#/components/schemas/DestinationEnergySettingsTimeAndPowerCharging"
          SOC_AND_POWER: "#/components/schemas/DestinationEnergySettingsSocAndPower"
          POWER: "#/components/schemas/DestinationEnergySettingsPowerOnly"
    DestinationEnergySettings:
      type: object
      properties:
        minArrivalSocFrac:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Arrive at this waypoint with at least this SoC.
            The default is specified by other input parameters.
        charging:
          $ref: "#/components/schemas/DestinationEnergySettingsCharging"
    DestinationTimeSettingsDepartureTime:
      type: object
      required:
        - type
        - time
      properties:
        type:
          type: string
          enum:
            - DEPARTURE_TIME
        time:
          type: string
          format: date-time
          example: "2017-07-21T17:32:28Z"
          description: |
            The date-time notation as defined by RFC 3339, section 5.6,
            when the vehicle should depart from the destination.
    DestinationTimeSettingsTimeOfDay:
      type: object
      required:
        - type
        - secondsAfterMidnight
      properties:
        type:
          type: string
          enum:
            - TIME_OF_DAY
        secondsAfterMidnight:
          type: integer
          minimum: 0
          description: |
            [s] The duration after midnight when the vehicle should depart from the destination.
    DestinationTimeSettingsDepartureAt:
      oneOf:
        - $ref: "#/components/schemas/DestinationTimeSettingsDepartureTime"
        - $ref: "#/components/schemas/DestinationTimeSettingsTimeOfDay"
      discriminator:
        propertyName: type
        mapping:
          DEPARTURE_TIME: "#/components/schemas/DestinationTimeSettingsDepartureTime"
          TIME_OF_DAY: "#/components/schemas/DestinationTimeSettingsTimeOfDay"
    DestinationTimeSettings:
      type: object
      properties:
        departAt:
          $ref: "#/components/schemas/DestinationTimeSettingsDepartureAt"
        stayForSeconds:
          type: integer
          minimum: 0
          description: |
            [s] The time the vehicle should stay at the destination.
    Destination:
      type: object
      required:
        - location
      properties:
        location:
          $ref: "#/components/schemas/DestinationLocation"
        energySettings:
          $ref: "#/components/schemas/DestinationEnergySettings"
        timeSettings:
          $ref: "#/components/schemas/DestinationTimeSettings"
        name:
          type: string
          description: |
            The name of the destination. This is used for display purposes only. It will return the same name for the destination in the result.
          example: Home
    PlanDestinations:
      type: array
      minItems: 2
      items:
        $ref: "#/components/schemas/Destination"
      description: |
        A list of at least two destination (the start and final destination) of the plan.
      example:
        - location:
            type: COORDINATES
            lat: 55.71220191979822
            long: 13.215866972117013
            bearing: 23
        - location:
            type: ADDRESS
            value: Ã–rgrytevÃ¤gen 5, Gothemburg
          minimumArrivalSocFrac: 0.2
    ConnectorType:
      type: string
      description: |
        The standard of the installed connector (deviates from the OCPI-standard).
      example: CCS
      enum:
        - CCS
        - SC
        - TESLA_CCS
        - TESLA_DESTINATION_CHARGER
        - CHADEMO
        - TYPE2
        - TYPE2_CABLE
        - J1772
        - SCHUKO
        - TYPE3
        - GBT
        - NACS
        - MCS
        - NEMA515
        - NEMA520
        - NEMA1450
        - NEMATT30
        - THREEPHASE_AU
        - CEE_RED
        - CEE_BLUE
        - OTHER
    ConnectorTypes:
      type: array
      items:
        $ref: "#/components/schemas/ConnectorType"
      description: |
        Array of allowed connector types for planning. The default value is decided by the vehicle type.
    AllowedDbs:
      type: array
      uniqueItems: true
      items:
        type: string
      description: |
        Array of databases to use as the source of chargers. The default is to include all databases allowed for the given API key.
    MinimumDestinationSocFrac:
      type: number
      format: float
      minimum: 0
      maximum: 1
      description: |
        The minimum SoC allowed when arriving at the final destination.
    MinimumChargerArrivalSocFrac:
      type: number
      format: float
      minimum: 0
      maximum: 1
      description: |
        The minimum SoC allowed when arriving at any charger or waypoint.
    MaximumChargingSocFrac:
      type: number
      minimum: 0
      maximum: 1
      description: |
        The maximum SoC allowed when charging.
    ChargingOverheadSec:
      type: integer
      minimum: 0
      description: |
        [s] The overhead to add to the driving time and charging time for each charge stop. 
        This typically accounts for finding the charger, connecting it and starting it. 
        A higher value here will lead to fewer but longer charge stops.
    ChargingStopPreference:
      type: string
      enum:
        - MOST
        - MORE
        - OPTIMAL
        - FEWER
        - LEAST
        - FEWEST
      description: |
        Bias the number of charge stops in the plan, the default value is "optimal" which gives shortest total trip time.

        LEAST is deprecated and will be removed in future versions, please use FEWEST instead.
    RealTimeStatus:
      type: boolean
      description: |
        Enables planning with realtime charger status. This feature is considered premium and has to be explicitly enabled for your API key.
    ExcludedChargerIds:
      type: array
      items:
        type: integer
        format: int64
        description: A unique identifier for the charger.
        example: 134525594
        nullable: true
      description: A list of charger ids to exclude from the plan.
    Preference:
      type: string
      description: |
        Charger, network, or tag preference. For networks, `EXCLUSIVE` restricts
        planning to chargers on those networks only (when at least one network is
        exclusive, all other networks are excluded).
      enum:
        - EXCLUDE
        - DISLIKE
        - NO_PREFERENCE
        - PREFER
        - PREFER_STRONGLY
        - EXCLUSIVE
    NetworkPreferenceItem:
      type: object
      required:
        - id
        - preference
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for a network.
        preference:
          $ref: "#/components/schemas/Preference"
    NetworkPreferences:
      type: array
      items:
        $ref: "#/components/schemas/NetworkPreferenceItem"
      description: |
        Modifies the preferences for charges based on their network. When any
        entry uses `EXCLUSIVE`, only chargers on networks marked exclusive are
        considered; all other networks are excluded from the plan.
    CardPreference:
      type: string
      enum:
        - NO_PREFERENCE
        - PREFER
    CardPreferenceItem:
      type: object
      required:
        - id
        - preference
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for a charge card.
        preference:
          $ref: "#/components/schemas/CardPreference"
    CardPreferences:
      type: array
      items:
        $ref: "#/components/schemas/CardPreferenceItem"
      description: |
        Modifies the preferences for charges based on their card.
        Further, costs for all stop will be calculated if a specified card is present.
    ChargerFeature:
      type: string
      enum:
        - DOG_FRIENDLY
        - TRAILER_FRIENDLY
        - HAS_PLAYGROUND
        - HAS_OPEN_RESTROOMS
        - PLUG_AND_CHARGE
      example: DOG_FRIENDLY
      description: A set of supported charger features.
    FeaturePreference:
      type: object
      required:
        - feature
        - preference
      properties:
        feature:
          $ref: "#/components/schemas/ChargerFeature"
        preference:
          type: string
          enum:
            - PREFER
      description: |
        Preference for a specific feature of a charger.
    FeaturePreferences:
      type: array
      items:
        $ref: "#/components/schemas/FeaturePreference"
      description: Preferences for charger features.
    TagPreferenceItem:
      type: object
      required:
        - tag
        - preference
      properties:
        tag:
          type: string
          description: The name of the tag to apply the preference on.
        preference:
          $ref: "#/components/schemas/Preference"
    TagPreferences:
      type: array
      items:
        $ref: "#/components/schemas/TagPreferenceItem"
      description: |
        Modifies the preferences for charges based on their network.
    ChargingOptions:
      type: object
      default: {}
      properties:
        connectorTypes:
          $ref: "#/components/schemas/ConnectorTypes"
        allowedDbs:
          $ref: "#/components/schemas/AllowedDbs"
        minimumDestinationSocFrac:
          $ref: "#/components/schemas/MinimumDestinationSocFrac"
          default: 0.1
        minimumChargerArrivalSocFrac:
          $ref: "#/components/schemas/MinimumChargerArrivalSocFrac"
          default: 0.1
        maximumChargingSocFrac:
          $ref: "#/components/schemas/MaximumChargingSocFrac"
          minimum: 0.2
          default: 1
        overheadSec:
          $ref: "#/components/schemas/ChargingOverheadSec"
          default: 300
        stopPreference:
          $ref: "#/components/schemas/ChargingStopPreference"
          default: OPTIMAL
        realTimeStatus:
          $ref: "#/components/schemas/RealTimeStatus"
          default: false
        excludedChargerIds:
          $ref: "#/components/schemas/ExcludedChargerIds"
        networkPreferences:
          $ref: "#/components/schemas/NetworkPreferences"
        cardPreferences:
          $ref: "#/components/schemas/CardPreferences"
        featurePreferences:
          $ref: "#/components/schemas/FeaturePreferences"
        tagPreferences:
          $ref: "#/components/schemas/TagPreferences"
        preferredMinimumStallCount:
          type: integer
          minimum: 1
          description: A soft constraint on the preferred number of stalls.
      example:
        connectorTypes:
          - CCS
          - NACS
        minimumArrivalSocFrac: 0.07
        maximumSocFrac: 0.8
        overhead: 120
        steps: MORE
        realTimeStatus: false
        networkPreferences:
          id: 2
          preference: PREFER
        cards:
          id: 2
          preference: PREFER
    MaximumSpeedMs:
      type: number
      minimum: 0
      description: |
        The maximum speed which the planner will allow for the car, even if speed limits allow more. 
        This is mostly useful for very high speed highways, such as Autobahns. 
        If not given, the recommended max speed for the car model is used.
    AllowSpeedAdjustment:
      type: boolean
      description: |
        Allow the planner to lower the maximum speed for individual legs if this is needed to reach the next charger.
    SpeedScaling:
      type: number
      minimum: 0
      description: |
        A speed factor relative to the speed limits or estimated speed of the road. 1.1 means 10% faster than speed limits.
    SpeedOptions:
      type: object
      default: {}
      properties:
        maximumMs:
          $ref: "#/components/schemas/MaximumSpeedMs"
        allowAdjustment:
          default: false
          $ref: "#/components/schemas/AllowSpeedAdjustment"
        scaling:
          default: 1
          $ref: "#/components/schemas/SpeedScaling"
    AvoidFerries:
      type: boolean
      description: Allow the route to include ferries.
    AvoidHighways:
      type: boolean
      description: Allow the route to include highways.
    AvoidTolls:
      type: boolean
      description: Allow the route to include toll roads.
    AvoidBorders:
      type: boolean
      description: |
        If true, the route will not allow country border crossings, or more specifically, 
        not allow chargers or waypoints in different countries.
    AvoidOptions:
      type: object
      default: {}
      properties:
        ferries:
          default: false
          $ref: "#/components/schemas/AvoidFerries"
        highways:
          default: false
          $ref: "#/components/schemas/AvoidHighways"
        tolls:
          default: false
          $ref: "#/components/schemas/AvoidTolls"
        borders:
          default: false
          $ref: "#/components/schemas/AvoidBorders"
    AlternativeRoutes:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          example: ROUTES
          enum:
            - ROUTES
          description: Discriminator field.
      description: |
        The returned plan may contain up to three routes if there are several reasonable alternatives. 
        These alternatives have been selected to not completely overlap geographically - 
        i.e. different charger selections along the same basic route are not counted as alternatives.
    AlternativeChargers:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          example: CHARGERS
          enum:
            - CHARGERS
          description: Discriminator field.
      description: |
        Up to five options for the next charger are returned (as different routes). 
        Cannot be used at the same time as alternatives are enabled.
    Alternatives:
      oneOf:
        - $ref: "#/components/schemas/AlternativeRoutes"
        - $ref: "#/components/schemas/AlternativeChargers"
      discriminator:
        propertyName: type
        mapping:
          ROUTES: "#/components/schemas/AlternativeRoutes"
          CHARGERS: "#/components/schemas/AlternativeChargers"
    Currency:
      type: string
      example: EUR
      description: The three digit currency code of the country where the charging station is located
    UnitSystem:
      type: string
      enum:
        - METRIC
        - IMPERIAL
      description: The units in the response.
    ResultOptions:
      type: object
      default: {}
      properties:
        alternatives:
          $ref: "#/components/schemas/Alternatives"
        currency:
          $ref: "#/components/schemas/Currency"
        unitSystem:
          $ref: "#/components/schemas/UnitSystem"
          description: Speed adjustments will be returned in reasonable values for the unit system.
      example:
        alternatives:
          type: ROUTES
    CustomParameters:
      type: object
      additionalProperties: true
      description: |
        Keyed container for customer-specific planner input.
    Traffic:
      type: string
      enum:
        - NO_TRAFFIC
        - REAL_TIME
      description: |
        Enable planning with realtime traffic information and routing for the first hours of driving.
        The REAL TIME feature is considered premium and has to be explicitly enabled for your API key.
        If you don't have the REAL TIME feature, the planner will use the default traffic model, and communicate this as an warning.
      default: NO_TRAFFIC
    RealTimeWeather:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - REAL_TIME
      description: |
        Fetches and applies the current conditions for wind, temperature and road-conditions.
    SeasonalWeather:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - SEASONAL
      description: |
        Assume the average weather for the season.
    ManualWeather:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - MANUAL
        temperatureC:
          type: number
          default: 20
          description: |
            [degrees C] The assumed outside temperature for the plan; this will affect vehicle consumption.
            Note that there are other settings that can change the default.
        roadConditions:
          type: string
          default: NORMAL
          enum:
            - NORMAL
            - RAIN
            - HEAVY_RAIN
          description: Anything other than normal will increase the assumed consumption of the vehicle.
        windSpeedMs:
          type: number
          minimum: 0
          description: |
            [m/s] The assumed wind speed for the plan.
        windDirection:
          type: string
          enum:
            - HEAD
            - TAIL
          description: The assumed wind direction for the plan.
    NoWeather:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - NONE
      description: Assumes optimal weather conditions.
    Weather:
      oneOf:
        - $ref: "#/components/schemas/RealTimeWeather"
        - $ref: "#/components/schemas/SeasonalWeather"
        - $ref: "#/components/schemas/ManualWeather"
        - $ref: "#/components/schemas/NoWeather"
      discriminator:
        propertyName: type
        mapping:
          REAL_TIME: "#/components/schemas/RealTimeWeather"
          SEASONAL: "#/components/schemas/SeasonalWeather"
          MANUAL: "#/components/schemas/ManualWeather"
          NONE: "#/components/schemas/NoWeather"
      default:
        type: SEASONAL
      description: |
        Real time weather is considered a premium feature and has to be explicitly enabled for your API key.
        If you don't have the real time weather feature, the planner will use the seasonal weather model, and communicate this as a warning.
    TypecodeIdentifier:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: Discriminator field.
          enum:
            - TYPECODE
          example: TYPECODE
        value:
          type: string
          description: The unique identifier for the vehicle model.
          example: rivian:r1s:21:135
      example:
        type: TYPECODE
        value: rivian:r1s:21:135
    VehicleId:
      type: integer
      format: int64
      description: The id of the vehicle.
      example: 1
    VehicleIdIdentifier:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: Discriminator field.
          enum:
            - VEHICLE_ID
          example: VEHICLE_ID
        value:
          $ref: "#/components/schemas/VehicleId"
    CurrentSocFrac:
      type: number
      format: float
      minimum: -0.15
      maximum: 1.15
      description: |
        The current SoC of the vehicle, used as starting SoC for the plan.
    ReferenceConsumption:
      type: number
      description: |
        [Wh/km @ 110 km/h] This overrides the default reference consumption of the vehicle. 
        Use this to adjust the assumed consumption of the vehicle. 
        The default value is based on the type of vehicle.
    DegradationFrac:
      type: number
      description: |
        The degradation of the battery. Defaults to 0.05 (5%) or a calibrated value.
    TrailerSize:
      type: string
      description: |
        Size of the trailer compared with the towing vehicle, judged by how far it extends
        above and beside the vehicle when seen from the front or rear.
      enum:
        - SMALLER
        - SIMILAR
        - BIGGER
    TrailerShape:
      type: string
      description: |
        Closest outline of the trailer. SLEEK covers low or tapered loads such as boats, cars
        on a flatbed and teardrop campers. BOXY also covers irregular loads such as bike
        carriers.
      enum:
        - SLEEK
        - ROUNDED
        - BOXY
    TrailerMassKg:
      type: number
      minimum: 0
      maximum: 5000
      description: Loaded mass of the trailer [kg].
    Trailer:
      type: object
      description: A towed trailer, described by its size, shape and loaded mass.
      required:
        - size
        - shape
        - massKg
      properties:
        size:
          $ref: "#/components/schemas/TrailerSize"
        shape:
          $ref: "#/components/schemas/TrailerShape"
        massKg:
          $ref: "#/components/schemas/TrailerMassKg"
      example:
        size: SIMILAR
        shape: ROUNDED
        massKg: 1500
    PlanVehicle:
      type: object
      required:
        - identifier
      properties:
        identifier:
          oneOf:
            - $ref: "#/components/schemas/TypecodeIdentifier"
            - $ref: "#/components/schemas/VehicleIdIdentifier"
          discriminator:
            propertyName: type
            mapping:
              TYPECODE: "#/components/schemas/TypecodeIdentifier"
              VEHICLE_ID: "#/components/schemas/VehicleIdIdentifier"
        currentSocFrac:
          default: 0.9
          $ref: "#/components/schemas/CurrentSocFrac"
        referenceConsumption:
          minimum: 0
          maximum: 1000
          $ref: "#/components/schemas/ReferenceConsumption"
        degradationFrac:
          $ref: "#/components/schemas/DegradationFrac"
        configuration:
          type: string
          description: The current vehicle configuration, affecting energy consumption.
          example: trailer
        trailer:
          description: |
            A towed trailer. For a VEHICLE_ID vehicle, a trailer or configuration type saved
            with `configuration` takes precedence.
          $ref: "#/components/schemas/Trailer"
      example:
        identifier:
          type: TYPECODE
          value: rivian:r1s:21:135
        degradation: 3
        socFrac: 0.43
    ClientContext:
      type: object
      additionalProperties: true
      description: |
        Arbitrary client-defined metadata. Stored and returned as-is; not used in route planning.
        Plan responses echo the value from the plan request.
    Coordinates:
      type: object
      description: Defines a geographic location.
      required:
        - lat
        - long
      properties:
        lat:
          $ref: "#/components/schemas/Lat"
        long:
          $ref: "#/components/schemas/Long"
      example:
        lat: 55.7047
        long: 13.191
    Location:
      description: Defines a geographic location, with tlm data
      allOf:
        - $ref: "#/components/schemas/Coordinates"
    FracWiggle:
      type: number
      format: float
      maximum: 1.05
      minimum: -0.05
      example: 0.85
      description: A fraction in the range -0.05-1.05 as in -5-105%. The min and max allows a bit of wiggle room.
    EnergyWh:
      type: number
      format: float
      description: (Wh) The energy in watt hours.
      example: 72000
      minimum: 0
    PowerW:
      type: number
      format: float
      description: (W) The power in watts.
      example: 23300
    CurrentA:
      type: number
      format: float
      description: (A) The current in amperes.
      example: 100
    VoltageV:
      type: number
      format: float
      description: (V) The voltage in volts.
      example: 400
    DistanceM:
      type: integer
      description: (m) The distance in meters.
      example: 1000
    ChargingState:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          description: The vehicles charging state
          enum:
            - CHARGING_AC
            - CHARGING_DC
            - CHARGING_UNKNOWN
            - NOT_CHARGING
            - PLUGGED_IN
    DrivingState:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          description: Driving state of the vehicle. I.e the vehicles current gear
          enum:
            - PARK
            - REVERSE
            - NEUTRAL
            - DRIVE
    PlanTelemetryPoint:
      type: object
      default: {}
      required:
        - utc
      properties:
        utc:
          type: integer
          format: int64
          description: |
            [s] The UNIX timestamp in seconds.
        location:
          $ref: "#/components/schemas/Location"
        speedMs:
          type: number
          format: float
          description: |
            [m/s] The speed of the vehicle.
          example: 10
        externalTemperatureC:
          type: number
          format: float
          description: |
            [degrees C] The external temperature.
          example: 20
        batteryTemperatureC:
          type: number
          format: float
          description: |
            [degrees C] The battery temperature.
          example: 20
        socFrac:
          $ref: "#/components/schemas/FracWiggle"
        soeWh:
          $ref: "#/components/schemas/EnergyWh"
        powerW:
          $ref: "#/components/schemas/PowerW"
        hvacPowerW:
          $ref: "#/components/schemas/PowerW"
        currentA:
          $ref: "#/components/schemas/CurrentA"
        voltageV:
          $ref: "#/components/schemas/VoltageV"
        estimatedBatteryRangeM:
          $ref: "#/components/schemas/DistanceM"
        chargingState:
          $ref: "#/components/schemas/ChargingState"
        drivingState:
          $ref: "#/components/schemas/DrivingState"
        elevationM:
          $ref: "#/components/schemas/DistanceM"
    PlanTelemetry:
      type: object
      properties:
        dataPoints:
          type: array
          items:
            $ref: "#/components/schemas/PlanTelemetryPoint"
    PlanCalibration:
      type: object
      default: {}
      properties:
        state:
          type: string
          format: string
          example: gAAAAABlEsWRgMeNoCloN_z14nEAmzT1UTFjj30FZ8t1ZKwjCPhVXSO0gdf8eQZeURkf-X3PJNhOCGe0kTS_tElsBWPie8U9cQ==
          description: |
            A string containing the calibration state as returned by a previous call of plan/refresh or the empty string if reset/unknown.
    PlanRequest:
      x-go-type: FullPlanRequest
      type: object
      required:
        - destinations
        - vehicle
      properties:
        destinations:
          $ref: "#/components/schemas/PlanDestinations"
        charging:
          $ref: "#/components/schemas/ChargingOptions"
        speed:
          $ref: "#/components/schemas/SpeedOptions"
        avoid:
          $ref: "#/components/schemas/AvoidOptions"
        resultOptions:
          $ref: "#/components/schemas/ResultOptions"
        customParameters:
          $ref: "#/components/schemas/CustomParameters"
        traffic:
          $ref: "#/components/schemas/Traffic"
        weather:
          $ref: "#/components/schemas/Weather"
        vehicle:
          allOf:
            - $ref: "#/components/schemas/PlanVehicle"
            - type: object
              properties:
                identifier:
                  $ref: "#/components/schemas/TypecodeIdentifier"
        clientContext:
          $ref: "#/components/schemas/ClientContext"
        telemetry:
          $ref: "#/components/schemas/PlanTelemetry"
        calibration:
          $ref: "#/components/schemas/PlanCalibration"
    RouteId:
      type: string
      description: A unique identifier for a route.
    RouteTag:
      type: string
      enum:
        - REFRESHED_SAME_LEG_ORIGINS
        - REFRESHED_SAME_DRIVES
        - REFRESHED_HAS_INITIAL_STAY
        - AMENITY_BREAK_NOT_NEEDED
        - AMENITY_BREAK_AFTER_FINAL_DESTINATION
      description: TO BE WRITTEN
    LegTag:
      type: string
      enum:
        - ARRIVAL_SOC_BELOW_WANTED
        - ARRIVAL_SOC_BELOW_ACCEPTABLE
        - ARRIVAL_SOC_BELOW_ZERO
        - ARRIVAL_SOC_BELOW_CRITICAL
        - SECONDARY_CHARGE_SESSION
      description: TO BE WRITTEN
    RouteSummary:
      type: object
      required:
        - durationSec
        - driveDurationSec
        - ferryDurationSec
        - distanceM
        - driveDistanceM
        - ferryDistanceM
        - consumedSoc
        - consumedWh
        - chargedSoc
        - chargedW
        - primaryChargeDurationSec
        - secondaryChargeDurationSec
      properties:
        durationSec:
          type: integer
          minimum: 0
          description: The total time of the route.
        driveDurationSec:
          type: integer
          minimum: 0
          description: The total time spent diving.
        ferryDurationSec:
          type: integer
          minimum: 0
          description: The total time spent on ferries.
        distanceM:
          type: integer
          minimum: 0
          description: The total distance of the route.
        driveDistanceM:
          type: integer
          minimum: 0
          description: The total distance driven.
        ferryDistanceM:
          type: integer
          minimum: 0
          description: The total distance on ferries.
        consumedSoc:
          type: integer
          minimum: 0
          description: The total Soc consumed on the route.
        consumedWh:
          type: integer
          minimum: 0
          description: The total energy consumed on the route.
        chargedSoc:
          type: integer
          minimum: 0
          description: The total Soc charged on the route.
        chargedW:
          type: integer
          minimum: 0
          description: The total energy charged on the route.
        primaryChargeDurationSec:
          type: integer
          minimum: 0
          description: The total time spent in primary charging sessions. This is typically the time that should be displayed to the user.
        secondaryChargeDurationSec:
          type: integer
          minimum: 0
          description: The total time spent in secondary charging sessions. These are typically over-the-night charge-stops that are not as important to show to the user.
    NonOverlappingRouteSegment:
      type: object
      required:
        - startLegIndex
        - startPolylineIndex
        - endLegIndex
        - endPolylineIndex
      properties:
        startLegIndex:
          type: integer
          description: The index of the leg where the non-overlapping segment starts.
        startPolylineIndex:
          type: integer
          description: The index of the polyline where the non-overlapping segment starts.
        endLegIndex:
          type: integer
          description: The index of the leg where the non-overlapping segment ends.
        endPolylineIndex:
          type: integer
          description: The index of the polyline where the non-overlapping segment ends.
    RouteOverlap:
      type: object
      required:
        - comparedRouteId
        - nonOverlappingSegments
      properties:
        comparedRouteId:
          type: string
          description: The route id of the overlapping route.
        nonOverlappingSegments:
          type: array
          items:
            $ref: "#/components/schemas/NonOverlappingRouteSegment"
    LegId:
      type: string
      description: A unique identifier for a leg of a route.
    OriginType:
      type: string
      enum:
        - UNSPECIFIED
        - ADDED_CHARGER
        - AMENITY_SEARCH_CHARGER
        - DESTINATION
    Country3:
      type: string
      example: SWE
      description: The three letter country code (ISO 3166-1 alpha-3) in capital letters
    ChargeProfilePoint:
      type: object
      required:
        - durationSec
        - socFrac
        - powerW
      properties:
        durationSec:
          type: integer
          minimum: 0
          description: The duration until the soc point has been reached.
        socFrac:
          type: number
          minimum: 0
          maximum: 1
          description: The soc value of the current point
        powerW:
          type: number
          minimum: 0
          description: The current power of the charging session.
      description: A point of a charging session.
    Busyness:
      type: string
      enum:
        - UNKNOWN
        - LOW
        - MEDIUM
        - HIGH
      description: The predicted busyness of the charger at arrival
    CardId:
      type: integer
      format: int64
      description: Unique identifier for a charge card.
      minimum: 1
    ChargeCostEntry:
      type: object
      required:
        - cost
        - cardId
        - currency
        - isDefault
      properties:
        cost:
          type: number
          minimum: 0
        cardId:
          $ref: "#/components/schemas/CardId"
        currency:
          $ref: "#/components/schemas/Currency"
        isDefault:
          type: boolean
          description: |
            The expected price to be used for a user without any card preferences.
    SelectedConnector:
      type: object
      required:
        - connectorType
        - evseIds
      properties:
        connectorType:
          $ref: "#/components/schemas/ConnectorType"
        evseIds:
          type: array
          items:
            type: string
          description: |
            EVSE identifiers at the charger that matches the presented charge-session. When present, this set matches the EVSE
            scope used for the corresponding bulk charge session cost request.
      description: Information to help identify the selected outlet.
    LegOriginChargerSource:
      type: object
      required:
        - name
        - locationId
      properties:
        name:
          type: string
          description: The name of the source.
        locationId:
          type: string
          description: The charger's location id within this source.
    LegOriginCharger:
      type: object
      required:
        - id
        - predictedBusyness
        - costs
        - selectedConnector
      properties:
        id:
          $ref: "#/components/schemas/ChargerId"
        predictedBusyness:
          $ref: "#/components/schemas/Busyness"
        costs:
          type: array
          items:
            $ref: "#/components/schemas/ChargeCostEntry"
        selectedConnector:
          $ref: "#/components/schemas/SelectedConnector"
        source:
          $ref: "#/components/schemas/LegOriginChargerSource"
    LegOrigin:
      type: object
      required:
        - type
        - lat
        - long
        - name
        - timezone
        - arrivalSocFrac
        - utcOffsetSec
        - departureSocFrac
        - totalStayDurationSec
        - remainingRouteDistanceM
        - remainingRouteDurationOnArrivalSec
        - arrivalTime
        - chargeDurationSec
        - chargeOverheadSec
        - chargedSocFrac
        - chargedW
        - chargeProfile
        - idealChargeDurationSec
        - chargeThrottleReason
      properties:
        type:
          $ref: "#/components/schemas/OriginType"
          description: TO BE WRITTEN
        lat:
          $ref: "#/components/schemas/Lat"
        long:
          $ref: "#/components/schemas/Long"
        name:
          type: string
          description: TO BE WRITTEN
        country3:
          $ref: "#/components/schemas/Country3"
        utcOffsetSec:
          type: integer
          description: The UTC offset in seconds.
        timezone:
          type: string
          description: The "tz database" name of the timezone, i.e, "<Area>/<Location>"
        arrivalSocFrac:
          type: number
          maximum: 1
          description: |
            The SoC on arrival. Negative when the planned route cannot be completed on the remaining charge,
            in which case the leg is tagged `ARRIVAL_SOC_BELOW_ZERO`.
        departureSocFrac:
          type: number
          minimum: 0
          maximum: 1
          description: The SoC on departure.
        totalStayDurationSec:
          type: integer
          minimum: 0
          description: The time for the say.
        remainingRouteDistanceM:
          type: integer
          minimum: 0
          description: The total distance remaining.
        remainingRouteDurationOnArrivalSec:
          type: integer
          minimum: 0
          description: The total duration left on the route on arrival.
        arrivalTime:
          type: string
          format: date-time
          description: The time of arrival in the local timezone.
        chargeDurationSec:
          type: integer
          minimum: 0
          description: The time spent charging.
        chargeOverheadSec:
          type: integer
          minimum: 0
          description: The time spent on charge overhead.
        chargedSocFrac:
          type: number
          minimum: 0
          maximum: 1
          description: The total SoC charged.
        chargedW:
          type: integer
          minimum: 0
          description: The total energy charged.
        chargeProfile:
          type: array
          items:
            $ref: "#/components/schemas/ChargeProfilePoint"
          description: The profile of the charging session.
        idealChargeDurationSec:
          type: integer
          minimum: 0
          description: The ideal charge duration without external factors like temperature.  Should always be equal to or less than chargeDurationSec.
        chargeThrottleReason:
          type: string
          description: The reason for the difference between the ideal charge duration and the actual charge duration.
          enum:
            - NONE
            - LOW_BATTERY_TEMP
        destinationIndex:
          type: integer
          minimum: 0
          description: The index of the destination in the request.
        charger:
          $ref: "#/components/schemas/LegOriginCharger"
    WeatherSummary:
      type: object
      required:
        - condition
        - temperatureC
        - windSpeedMs
        - windDirection
      properties:
        condition:
          type: string
          enum:
            - CLEAR
            - CLOUDS
            - FOG
            - LIGHT_SNOW
            - SNOW
            - HEAVY_SNOW
            - LIGHT_RAIN
            - RAIN
            - HEAVY_RAIN
            - THUNDERSTORM
            - UNKNOWN
          description: Enum representing different weather conditions.
        temperatureC:
          type: number
          description: The temperature in Celsius.
        windSpeedMs:
          type: number
          description: The wind speed in m/s.
        windDirection:
          type: integer
          description: The wind direction in degrees.
    PolylineIndex:
      type: integer
