          type: string
          description: The name of the ferry.
    EvComparisonDriveDetails:
      type: object
      required:
        - geometryPointInfo
        - ferries
      properties:
        geometryPointInfo:
          $ref: "#/components/schemas/EvComparisonGeometryPointInfo"
        ferries:
