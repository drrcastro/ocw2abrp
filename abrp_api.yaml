          description: TO BE WRITTEN.
    HereRoutingBackendData:
      type: object
      additionalProperties: false
      required:
        - type
        - routeHandle
      description: A HERE route handle for the leg.
      properties:
        type:
          type: string
          enum:
            - HERE_ROUTE_HANDLE
        routeHandle:
          type: string
    RoutingBackendData:
      oneOf:
        - $ref: "#/components/schemas/HereRoutingBackendData"
      discriminator:
        propertyName: type
        mapping:
          HERE_ROUTE_HANDLE: "#/components/schemas/HereRoutingBackendData"
      example:
        type: HERE_ROUTE_HANDLE
        routeHandle: string
      description: |
        Per-leg routing data, selected by `type`. Clients must tolerate unknown `type` values.
    RouteLeg:
      type: object
      required:
        - legId
        - tags
        - origin
        - driveDetails
      properties:
        legId:
          $ref: "#/components/schemas/LegId"
          description: A unique identifier for the leg.
        tags:
          type: array
          items:
            $ref: "#/components/schemas/LegTag"
          description: TO BE WRITTEN
        origin:
          $ref: "#/components/schemas/LegOrigin"
        weatherSummary:
          $ref: "#/components/schemas/WeatherSummary"
        driveDetails:
          $ref: "#/components/schemas/LegDriveDetails"
        routingBackendData:
          $ref: "#/components/schemas/RoutingBackendData"
          description: Per-leg routing data, when available.
    Route:
      type: object
      required:
        - routeId
        - score
        - tags
        - legTags
        - summary
        - routeOverlaps
        - legs
      properties:
        routeId:
          $ref: "#/components/schemas/RouteId"
          description: A unique identifier for the route.
        score:
          type: integer
          format: int64
          minimum: 0
          description: The score for the route, can be interpreted as seconds.
        tags:
          type: array
          items:
            $ref: "#/components/schemas/RouteTag"
          description: TO BE WRITTEN
        legTags:
          type: array
          items:
            $ref: "#/components/schemas/LegTag"
          description: TO BE WRITTEN
        summary:
          $ref: "#/components/schemas/RouteSummary"
        routeOverlaps:
          type: array
          items:
            $ref: "#/components/schemas/RouteOverlap"
        legs:
          type: array
          items:
            $ref: "#/components/schemas/RouteLeg"
    BetterRouteNotificationType:
      type: string
      enum:
        - CURRENT_IS_CRITICAL
        - FASTER
        - SAFER
        - RECOMMENDED
      x-enum-varnames:
        - BetterRouteNotificationTypeCurrentIsCritical
        - BetterRouteNotificationTypeFaster
        - BetterRouteNotificationTypeSafer
        - BetterRouteNotificationTypeRecommended
      description: |
        Why the recommended route is worth surfacing to the driver, and which
        headline to show. `CURRENT_IS_CRITICAL` is a warning about the route
        being driven â€” it may not be reachable â€” rather than an improvement.
        `FASTER` arrives sooner, `SAFER` holds a healthier state of charge along
        the way, and `RECOMMENDED` is an all-round better fit for the driver's
        preferences with no single dimension dominating.

        A `FASTER` or `SAFER` notification may carry a `fasterReason` or a
        `saferReason` respectively, each naming what changed. Clients must
        tolerate values they do not recognise and should in such cases fall back
        to `RECOMMENDED`.
    FasterReasonFasterDrive:
      type: object
      required:
        - kind
        - removedChargerLegIndicesOnCurrentRoute
        - addedChargerLegIndicesOnRecommendedRoute
      description: |
        The recommended route has shorter drive time. Chargers may have changed,
        but the time savings are dominated by the drive.
      properties:
        kind:
          type: string
          enum:
            - FASTER_DRIVE
          x-enum-varnames:
            - FasterReasonKindFasterDrive
        removedChargerLegIndicesOnCurrentRoute:
          type: array
          items:
            type: integer
            minimum: 0
          description: |
            The 0-based indices, into the `legs` of the route at
            `currentRouteIndex`, of the legs whose origins are the charge stops
            the recommended route does not have. Empty when both routes share
            their charge stops.
        addedChargerLegIndicesOnRecommendedRoute:
          type: array
          items:
            type: integer
            minimum: 0
          description: |
            The 0-based indices, into the `legs` of the route at
            `recommendedRouteIndex`, of the legs whose origins are the charge
            stops the current route does not have. Empty when both routes share
            their charge stops.
    FasterReasonAvoidsTraffic:
      type: object
      required:
        - kind
      description: |
        The current route runs into heavy traffic, and the recommended route
        avoids it.
      properties:
        kind:
          type: string
          enum:
            - AVOIDS_TRAFFIC
          x-enum-varnames:
            - FasterReasonKindAvoidsTraffic
    FasterReasonLessChargeTime:
      type: object
      required:
        - kind
        - lessChargeTimeLegIndexOnCurrentRoute
      description: |
        The recommended route has the same chargers but takes
        a more conservative route between them, thereby
        reducing charge time and the total travel time.
      properties:
        kind:
          type: string
          enum:
            - LESS_CHARGE_TIME
          x-enum-varnames:
            - FasterReasonKindLessChargeTime
        lessChargeTimeLegIndexOnCurrentRoute:
          type: integer
          minimum: 0
          description: |
            The 0-based index of the leg whose origin is the charge stop that
            gets shorter. The two routes share their charge stops here, so the
            same index is valid on both the current and recommended route.
    FasterReasonAvoidsBusyCharger:
      type: object
      required:
        - kind
        - keepsCurrentRoute
        - busyChargerLegIndexOnCurrentRoute
        - newChargerLegIndexOnRecommendedRoute
      description: |
        The recommended route swaps the next charge stop for one where the
        predicted queue time is significantly shorter, saving total trip time.
      properties:
        kind:
          type: string
          enum:
            - AVOIDS_BUSY_CHARGER
          x-enum-varnames:
            - FasterReasonKindAvoidsBusyCharger
        keepsCurrentRoute:
          type: boolean
          description: |
            True when the recommended route is only a minor deviation from the
            roads already being driven, so the change can be presented to the
            driver as a different stop rather than a different route.
        busyChargerLegIndexOnCurrentRoute:
          type: integer
          minimum: 0
          description: |
            The 0-based index of the leg of the current route whose origin is
            the busy charger.
        newChargerLegIndexOnRecommendedRoute:
          type: integer
          minimum: 0
          description: |
            The 0-based index of the leg of the recommended route whose origin
            is the charger with shorter queue time.
    ChargePlanChange:
      type: object
      required:
        - keepsCurrentRoute
        - removedChargerLegIndicesOnCurrentRoute
        - addedChargerLegIndicesOnRecommendedRoute
      description: |
        Which charge stops differ between the two routes. Shared by every reason
        that moves chargers around rather than naming a single one.
      properties:
        keepsCurrentRoute:
          type: boolean
          description: |
            True when the recommended route is only a minor deviation from the
            roads already being driven, so the change can be presented to the
            driver as a different set of stops rather than a different route.
        removedChargerLegIndicesOnCurrentRoute:
          type: array
          items:
            type: integer
            minimum: 0
          description: |
            The 0-based indices, into the `legs` of the route at
            `currentRouteIndex`, of the legs whose origins are the charge stops
            the recommended route does not have. May be empty.
        addedChargerLegIndicesOnRecommendedRoute:
          type: array
          items:
            type: integer
            minimum: 0
          description: |
            The 0-based indices, into the `legs` of the route at
            `recommendedRouteIndex`, of the legs whose origins are the charge
            stops the current route does not have. May be empty.
    FasterReasonFewerChargeStops:
      allOf:
        - $ref: "#/components/schemas/ChargePlanChange"
        - type: object
          required:
            - kind
          description: |
            The recommended route needs fewer charge stops than the current one.
          properties:
            kind:
              type: string
              enum:
                - FEWER_CHARGE_STOPS
              x-enum-varnames:
                - FasterReasonKindFewerChargeStops
    FasterReasonReoptimizedChargers:
      allOf:
        - $ref: "#/components/schemas/ChargePlanChange"
        - type: object
          required:
            - kind
          description: |
            The recommended route charges at a different set of chargers, and no
            single one of the other faster reasons explains the saving.
          properties:
            kind:
              type: string
              enum:
                - REOPTIMIZED_CHARGERS
              x-enum-varnames:
                - FasterReasonKindReoptimizedChargers
    FasterReason:
      oneOf:
        - $ref: "#/components/schemas/FasterReasonFasterDrive"
        - $ref: "#/components/schemas/FasterReasonAvoidsTraffic"
        - $ref: "#/components/schemas/FasterReasonLessChargeTime"
        - $ref: "#/components/schemas/FasterReasonAvoidsBusyCharger"
        - $ref: "#/components/schemas/FasterReasonFewerChargeStops"
        - $ref: "#/components/schemas/FasterReasonReoptimizedChargers"
      discriminator:
        propertyName: kind
        mapping:
          FASTER_DRIVE: "#/components/schemas/FasterReasonFasterDrive"
          AVOIDS_TRAFFIC: "#/components/schemas/FasterReasonAvoidsTraffic"
          LESS_CHARGE_TIME: "#/components/schemas/FasterReasonLessChargeTime"
          AVOIDS_BUSY_CHARGER: "#/components/schemas/FasterReasonAvoidsBusyCharger"
          FEWER_CHARGE_STOPS: "#/components/schemas/FasterReasonFewerChargeStops"
          REOPTIMIZED_CHARGERS: "#/components/schemas/FasterReasonReoptimizedChargers"
      description: |
        Why the recommended route is faster. Clients must tolerate
        unknown `kind` values and fall back to the type-level copy.
    SaferReasonConservesEnergy:
      type: object
      required:
        - kind
        - saferArrivalSocLegIndex
      description: |
        The route keeps the same charging stops but selects a more energy
        conservative route, thereby arriving with a safer arrival SoC.
      properties:
        kind:
          type: string
          enum:
            - CONSERVES_ENERGY
          x-enum-varnames:
            - SaferReasonKindConservesEnergy
        saferArrivalSocLegIndex:
          type: integer
          minimum: 0
          description: |
            The 0-based index of the leg whose arrival SoC at the origin is
            considered unsafe in the current route and safe in the recommended
            route.
    SaferReasonChargerAdded:
      type: object
      required:
        - kind
        - chargerAddedLegIndexOnRecommendedRoute
      description: |
        The recommended route adds a charger to one of the legs of the trip.
        Without it, you will have arrived at the next stop with an unsafe
        arrival SoC.
      properties:
        kind:
          type: string
          enum:
            - CHARGER_ADDED
          x-enum-varnames:
            - SaferReasonKindChargerAdded
        chargerAddedLegIndexOnRecommendedRoute:
          type: integer
          minimum: 0
          description: |
            The 0-based index of the leg where the charger was added. Hence, the
            arrival SoC of the origin of this leg in the current route is
            considered unsafe, while the arrival SoC of the origin of this
            leg in the recommended route is safe.
    SaferReasonMovedChargers:
      allOf:
        - $ref: "#/components/schemas/ChargePlanChange"
        - type: object
          required:
            - kind
          description: |
            The recommended route charges at a different set of chargers,
            thereby avoiding stops with unsafe arrival SoC.
          properties:
            kind:
              type: string
              enum:
                - MOVED_CHARGERS
              x-enum-varnames:
                - SaferReasonKindMovedChargers
    SaferReason:
      oneOf:
        - $ref: "#/components/schemas/SaferReasonConservesEnergy"
        - $ref: "#/components/schemas/SaferReasonChargerAdded"
        - $ref: "#/components/schemas/SaferReasonMovedChargers"
      discriminator:
        propertyName: kind
        mapping:
          CONSERVES_ENERGY: "#/components/schemas/SaferReasonConservesEnergy"
          CHARGER_ADDED: "#/components/schemas/SaferReasonChargerAdded"
          MOVED_CHARGERS: "#/components/schemas/SaferReasonMovedChargers"
      description: |
        Why the recommended route holds a healthier state of charge, selected by
        `kind`. Clients must tolerate unknown `kind` values and fall back to the
        type-level copy.
    BetterRouteNotification:
      type: object
      example:
        type: FASTER
        currentRouteIndex: 0
        recommendedRouteIndex: 1
        fasterReason:
          kind: AVOIDS_TRAFFIC
      required:
        - type
        - recommendedRouteIndex
        - currentRouteIndex
      properties:
        type:
          $ref: "#/components/schemas/BetterRouteNotificationType"
        fasterReason:
          $ref: "#/components/schemas/FasterReason"
        saferReason:
          $ref: "#/components/schemas/SaferReason"
        recommendedRouteIndex:
          type: integer
          minimum: 0
          description: |
            The 0-based index, into the `routes` array of this same response, of
            the route the driver should switch to.
        currentRouteIndex:
          type: integer
          minimum: 0
          description: |
            The 0-based index, into the `routes` array of this same response, of
            the route currently being driven â€” the route the recommendation is
            compared against.
      description: |
        A recommendation to switch from the route currently being driven to a
        different route in `routes`. Present only when there is something worth
        telling the driver about.

        For notifications of type `FASTER`, a more detailed reason may be
        present in `fasterReason`. For notifications of type `SAFER`, a more
        detailed reason may be present in `saferReason`.
    PlanCalibrationResultData:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          description: The calibration state of the vehicle.
        referenceConsumption:
          type: number
          description: The reference consumption in Wh/km @ 110 km/h.
    PlanResult:
      type: object
      required:
        - planId
        - alternativesCursor
        - routes
        - customData
      properties:
        planId:
          type: string
        alternativesCursor:
          type: string
          description: Cursor to be used to fetch alternative plans.
        routes:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        customData:
          type: object
          description: Customer specific additional data.
        clientContext:
          $ref: "#/components/schemas/ClientContext"
        betterRouteNotification:
          $ref: "#/components/schemas/BetterRouteNotification"
        calibration:
          $ref: "#/components/schemas/PlanCalibrationResultData"
    PlanUsageError:
      type: string
      enum:
        - DIFFERENT_REGIONS
        - DIFFERENT_COUNTRIES_WITH_AVOID_BORDER
    AmenityChargerCandidateCategory:
      type: string
      description: The category of the amenity.
      enum:
        - RESTAURANT
        - SHOPPING
        - HOTEL
        - CAFE
        - TOILET
    AmenitySubtype:
      type: string
      enum:
        - RESTAURANT_ASIAN
        - RESTAURANT_EUROPEAN
        - RESTAURANT_AMERICAN
        - RESTAURANT_OTHER
        - RESTAURANT_FASTFOOD
      description: Amenity subtypes
    AfterDestinationIndexOption:
      type: object
