            $ref: "#/components/schemas/RouteTag"
        legTags:
          type: array
          items:
            $ref: "#/components/schemas/LegTag"
        legs:
          type: array
          items:
            $ref: "#/components/schemas/EvComparisonRouteLeg"
    EvComparisonPlan:
      type: object
      required:
        - planId
        - routes
      properties:
        planId:
          type: string
        routes:
          type: array
          items:
            $ref: "#/components/schemas/EvComparisonRoute"
    Typecode:
      type: string
      description: A unique identifier for a vehicle model
      example: rivian:r1s:21:135
    VoiceCommandLocation:
      type: object
      required:
        - lat
        - lon
      description: |
        Current device/vehicle location, used by the voice intent dispatcher
        to bias autosuggest results and as the origin for new routes.
      properties:
        lat:
          $ref: "#/components/schemas/Lat"
        lon:
          $ref: "#/components/schemas/Long"
        heading:
          $ref: "#/components/schemas/Degrees"
    VoiceSavedLocation:
      type: object
      required:
        - name
        - lat
        - lon
      description: |
        A user saved location that might be referenced by phrases like "take me home" or "go to work".
      properties:
        name:
          type: string
          description: |
            User-chosen name for the place (e.g. `home`, `work`). Matched
            by the intent dispatcher against the user's transcript and
            shown back as the display name in plan responses.
          example: home
        lat:
          $ref: "#/components/schemas/Lat"
        lon:
          $ref: "#/components/schemas/Long"
    VoiceTurn:
      type: object
      description: |
        Common fields every turn response carries. Extended by
        `VoicePlanResponse` and `VoiceClarificationResponse`. The
        client should append `{transcript, reply}` to its local history
        before the next request.
      required:
        - transcript
        - reply
        - language
      properties:
        transcript:
          type: string
          description: |
            What the user said in this turn â€” the STT output for
            `_audio` / `_stream`, or the normalised input transcript
            for `_text`.
        reply:
          type: string
          description: |
            Server's natural-language reply for this turn. On the happy
            path (`plan`) this is a short plan announcement; on
            `clarification` it explains what went wrong so the next
            turn can recover.
        language:
          type: string
          description: |
            Language of this turn (the reply, and typically the
            transcript too). BCP-47, but may be just the primary
            subtag (`de`) rather than region-qualified (`de-DE`) when
            STT auto-detected without a hint. Use for TTS voice
            selection. Always populated; defaults to `en-US`.
          example: sv-SE
    VoiceCommandContext:
      type: object
      required:
        - location
        - vehicle
      description: |
        Per-request context shared by all voice endpoints. Carries the
        planner inputs used by `/abrp/plan` plus voice-specific bits:
        `savedLocations` for alias matching, `history` for multi-turn
        follow-ups, and `languageCode` for STT bias / reply locale.
      properties:
        location:
          $ref: "#/components/schemas/VoiceCommandLocation"
        vehicle:
          $ref: "#/components/schemas/PlanVehicle"
        charging:
          $ref: "#/components/schemas/ChargingOptions"
        speed:
          $ref: "#/components/schemas/SpeedOptions"
        avoid:
          $ref: "#/components/schemas/AvoidOptions"
        weather:
          $ref: "#/components/schemas/Weather"
        traffic:
          $ref: "#/components/schemas/Traffic"
        resultOptions:
          $ref: "#/components/schemas/ResultOptions"
        routeId:
          $ref: "#/components/schemas/RouteId"
          description: Current routeId if any.
        savedLocations:
          type: array
          description: User saved locations available for intent-based matching.
          items:
            $ref: "#/components/schemas/VoiceSavedLocation"
        history:
          type: array
          description: |
            Prior conversational turns. Append the previous response
            (same `VoiceTurn` shape) here before each follow-up so the
            assistant can resolve references like "the one in Germany".
            Combined runes across history + the new transcript are
            capped at 1024; over the cap returns 400.
          items:
            $ref: "#/components/schemas/VoiceTurn"
        languageCode:
          type: string
          description: |
            Optional BCP-47 tag (e.g. `en-US`, `sv-SE`, `de-DE`). Biases
            speech recognition only â€” does NOT force the reply language.
            Reply language is decided from transcript content, recent
            history, and `uiLanguage`. Leave absent if unsure.
          example: en-US
        uiLanguage:
          type: string
          description: |
            Optional BCP-47 tag the app uses for its UI (e.g. `en-US`).
            Soft hint for the reply language when the transcript is too
            short or ambiguous to determine the language confidently
            (e.g. a single place name). Safe to always set.
          example: en-US
    VoiceTextRequest:
      type: object
      required:
        - transcript
        - context
      description: |
        Text request body for `/abrp/voice/_text`. Use this when the
        client already has a transcript (e.g. produced by on-device STT
        or typed directly).
      properties:
        transcript:
          type: string
          minLength: 1
          maxLength: 1024
          description: Free-text command.
          example: drive me home
        context:
          $ref: "#/components/schemas/VoiceCommandContext"
        search_provider:
          allOf:
            - $ref: "#/components/schemas/PoiProvider"
          description: |
            Optional developer-only override for the place-search provider used
            to ground spoken destinations (A/B testing). Defaults to the
            customer's configured provider; non-developers get the default.
    VoiceResponseType:
      type: string
      enum:
        - plan
        - clarification
      x-enum-varnames:
        - VoiceResponseTypePlan
        - VoiceResponseTypeClarification
      description: |
        Discriminator for `VoiceResponse`. `plan` means a route was
        produced; `clarification` means the server has a reply but no
        plan (place not found, not-a-route, etc.) and the conversation
        should continue.
    VoicePlanResponse:
      allOf:
        - $ref: "#/components/schemas/VoiceTurn"
        - type: object
          required:
            - type
            - plan
          properties:
            type:
              $ref: "#/components/schemas/VoiceResponseType"
              enum:
                - plan
            plan:
              $ref: "#/components/schemas/AbrpPlan"
    VoiceClarificationResponse:
      allOf:
        - $ref: "#/components/schemas/VoiceTurn"
        - type: object
          required:
            - type
          properties:
            type:
              $ref: "#/components/schemas/VoiceResponseType"
              enum:
                - clarification
    VoiceResponse:
      description: |
        Unified response for `/abrp/voice/_text`, `/abrp/voice/_audio`,
        and each downlink turn on `/abrp/voice/_stream`. Discriminated
        on `type`:

          * `plan` â€” the user's request was resolved into a route; the
            full `AbrpPlan` rides along.
          * `clarification` â€” the request was understood enough to
            respond conversationally but did not yield a route (place
            not found, not-a-route, etc.); the natural-language `reply`
            asks the user to re-speak. The conversation continues.

        Both shapes carry the same `transcript`, `reply`, `language`
        triple â€” the client should append `{transcript, reply}` to its
        local history before the next turn regardless of type.
      oneOf:
        - $ref: "#/components/schemas/VoicePlanResponse"
        - $ref: "#/components/schemas/VoiceClarificationResponse"
      discriminator:
        propertyName: type
        mapping:
          plan: "#/components/schemas/VoicePlanResponse"
          clarification: "#/components/schemas/VoiceClarificationResponse"
    VoiceAudioRequest:
      type: object
      required:
        - audio
        - context
      description: |
        Audio request body for `/abrp/voice/_audio`. Use this when the
        client has a recording in any common audio container.
        For headerless PCM, set the audio part's Content-Type to
        `audio/L16` (defaults: 16000 Hz mono). Override with
        `;rate=N` and/or `;channels=N` when needed.
      properties:
        audio:
          type: string
          format: binary
          description: Audio bytes.
        context:
          $ref: "#/components/schemas/VoiceCommandContext"
        search_provider:
          allOf:
            - $ref: "#/components/schemas/PoiProvider"
          description: |
            Optional developer-only override for the place-search provider used
            to ground spoken destinations (A/B testing). Defaults to the
            customer's configured provider; non-developers get the default.
    RangeRequest:
      type: object
      required:
        - vehicle
        - currentLocation
      properties:
        vehicle:
          $ref: "#/components/schemas/PlanVehicle"
        currentLocation:
          $ref: "#/components/schemas/Coordinates"
        speed:
          $ref: "#/components/schemas/SpeedOptions"
        avoid:
          $ref: "#/components/schemas/AvoidOptions"
        maxFerryLength:
          type: integer
          format: uint32
          description: |
            Maximum ferry length in meters. Ferry routes longer than this threshold will be avoided.
            When specified, this parameter takes precedence over the `avoid.ferries` setting,
            allowing ferries up to this length even if `avoid.ferries` is true.
            This parameter might be removed in the future.
          minimum: 0
          example: 950
          default: 10000
        traffic:
          $ref: "#/components/schemas/Traffic"
        weather:
          $ref: "#/components/schemas/Weather"
        developerSettings:
          $ref: "#/components/schemas/PlanDeveloperSettings"
        radialsCount:
          type: integer
          format: uint32
          description: |
            Number of radials to use when calculating range polygons and thus the amount of points in
            the resulting polygons (note: some points might collapse, so this parameter is an upper bound).
            Higher values result in smoother polygons but increase computation time.
            This parameter might be removed in the future.
          minimum: 8
          maximum: 256
          default: 32
        soc:
          type: array
          items:
            $ref: "#/components/schemas/FracWiggle"
          description: |
            SoC levels to calculate range polygons for. Each value generates a polygon
            showing the reachable area while retaining at least that SoC level.
          example:
            - 0.2
            - 0.05
            - 0
          default:
            - 0.2
            - 0.05
            - 0
          minItems: 1
          maxItems: 10
    Geometry:
      type: object
      description: Abstract base type for GeoJSON geometry objects
      discriminator:
        propertyName: type
        mapping:
          Point: "#/components/schemas/Point"
          LineString: "#/components/schemas/LineString"
          Polygon: "#/components/schemas/Polygon"
          MultiPoint: "#/components/schemas/MultiPoint"
          MultiLineString: "#/components/schemas/MultiLineString"
          MultiPolygon: "#/components/schemas/MultiPolygon"
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - Point
            - LineString
            - Polygon
            - MultiPoint
            - MultiLineString
            - MultiPolygon
          description: The geometry type
    Position:
      type: array
      description: |
        A position is represented by an array of numbers. There MUST be two or more elements.
        The first two are longitude and latitude, or easting and northing, precisely in that order.
        Altitude or elevation MAY be included as an optional third element.
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.1
      minItems: 2
      maxItems: 3
      items:
        type: number
        format: double
      example:
        - 125.6
        - 10.1
    Point:
      type: object
      description: GeoJSON Point geometry
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.2
      allOf:
        - $ref: "#/components/schemas/Geometry"
        - type: object
          required:
            - coordinates
          properties:
            type:
              type: string
              enum:
                - Point
            coordinates:
              $ref: "#/components/schemas/Position"
    LineString:
      type: object
      description: GeoJSON LineString geometry
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.4
      allOf:
        - $ref: "#/components/schemas/Geometry"
        - type: object
          required:
            - coordinates
          properties:
            type:
              type: string
              enum:
                - LineString
            coordinates:
              type: array
              minItems: 2
              items:
                $ref: "#/components/schemas/Position"
    Polygon:
      type: object
      description: |
        GeoJSON Polygon geometry. For Polygons with more than one of these rings,
        the first MUST be the exterior ring, and any others MUST be interior rings.
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.6
      allOf:
        - $ref: "#/components/schemas/Geometry"
        - type: object
          required:
            - coordinates
          properties:
            type:
              type: string
              enum:
                - Polygon
            coordinates:
              type: array
              items:
                type: array
                description: A LinearRing is a closed LineString with four or more positions
                minItems: 4
                items:
                  $ref: "#/components/schemas/Position"
    MultiPoint:
      type: object
      description: GeoJSON MultiPoint geometry
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.3
      allOf:
        - $ref: "#/components/schemas/Geometry"
        - type: object
          required:
            - coordinates
          properties:
            type:
              type: string
              enum:
                - MultiPoint
            coordinates:
              type: array
              items:
                $ref: "#/components/schemas/Position"
    MultiLineString:
      type: object
      description: GeoJSON MultiLineString geometry
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.5
      allOf:
        - $ref: "#/components/schemas/Geometry"
        - type: object
          required:
            - coordinates
          properties:
            type:
              type: string
              enum:
                - MultiLineString
            coordinates:
              type: array
              items:
                type: array
                minItems: 2
                items:
                  $ref: "#/components/schemas/Position"
    MultiPolygon:
      type: object
      description: GeoJSON MultiPolygon geometry
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.7
      allOf:
        - $ref: "#/components/schemas/Geometry"
        - type: object
          required:
            - coordinates
          properties:
            type:
              type: string
              enum:
                - MultiPolygon
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: array
                  minItems: 4
                  items:
                    $ref: "#/components/schemas/Position"
    Feature:
      type: object
      description: GeoJSON Feature object
      required:
        - type
        - geometry
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.2
      properties:
        type:
          type: string
          enum:
            - Feature
        id:
          oneOf:
            - type: string
            - type: number
          description: A feature identifier
        geometry:
          $ref: "#/components/schemas/Geometry"
        properties:
          type: object
          additionalProperties: true
          description: A feature object MAY have any number of members
    RangePolygonProperties:
      type: object
      required:
        - soc
      properties:
        soc:
          $ref: "#/components/schemas/FracWiggle"
          description: |
            SoC level this polygon represents. Areas within the polygon are reachable
            while retaining at least this much battery charge.
          example: 0.2
    RangeEstimate:
      allOf:
        - $ref: "#/components/schemas/Feature"
        - type: object
          required:
            - geometry
            - properties
          properties:
            geometry:
              $ref: "#/components/schemas/Polygon"
            properties:
              $ref: "#/components/schemas/RangePolygonProperties"
    ChargerDebugReachability:
      type: object
      properties:
        tollZone:
          type: boolean
        destonlyZone:
          type: boolean
        nearestHighwayDistance:
          type: integer
          format: int64
          description: Meters.
          example: 1250
    ChargerDebugInfo:
      type: object
      properties:
        sweepGroupUuid:
          type: string
          example: 0f7a1c2e
        sweepClusterId:
          type: string
          example: 3b91d4a7
        reachability:
          $ref: "#/components/schemas/ChargerDebugReachability"
    Name:
      type: string
      example: Iternio's office charger
      description: The name of the location.
    SimpleChargerNetwork:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: A unique identifier for the network.
          example: 85
        name:
          type: string
          description: The name of the network.
          example: Ionity
    ChargerAccessibilityOpen:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - OPEN
    ChargerAccessibilityLimited:
      type: object
      required:
        - status
        - restrictions
      properties:
        status:
          type: string
          enum:
            - LIMITED
        restrictions:
          type: array
          items:
            type: string
            enum:
              - ONLY_CUSTOMERS
              - ONLY_TRUCKS
              - ONLY_2_WHEELERS
              - ONLY_BUS
              - ONLY_BRAND
              - ONLY_CARSHARING
              - ONLY_TAXIS
              - ONLY_RESIDENTIAL
              - ONLY_EMPLOYEES
              - TIME_RESTRICTED
    ChargerAccessibilityConstruction:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - CONSTRUCTION
    ChargerAccessibilityClosed:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - CLOSED
    ChargerAccessibilityNonpublic:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - NON-PUBLIC
    ChargerAccessibilityUnknown:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UNKNOWN
    ChargerAccessibility:
      type: object
      description: Iternio specific status about the whole location.
      oneOf:
        - $ref: "#/components/schemas/ChargerAccessibilityOpen"
        - $ref: "#/components/schemas/ChargerAccessibilityLimited"
        - $ref: "#/components/schemas/ChargerAccessibilityConstruction"
        - $ref: "#/components/schemas/ChargerAccessibilityClosed"
        - $ref: "#/components/schemas/ChargerAccessibilityNonpublic"
        - $ref: "#/components/schemas/ChargerAccessibilityUnknown"
      discriminator:
        propertyName: status
        mapping:
          OPEN: "#/components/schemas/ChargerAccessibilityOpen"
          LIMIT: "#/components/schemas/ChargerAccessibilityLimited"
          CONSTRUCTION: "#/components/schemas/ChargerAccessibilityConstruction"
          CLOSED: "#/components/schemas/ChargerAccessibilityClosed"
          NON-PUBLIC: "#/components/schemas/ChargerAccessibilityNonpublic"
          UNKNOWN: "#/components/schemas/ChargerAccessibilityUnknown"
      example:
        status: open
    Connector:
      type: object
      required:
        - standard
      properties:
        standard:
          $ref: "#/components/schemas/ConnectorType"
        power:
          type: number
          description: The maximum power that can be supplied by the connector [W].
          example: 150000
        priceId:
          type: string
          description: A unique identifier for the price of the connector.
          example: abc-123-456
        cardIds:
          type: array
          items:
            $ref: "#/components/schemas/CardId"
          example:
            - 1
            - 85
          description: A list of unique identifiers for the supporter charge cards.
    Evse:
      type: object
      required:
        - connectors
      properties:
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/Connector"
    Charger:
      type: object
      required:
        - id
        - coordinates
        - accessibility
        - evses
        - hasDynamicStatus
      properties:
        id:
          type: integer
          description: A unique identifier for the charger.
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        name:
          $ref: "#/components/schemas/Name"
        network:
          $ref: "#/components/schemas/SimpleChargerNetwork"
        accessibility:
          $ref: "#/components/schemas/ChargerAccessibility"
        hasDynamicStatus:
          type: boolean
          example: false
          description: Signals if the charger has dynamic status.
        evses:
          type: array
          items:
            $ref: "#/components/schemas/Evse"
    SuccessCharger:
      type: object
      required:
        - status
        - item
      properties:
        status:
          type: string
          description: Describes the status of the request
        item:
          $ref: "#/components/schemas/Charger"
    GetItemError:
      type: object
      description: Error signaling inability to retrieve the item.
      required:
        - status
      allOf:
        - type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - error
          description: Describes the status of the request
        - type: object
          properties:
            message:
              type: string
              example: resource not found
              description: message describing why the item couldn't be retrieved.
    GetCharger:
      type: object
      oneOf:
        - $ref: "#/components/schemas/GetItemError"
        - $ref: "#/components/schemas/SuccessCharger"
      discriminator:
        propertyName: status
        mapping:
          ok: "#/components/schemas/SuccessCharger"
          error: "#/components/schemas/GetItemError"
    Platform:
      type: string
      enum:
        - WEB
        - ANDROID
        - IOS
        - CARPLAY
        - ANDROID_AUTO
        - AUTOMOTIVE
      description: The platform of the device making the request
    MergeConnectorTypes:
      type: string
      default: NONE
      enum:
        - NONE
        - ALL
      description: |
        If set to ALL, the connector types from all sources will be merged.
        This is useful when you want to append outlets to the standard vehicle connectors.
        If set to NONE, the explicitly defined connector types will be the primary source, with connector types derived from vehicle as a fallback.
    Address:
      type: string
      example: ScheelevÃ¤gen 15
      description: The street and house number where the charge point is located.
    AmenityType:
      type: string
      enum:
        - RESTAURANT
        - SHOPPING
        - HOTEL
        - CAFE
      description: The available amenity types
    AmenityDistance:
      type: object
      required:
        - type
        - distance
      properties:
        type:
          $ref: "#/components/schemas/AmenityType"
        distance:
          type: integer
          description: The distance in meters.
      description: The distance to the closest amenity of a certain type.
    ChargerRatingItem:
      type: object
      required:
        - rating
        - count
      properties:
        rating:
          type: integer
          description: Number of stars in the rating (1-5 where 5 is best)
          minimum: 1
          maximum: 5
          example: 5
        count:
          type: integer
          description: Number of times this rating has been given
          example: 123
    Rating:
      type: object
      required:
        - ratings
        - numberOfVotes
      description: The rating of the charger. Collected from user reports.
      properties:
        average:
          type: number
          description: The average score of the votes. Formatted with one decimal.
          example: 4.2
          maximum: 5
          minimum: 0
        numberOfVotes:
          type: integer
          description: The sum of the count for all ratings.
          example: 602
          minimum: 0
        ratings:
          type: array
          example:
            - rating: 5
              count: 123
            - rating: 4
              count: 456
            - rating: 3
              count: 23
          items:
            type: object
            $ref: "#/components/schemas/ChargerRatingItem"
    HasFeature:
      type: string
      enum:
        - NO_DATA
        - "YES"
        - "NO"
        - AMBIGUOUS
    UserBooleanFeature:
      type: object
      required:
        - "yes"
        - "no"
        - dontKnow
      properties:
        "yes":
          type: integer
          example: 5
          description: Reports indicating that the charger has the property.
        "no":
          type: integer
          example: 2
          description: Reports indicating that the charger doesn't have the property.
        dontKnow:
          type: integer
          example: 3
          description: Reports indicating that it is difficult to determine if the charger has the property.
    DogFriendly:
      type: object
      description: Indicates that the location is ell suited for dog owners.
      required:
        - hasFeature
      properties:
        hasFeature:
          $ref: "#/components/schemas/HasFeature"
        userVotes:
          $ref: "#/components/schemas/UserBooleanFeature"
    HasPlayground:
      type: object
      description: Indicates that the location has a nearby playground.
      required:
        - hasFeature
      properties:
        hasFeature:
          $ref: "#/components/schemas/HasFeature"
        userVotes:
          $ref: "#/components/schemas/UserBooleanFeature"
    HasOpenRestrooms:
      type: object
      description: Indicates that the location has open restrooms.
      required:
        - hasFeature
      properties:
        hasFeature:
          $ref: "#/components/schemas/HasFeature"
        userVotes:
          $ref: "#/components/schemas/UserBooleanFeature"
    TrailerFriendly:
      type: object
      description: Indicates that the location is usable with a trailer.
      required:
        - hasFeature
      properties:
        hasFeature:
          $ref: "#/components/schemas/HasFeature"
        userVotes:
          $ref: "#/components/schemas/UserBooleanFeature"
    PlugAndCharge:
      type: object
      description: Indicates that the location has a plug and charge feature.
      required:
        - hasFeature
      properties:
        hasFeature:
          $ref: "#/components/schemas/HasFeature"
    ChargerFeatures:
      type: object
      description: Describes specific features of the charger. There might be multiple sources for a feature.
      required:
        - dogFriendly
        - hasPlayground
        - hasOpenRestrooms
        - trailerFriendly
        - plugAndCharge
      properties:
        dogFriendly:
          $ref: "#/components/schemas/DogFriendly"
        hasPlayground:
          $ref: "#/components/schemas/HasPlayground"
        hasOpenRestrooms:
          $ref: "#/components/schemas/HasOpenRestrooms"
        trailerFriendly:
          $ref: "#/components/schemas/TrailerFriendly"
        plugAndCharge:
          $ref: "#/components/schemas/PlugAndCharge"
    ChargeCompassReliabilityScore:
      type: string
      description: A measurement of how reliable the charger is, A is the most reliable.
      example: A
      enum:
        - A
        - B
        - C
        - D
        - F
    ChargeCompassConnectorScore:
      type: object
      description: |
        Charge Compass reliability for one connector standard at this charger,
        listed where the source scores that connector separately.
      required:
        - standard
        - reliabilityScore
      properties:
        standard:
          $ref: "#/components/schemas/ConnectorType"
        reliabilityScore:
          $ref: "#/components/schemas/ChargeCompassReliabilityScore"
        countChargeSessions:
          type: integer
          description: |
            The number of charging sessions this connector's score is derived
            from. Absent when the source does not report it.
          example: 56
    ChargeCompass:
      type: object
      description: Data collected from Rivian charging sessions.
      properties:
        reliabilityScore:
          $ref: "#/components/schemas/ChargeCompassReliabilityScore"
        averageMaxPower:
          type: number
          description: The average of the maximum power supplied by the charger [kW].
          example: 107
        byConnector:
          type: array
          description: |
            Prefer the entry whose standard matches the connector the vehicle
            will use; fall back to reliabilityScore when it is not listed.
            Absent for most chargers.
          items:
            $ref: "#/components/schemas/ChargeCompassConnectorScore"
    PriceType:
      type: string
      example: ENERGY
      description: |
        The type of pricing. Energy based charging is per kWh. Time based is per hour.
      enum:
        - ENERGY
        - TIME
        - FLAT
        - PARKING_TIME
    PriceSummaryEntry:
      type: object
      required:
        - type
        - lowestPrice
        - highestPrice
      properties:
        type:
          $ref: "#/components/schemas/PriceType"
        currentPrice:
          type: number
          example: 0.6
          description: The current applicable price including vat. Only present if the price is active.
        lowestPrice:
          type: number
          example: 0.5
          description: |
            The lowest applicable price including vat.
        highestPrice:
          type: number
          example: 0.7
          description: The lowest applicable price including vat.
    PriceSummary:
      type: object
      required:
        - currency
        - items
        - isAdhoc
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PriceSummaryEntry"
        isAdhoc:
          type: boolean
          description: Signals that the price is the adhoc (non-contracted) price.
          example: true
        cardId:
          type: integer
          format: int64
          description: A unique identifier for the charge card.
          example: 85
    DetailedConnectorSummary:
      type: object
      required:
        - standard
        - power
      properties:
        standard:
          $ref: "#/components/schemas/ConnectorType"
        power:
          type: number
          description: The maximum power that can be supplied by the connector.
          example: 150000
        prices:
          type: array
          items:
            $ref: "#/components/schemas/PriceSummary"
        isCompatible:
          type: boolean
          description: |
            Describes if the standard is compatible with the supplied typecode or connector types.
            Will only be present if either a typecode or a list of connector types was supplied.
          example: true
      description: |
        An array of the connector standards supported by the included evses.
        For a charger to be included it has to exactly match the array of types and power.
        It also includes additional information that is shared between the included evses.
    EVSEStatus:
      type: string
      description: |
        The status of an EVSE.

        * `OPERATIONAL`: Iternio specific status when the user doesn't have live-data permissions. The charger is working correctly.
      example: AVAILABLE
      enum:
        - AVAILABLE
        - BLOCKED
        - CHARGING
        - INOPERATIVE
        - OUTOFORDER
        - PLANNED
        - REMOVED
        - RESERVED
        - UNKNOWN
        - OPERATIONAL
    EvseSummaryStatus:
      type: object
      required:
        - status
        - count
      properties:
        status:
          $ref: "#/components/schemas/EVSEStatus"
        count:
          type: integer
          minimum: 1
          description: The number of evses with the specified status.
    EvseSummaryBase:
      type: object
      required:
        - count
        - statuses
      properties:
        count:
          type: integer
          minimum: 1
          description: The number of stalls in the location that exactly matches the standards.
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/EvseSummaryStatus"
          description: A summary of the statuses of the evses.
    DetailedEvseSummary:
      type: object
      allOf:
        - type: object
          required:
            - connectors
          properties:
            connectors:
              type: array
              items:
                $ref: "#/components/schemas/DetailedConnectorSummary"
        - $ref: "#/components/schemas/EvseSummaryBase"
      description: Detailed information shared between all of the EVSEs.
    EvseUId:
      type: string
      description: A unique identifier for the evse.
      example: EVSE-1
    DetailedConnector:
      type: object
      required:
        - standard
      properties:
        standard:
          $ref: "#/components/schemas/ConnectorType"
      description: A detailed description of a connector.
    DetailedEvse:
      type: object
      required:
        - id
        - connectors
      properties:
        id:
          $ref: "#/components/schemas/EvseUId"
        status:
          $ref: "#/components/schemas/EVSEStatus"
        statusLastUpdated:
          type: string
          format: date-time
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/DetailedConnector"
      description: A detailed description of an EVSE.
    ChargerIssues:
      type: object
      required:
        - summarizedSeverity
      description: Community reported issues with the charger.
      properties:
        summarizedSeverity:
          type: string
          description: |
            A summarized severity of the reported issues.
            - AVOID is the highest severity and should not be included in plans.
            - DISLIKE indicates that the charger doesn't function as expected. Examples are payment issues or slower charge speeds.
            - DO_NOTHING indicates that the reports doesn't affect the functionality of the charger.
          enum:
            - AVOID
            - DISLIKE
            - DO_NOTHING
    OpeningTimesObject:
      type: object
      required:
        - weekday
        - periodBegin
        - periodEnd
      properties:
        weekday:
          type: integer
          example: 3
          description: The number of the day in the week. It starts from Monday (1) and ends in Sunday (7).
        periodBegin:
          type: string
          example: "05:00"
          description: The beginning of the regular period.
        periodEnd:
          type: string
          example: "06:00"
          description: The ending of the regular period.
    OpeningTimes:
      type: object
      required:
        - twentyfourseven
        - regularHours
      properties:
        twentyfourseven:
          type: boolean
          example: true
          description: Indicates if the location is always open or has certain opening and closing times.
        regularHours:
          type: array
          items:
            $ref: "#/components/schemas/OpeningTimesObject"
          description: The opening and closing hours of the location on a particular day of the week.
      description: Indicates if the location is always open or has certain opening and closing times.
    ParkingType:
      type: string
      example: ON_STREET
      enum:
        - ALONG_MOTORWAY
        - PARKING_GARAGE
        - PARKING_LOT
        - ON_DRIVEWAY
        - ON_STREET
        - UNDERGROUND_GARAGE
    ChargerDeepLinkUrl:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: A url that can be used to deeplink to the charger.
    ChargerDeepLink:
      type: object
      required:
        - operator
        - urls
      properties:
        operator:
          type: string
          description: The name of the operator that the deeplinks are related to.
        urls:
          type: array
          items:
            $ref: "#/components/schemas/ChargerDeepLinkUrl"
          description: A list of urls that can be used to deeplink to the charger.
          default: []
    ChargerBannerImage:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: The URL of the image.
    ChargerBanner:
      type: object
      required:
        - operator
        - id
      properties:
        id:
          type: string
          description: Unique identifier for this banner instance (e.g., "summer-promo-2025", "banner-1")
        operator:
          type: string
          description: The name of the operator that the banner is related to.
        url:
          type: string
          format: uri
          description: A url to be used as deeplink on banner click.
        dark:
          $ref: "#/components/schemas/ChargerBannerImage"
          description: The image for dark mode.
        light:
          $ref: "#/components/schemas/ChargerBannerImage"
          description: The image for light mode.
    DetailedCharger:
      type: object
      required:
        - id
        - coordinates
        - source
        - accessibility
        - amenityDistances
        - hasDynamicStatus
        - cardIds
        - features
        - evseSummary
        - evses
        - deepLinks
        - banners
      description: A detailed description of a charger.
      properties:
        id:
          type: integer
          description: A unique identifier for the charger.
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        timezone:
          type: string
          description: |
            IANA timezone ID for the charger's location (for example `Europe/Stockholm`).
        name:
          $ref: "#/components/schemas/Name"
        address:
          $ref: "#/components/schemas/Address"
        city:
          type: string
          description: The city where the charger is located.
        source:
          type: string
          description: The name of the data-source.
          example: ecomovement
        url:
          type: string
          description: The url of the charger.
        editableUrl:
          type: string
          description: The url to a website that can be used to edit the charger.
        network:
          $ref: "#/components/schemas/SimpleChargerNetwork"
        accessibility:
          $ref: "#/components/schemas/ChargerAccessibility"
        amenityDistances:
          type: array
          items:
            $ref: "#/components/schemas/AmenityDistance"
          description: |
            The distance to the closest amenity, grouped by amenity-type. If an entry is missing
            there are no amenities of the type located closely.
        rating:
          $ref: "#/components/schemas/Rating"
        hasDynamicStatus:
          type: boolean
          example: false
          description: Signals if the charger has dynamic status.
        cardIds:
          type: array
          items:
            $ref: "#/components/schemas/CardId"
          description: The charge-cards supported by the charger.
        features:
          $ref: "#/components/schemas/ChargerFeatures"
        chargeCompass:
          $ref: "#/components/schemas/ChargeCompass"
        evseSummary:
          type: array
          items:
            $ref: "#/components/schemas/DetailedEvseSummary"
        evses:
          type: array
          items:
            $ref: "#/components/schemas/DetailedEvse"
        issues:
          $ref: "#/components/schemas/ChargerIssues"
        openingTimes:
          $ref: "#/components/schemas/OpeningTimes"
        chargingWhenClosed:
          type: boolean
          example: true
          description: Indicates if the EVSEs can be used for charging outside the opening hours of the location. For example, when the parking garage closes its barriers overnight, this attribute indicates if you can still charge until the next morning.
        parkingType:
          $ref: "#/components/schemas/ParkingType"
        deepLinks:
          type: array
          description: A list of deeplinks that can be used for additional information, payment, etc.
          items:
            $ref: "#/components/schemas/ChargerDeepLink"
        banners:
          type: array
          description: A list of banners.
          items:
            $ref: "#/components/schemas/ChargerBanner"
    SuccessDetailedCharger:
      type: object
      required:
        - status
        - item
      properties:
        status:
          type: string
          enum:
            - ok
          description: Describes the status of the request.
        item:
          $ref: "#/components/schemas/DetailedCharger"
    GetDetailedCharger:
      type: object
      oneOf:
        - $ref: "#/components/schemas/GetItemError"
        - $ref: "#/components/schemas/SuccessDetailedCharger"
      discriminator:
        propertyName: status
        mapping:
          ok: "#/components/schemas/SuccessDetailedCharger"
          error: "#/components/schemas/GetItemError"
    GeoChargerBase:
      type: object
      required:
        - id
        - lat
        - long
        - accessibility
        - hasDynamicStatus
      properties:
        id:
          type: integer
          description: A unique identifier for the charger.
        lat:
          $ref: "#/components/schemas/Lat"
        long:
          $ref: "#/components/schemas/Long"
        accessibility:
          $ref: "#/components/schemas/ChargerAccessibility"
        hasDynamicStatus:
          type: boolean
          example: false
          description: Signals if the charger has dynamic status.
        network:
          $ref: "#/components/schemas/SimpleChargerNetwork"
    ConnectorSummary:
      type: object
      required:
        - standard
        - power
      properties:
        standard:
          $ref: "#/components/schemas/ConnectorType"
        power:
          type: number
          description: The maximum power that can be supplied by the connector [W].
          example: 150000
        isCompatible:
          type: boolean
          description: |
            Describes if the standards is compatible with the supplied typecode or connector types.
            Will only be present if either a typecode or a list of connector types was supplied.
          example: true
    EvseSummary:
      type: object
      allOf:
        - type: object
