          $ref: "#/components/schemas/SpeedValue"
        days:
          type: array
          items:
            $ref: "#/components/schemas/DayEnum"
        dateRange:
          $ref: "#/components/schemas/DateRange"
        timeRange:
          $ref: "#/components/schemas/TimeRange"
    RoadConditionLimit:
      type: object
      required:
        - condition
        - speed
      properties:
        condition:
          type: string
          enum:
            - FOG
            - SNOW
            - RAIN
            - SCHOOL
          example: FOG
          description: |
            The road condition that the speed limit applies to.
            - FOG: Speed limit for foggy conditions.
            - SNOW: Speed limit for snowy conditions.
            - RAIN: Speed limit for rainy conditions.
            - SCHOOL: Speed limit when school is active.
        speed:
          $ref: "#/components/schemas/SpeedValue"
    SpeedLimit:
      type: object
      required:
        - value
        - dateTimeRangeLimits
        - specialRoadConditionLimits
      properties:
        value:
          $ref: "#/components/schemas/SpeedValue"
        isVariable:
          type: boolean
          example: false
          description: |
            If the speed limit is variable, e.g. changes based on the time of day.
        isUnlimited:
          type: boolean
          description: Indicates if speed for this camera is unlimited outside special conditions.
        dateTimeRangeLimits:
          type: array
          items:
            $ref: "#/components/schemas/DateTimeLimit"
          description: Additional speed limits for date and time ranges.
        specialRoadConditionLimits:
          type: array
          items:
            $ref: "#/components/schemas/RoadConditionLimit"
          description: Additional speed limits for different road conditions.
    SpeedCamera:
      type: object
      description: A speed camera, can be of multiple types.
      required:
        - positions
        - type
        - countryCode
        - features
      properties:
        features:
          type: array
          items:
            type: string
            example: MARKER
            enum:
              - MARKER
              - ALERT
          description: |
            A list of features that are legal/enabled for this speed camera.
        countryCode:
          type: string
          example: SWE
          description: The ISO 3166-1 alpha-3 country code.
        positions:
          description: The position(s) of the speed camera, see type for details.
          type: array
          minLength: 1
          items:
            $ref: "#/components/schemas/SpeedCameraPosition"
        speedLimit:
          $ref: "#/components/schemas/SpeedLimit"
        length:
          type: number
          format: double
          example: 100
          description: The length of the speed camera zone (if applicable) in meters.
        type:
          type: string
          enum:
            - AVERAGE
            - BUS_LANE
            - DANGEROUS_ZONE
            - MOBILE
            - RED_LIGHT
            - RED_LIGHT_AND_SPEED
            - REGULAR_MOBILE_ZONE
            - SPEED
          example: SPEED
          description: |
            The type of the speed camera.
            - AVERAGE: Measures the average speed between (>= 2) fixed positions.
            - BUS_LANE: Monitors for unauthorized vehicles using lanes designated for buses only. (1 positions)
            - DANGEROUS_ZONE: (France only) Represents a stretch of road where a camera exists or has been reported. (2 positions)
            - MOBILE: Checks the speed of passing vehicles at a single position and can be moved to different locations. (1 position)
            - RED_LIGHT: Monitors if a vehicle passes through a red traffic light at a single, fixed position.
            - RED_LIGHT_AND_SPEED: Checks both if a vehicle passes through a red traffic light and its speed at a single, fixed position.
            - REGULAR_MOBILE_ZONE: Represents a stretch of road where mobile cameras have been frequently reported in the last few months. (>= 2 positions)
            - SPEED: Monitors the speed of vehicles at a single, fixed position.
