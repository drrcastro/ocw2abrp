  /charger/_annotate/detour:
    post:
      security:
        - ApiKeyAuth: []
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: (alpha) Detour cost of reaching chargers from a route
      description: |
        For each charger id, returns the driving distance and time to reach it
        from the route and how much a stop there adds. The detour is local:
        it compares driving a short stretch of the route around the charger with
        and without the stop. It is driving only; charging time is
        not included.

        Chargers come back ordered by position along the route. Ids with no known
        position are left out. `detourStatus` says, per charger, whether the detour
        was measured; one charger failing does not affect the others.

        Accepts up to 100 distinct ids; repeats are ignored.

        To show the time to reach a charger from the current position, add the
        plan leg's `remainingRouteDurationSec` at the current point minus its value
        at `accessFromPointIdx`, plus `accessDurationS`.
      operationId: charger_annotate_detour
      tags:
        - charger
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargerDetourBody"
      responses:
        "200":
          $ref: "#/components/responses/ChargerDetourOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
