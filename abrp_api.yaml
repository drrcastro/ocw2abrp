          schema:
            type: object
            required:
              - chargers
            properties:
              chargers:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/ChargerDebugInfo"
                example:
                  "220069843":
                    sweepGroupUuid: 0f7a1c2e
                    sweepClusterId: 3b91d4a7
                    reachability:
                      tollZone: false
                      destonlyZone: false
                      nearestHighwayDistance: 1250
    ChargerGetOk:
      description: Positive response containing a list of chargers.
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/GetCharger"
    ChargerOk:
      description: Returns detailed information about a single charger.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Charger"
    NotImplemented:
      description: Not Implemented
      content:
        text/plain:
          schema:
            type: string
            example: Not Implemented
    Created:
      description: Created
      content:
        text/plain:
          schema:
            type: string
            example: Created
    DetailedChargerGetOk:
      description: Positive response containing a detailed list of chargers.
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/GetDetailedCharger"
    GeoChargerGetOk:
