    ListVehicle:
      type: object
      required:
        - typecode
        - manufacturer
        - title
        - model
        - options
        - maturity
        - defaultConnectors
        - dcConnectors
        - dcConnectorPowers
        - acConnectors
        - referenceConsumption
        - displayHints
        - idealTrip
      properties:
        typecode:
          $ref: "#/components/schemas/Typecode"
        manufacturer:
          type: string
          description: The manufacturer of the vehicle.
          example: Rivian
        model:
          type: string
          description: The model of the vehicle.
        title:
          type: string
          description: The title of the vehicle.
        maturity:
          type: string
          enum:
            - SPECULATIVE
            - ALPHA
            - BETA
            - MATURE
          description: The maturity of the vehicle, e.g. pre-production, production or future.
        driveTrain:
          type: string
          enum:
            - FWD
            - RWD
            - AWD
            - Dual Motor AWD
            - Tri Motor AWD
            - Quad Motor AWD
          description: |
            The drive train of the vehicle, e.g. front-wheel drive, rear-wheel drive or all-wheel drive. May include motor configuration to differentiate between different AWD configurations.
        batteryCapacityWh:
          type: integer
          format: int32
        batteryChemistry:
          type: string
          description: The chemistry of the battery pack.
          enum:
            - LFP
            - NMC
            - NCA
            - NCMA
            - NAI
            - Unknown
        batteryName:
          type: string
          description: The name of the battery pack.
        startYear:
          type: integer
          format: int32
        endYear:
          type: integer
          format: int32
        options:
          type: array
          items:
            $ref: "#/components/schemas/VehicleOptionReference"
          description: The options of the vehicle in the variants hierarchy.
        createdAt:
          type: string
          format: date-time
          description: The date and time when the vehicle was created.
        sourceTypecode:
          type: string
          description: For user-built custom models, the catalogue typecode this model was derived from. Absent for catalogue vehicles.
          example: tesla:my:25:60:rwd
        publishedTypecode:
          type: string
          description: For user-built custom models, the catalogue typecode this model was published into. Absent when not published.
          example: kia:ev6:24:77:gtline
        publishedAt:
          type: string
          format: date-time
          description: For user-built custom models, when publishedTypecode was set. Absent when not published, or when published before this was tracked.
        defaultConnectors:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorType"
          description: A list of recommended connectors.
        dcConnectors:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorType"
          description: A list of supported fast chargers for the vehicle
        dcConnectorPowers:
          type: array
          items:
            type: integer
            format: int32
          description: A list of the powers of the supported fast chargers for the vehicle in the same order as the dcConnectors
        hasDcfcPreconditioning:
          type: boolean
          description: Whether the vehicle has DCFC preconditioning.
          example: true
        hasHeatpump:
          type: boolean
          description: Whether the vehicle has a heatpump for cabin heating.
          example: true
        recommendedMaxSpeed:
          type: number
          description: The recommended maximum driving speed [km/h], used as the default max speed in planning.
          example: 150
        acConnectors:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorType"
          description: A list of supported level 2 chargers for the vehicle
        referenceConsumption:
          type: number
          description: The reference consumption [Wh/km] @ 110km/h.
          example: 180
        displayHints:
          $ref: "#/components/schemas/ListVehicleDisplayHints"
        idealTrip:
          $ref: "#/components/schemas/ListVehicleIdealTrip"
