          format: date
          example: "2021-01-01"
          description: The start date of the range.
        end:
          type: string
          format: date
          example: "2021-06-01"
          description: The end date of the range.
    TimeRange:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
          example: "0000-01-01T08:00:00Z"
          description: The start time of the range.
        end:
          type: string
          format: date-time
          example: "0000-01-01T10:00:00Z"
          description: The end time of the range.
    DateTimeLimit:
      type: object
      required:
        - speed
      properties:
