    BadRequest:
      description: BadRequest
      content:
        text/plain:
          schema:
            type: string
            example: Invalid Param
    NotFound:
      description: Not Found
      content:
        text/plain:
          schema:
            type: string
            example: Not Found
    VoiceResponseOk:
      description: |
        A successful voice/text turn. May or may not include a plan;
        `plan: null` means the server understood the request but could
        not produce a route (place not found, not a route, etc.) and the
        conversation can continue.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VoiceResponse"
    TooManyRequests:
      description: Too Many Requests
      content:
        text/plain:
          schema:
            type: string
            example: Too Many Requests
    RangeOk:
      description: Array of range estimate polygons
      content:
        application/json:
          schema:
            type: object
            required:
              - ranges
            properties:
              ranges:
                type: array
                items:
                  $ref: "#/components/schemas/RangeEstimate"
                description: |
                  Array of GeoJSON Feature objects with Polygon geometries.
              routes:
                type: array
                items:
                  type: string
                description: Debug polyline5 encoded route geometries used to generate the range polygons.
    ChargerDebugOk:
      description: Charger debug info, keyed by charger id.
      content:
