          maxItems: 25
          description: |
            `[lat, lon]` points, visited in order.
            The upper limit is OSRM's default `--max-viaroute-size`.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
              format: double
          example:
            - - 59.33
              - 18.06
            - - 59.86
              - 17.64
        radius_m:
          type: integer
          minimum: 1
          description: |
            Maximum distance in meters OSRM may move a point to reach a road.
            If a point has no road that close, the route is retried without a limit.
    PreliminaryRoutePolyline:
      type: object
      required:
