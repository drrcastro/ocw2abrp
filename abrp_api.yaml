  /app/tlm/{vehicleId}/providers/last-seen:
    get:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: List a vehicle's recently seen telemetry providers
      description: |
        Returns the latest receipt time for each requested telemetry provider
        that has a raw point successfully indexed for this vehicle within the
        last 7 days. Providers with no matching point are omitted, so an empty
        array means no provider was seen in that window. Raw telemetry is
        buffered before indexing, so newly received data may take about 30
        seconds to appear.

        Users with an active telemetry share for the vehicle may call this in
        addition to the vehicle's owner. Missing and inaccessible vehicles both
        return `403`.
      operationId: list_vehicle_tlm_provider_last_seen
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/vehicleIdInPath"
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSessionRequired"
        - in: query
          name: provider
          required: false
          style: form
          explode: true
          description: |
            Providers to include, in response order. Repeat the parameter to
            request several providers. If omitted, every provider seen in the
            7-day window is returned in protobuf enum order. Unknown values are
            rejected with `400`.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Provider"
      responses:
        "200":
          description: Latest raw telemetry receipt time for each seen provider.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleTlmProviderLastSeen"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /abrp/me/vehicles/{vehicleId}/tlm-tokens:
    get:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: List a vehicle's tagged telemetry tokens
      description: |
        Returns the vehicle's currently-valid *tagged* telemetry tokens, newest
        first, including each token value so the app can re-display the token a
        user already pasted into the integration.

        Only tagged tokens are listed. Untagged tokens â€” the Generic connection
        minted by the v1 `vehicles/new_token` â€” are never returned here.

        Reading provisions nothing: a vehicle with no tagged token returns an
        empty array, and calling this repeatedly still returns an empty array.

        Only the vehicle's owner may call this; a user the vehicle is merely
        shared with receives `403`.
      operationId: list_vehicle_tlm_tokens
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/vehicleIdInPath"
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSessionRequired"
      responses:
        "200":
          description: The vehicle's valid tagged telemetry tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleTlmToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: Mint a telemetry token for a vehicle
      description: |
        Creates a telemetry token bound to this vehicle, scoped
        `set_telemetry,get_telemetry` â€” the same scope the v1 `vehicles/new_token`
        issues.

        Omit `tag` (or the whole body) to mint an **untagged** token: the Generic
        connection, identical to what v1 `vehicles/new_token` returns. Untagged
        tokens are uncapped â€” every call mints a fresh one, so this never returns
        `409` â€” and they are neither listed by `list_vehicle_tlm_tokens` nor
        revocable through `delete_vehicle_tlm_tokens_by_tag`. The response omits
        `tag` for them.

        Supply `tag` to label the token for one integration. A vehicle holds at
        most one valid token per tag. If one already exists this returns `409`
        rather than replacing it, so re-opening a setup screen can never
        invalidate the token a user has already pasted into the integration. To
        rotate, `DELETE` then `POST`. An unrecognised `tag` â€” including an empty
        string â€” is rejected with `400` rather than treated as untagged.

        Only the vehicle's owner may call this.
      operationId: create_vehicle_tlm_token
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/vehicleIdInPath"
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSessionRequired"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleTlmTokenRequest"
      responses:
        "201":
          description: The newly minted token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleTlmToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            Conflict â€” a valid token with this tag already exists for the
            vehicle. Revoke it first, or re-display it via
            `list_vehicle_tlm_tokens`. Only a tagged mint can conflict; an
            untagged one is uncapped.
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: Revoke a vehicle's telemetry tokens carrying a tag
      description: |
        Invalidates every token carrying `tag` for this vehicle. Subsequent
        telemetry posted with a revoked token is rejected, though propagation is
        bounded by a 60 second server-side token cache rather than immediate.

        Already-ingested telemetry and its provider attribution are untouched â€”
        only future writes stop.

        Idempotent: revoking when nothing matches also returns `204`. Note that a
        vehicle set up before tagging existed holds only an untagged token, so
        this reports success without stopping that flow; such a vehicle has to
        redo setup.

        Only the vehicle's owner may call this.
      operationId: delete_vehicle_tlm_tokens_by_tag
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/vehicleIdInPath"
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSessionRequired"
        - name: tag
          in: query
          required: true
          description: Which labelled token set to revoke.
          schema:
            $ref: "#/components/schemas/TlmTokenTag"
      responses:
        "204":
          description: Successfully revoked (or nothing matched).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /abrp/me/api-keys:
    get:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: List your self-managed API keys
      description: |
        Returns the caller's currently-valid self-managed API keys. The
        api-key value itself is never returned by this endpoint â€” secrets
        are show-once and are only returned by `POST /abrp/me/api-keys`.

        Authentication: standard `X-API-KEY` (any abrp app/partner key)
        plus `X-ABRP-SESSION` (your OIDC access token). Keys are scoped
        to the user resolved from the access token.
      operationId: list_self_api_keys
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSessionRequired"
      responses:
        "200":
          description: List of self-managed API keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelfManagedApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: Create a self-managed API key
      description: |
        Generates a new API key for the caller and returns its UUIDv4
        secret exactly once. Save it immediately; we cannot show it
        again. To rotate a key, delete it and create a new one.

        Server-controlled fields (not configurable per request): the
        feature set is fixed to `get_data,post_data` for posting and
        reading personal telemetry, and the rate limit is fixed to two
        calls per second. Each user is capped at five active
        keys; over the cap the endpoint returns `409`.
      operationId: create_self_api_key
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSessionRequired"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSelfManagedApiKeyRequest"
      responses:
        "201":
          description: Newly created key with its one-time secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSelfManagedApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Conflict â€” maximum number of API keys reached.
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalServerError"
  /abrp/me/api-keys/{keyId}:
    delete:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: Delete a self-managed API key
      description: |
        Permanently removes one of the caller's self-managed API keys.
        Only the owner of the key can delete it; calling this with a
        keyId that doesn't belong to the authenticated user returns
        `404` (the same response you'd get for a non-existent id, so
        ownership cannot be probed).
      operationId: delete_self_api_key
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSessionRequired"
        - name: keyId
          in: path
          required: true
          description: The id returned by `list_self_api_keys` / `create_self_api_key`.
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 909
      responses:
        "204":
          description: Successfully deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /abrp/me/usage:
    get:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: (alpha) Get aggregated route-planning usage for a business partner
      description: |
        Returns aggregated, privacy-safe usage metrics for the calling
        business (B2B) partner over a time window: total routes calculated,
        failure rate, average charging stops / distance / travel time, and â€”
        when end-user identifiers are available on the partner's traffic â€”
        the average number of routes per unique user.

        Only scalar aggregates are returned. No individual routes, waypoints,
        coordinates, or user identifiers are ever exposed.

        Authentication: standard `X-API-KEY` plus `X-ABRP-SESSION` (your OIDC
        access token). The caller must hold the `b2b` role, and `keyId` must name
        a key owned by, or shared with, the resolved user.
      operationId: get_usage
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSessionRequired"
        - name: keyId
          in: query
          required: true
          description: |
            Which API key to report on. Exactly one, always: figures from
            several keys are never combined, because a viewer may hold keys
            belonging to different partners. Must be a key owned by, or shared
            with, the caller â€” see `list_usage_keys` for the allowed set. Any
            other id is refused with 403 whether or not it exists.
          schema:
            type: integer
            format: int64
            example: 367
        - name: from
          in: query
          required: false
          description: |
            Window start (inclusive), RFC 3339. Defaults to 30 days before `to`.
          schema:
            type: string
            format: date-time
            example: "2026-07-01T00:00:00Z"
        - name: to
          in: query
          required: false
          description: |
            Window end (exclusive), RFC 3339. Defaults to now.
          schema:
            type: string
            format: date-time
            example: "2026-08-01T00:00:00Z"
      responses:
        "200":
          description: Aggregated usage metrics for the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageMetrics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /abrp/me/usage/keys:
    get:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: (alpha) List the API keys whose usage you may read
      description: |
        Returns every currently-valid API key the caller may report on: the keys
        they own, plus any shared with them. This is the allowed set for the
        `keyId` parameter of the other usage endpoints, and the source for the
        dashboard's key picker.

        An empty array is a valid answer: the caller holds the `b2b` role but no
        key has been shared with them yet.

        Authentication: standard `X-API-KEY` plus `X-ABRP-SESSION` (your OIDC
        access token). The caller must hold the `b2b` role.
      operationId: list_usage_keys
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSessionRequired"
      responses:
        "200":
          description: The API keys the caller may report on, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsageKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /abrp/me/usage/flow:
    get:
      security:
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: Road-traffic density for the calling business partner (alpha)
      description: |
        Returns road-traffic density for a viewport, aggregated from the routes
        this partner's drivers planned.

        A grid of cells. Route geometry is bucketed into ~306m Web Mercator tiles
        at write time, and the tile id is what makes aggregation possible: two
        plans down the same motorway produce similar but not identical polylines,
        so their coordinates cannot be summed, but both land in the same tile.
        Coarser views are re-bucketed server-side, so a continental viewport
        returns a few thousand cells rather than millions.

        Privacy: cells used by fewer than a minimum number of DISTINCT entities
        are dropped before they are ever stored, and route steps within 500m of
        a plan's own origin or destination are discarded, so neither trip
        endpoints nor lightly-used roads can appear. Cell coordinates are tile
        centres, never a point from an actual route. No individual routes, users,
        or exact positions are exposed.

        Pass the bounding box for the visible map; there is no zoom parameter
        because the box already describes the viewport.

        Authentication: standard `X-API-KEY` plus `X-ABRP-SESSION` (your OIDC
        access token). The caller must hold the `b2b` role, and `keyId` must name
        a key owned by, or shared with, the resolved user.
      operationId: get_usage_flow
      tags:
        - app
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSessionRequired"
        - name: keyId
          in: query
          required: true
          description: |
            Which API key to report on. Exactly one, always: figures from
            several keys are never combined, because a viewer may hold keys
            belonging to different partners. Must be a key owned by, or shared
            with, the caller â€” see `list_usage_keys` for the allowed set. Any
            other id is refused with 403 whether or not it exists.
          schema:
            type: integer
            format: int64
            example: 367
        - name: from
          in: query
          required: false
          description: Window start (inclusive), RFC 3339. Defaults to 30 days before `to`.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Window end (exclusive), RFC 3339. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: minLat
          in: query
          required: false
          description: Viewport south edge. All four bbox params must be given together.
          schema:
            type: number
            format: double
        - name: minLng
          in: query
          required: false
          description: Viewport west edge.
          schema:
            type: number
            format: double
        - name: maxLat
          in: query
          required: false
          description: Viewport north edge.
          schema:
            type: number
            format: double
        - name: maxLng
          in: query
          required: false
          description: Viewport east edge.
          schema:
            type: number
            format: double
      responses:
        "200":
          description: Directional traffic density for the viewport.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageFlow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
