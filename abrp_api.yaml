          example: "2020-01-01T00:00:00Z"
        endDate:
          type: string
          format: date-time
          description: The end date of the share
          example: "2020-01-01T00:00:00Z"
        shortName:
          type: string
          maxLength: 80
          description: |
            A short name for the group. If not specified nothing will be shown.
          example: My group
        description:
          type: string
          maxLength: 1000
          description: |
            A description of the activity/share group
    Polyline:
      type: array
      description: A list of coordinates ordered by direction of travel.
      items:
        type: array
        description: A coordinate in the format [latitude, longitude].
        maxItems: 2
        minItems: 2
        items:
          type: number
          format: double
