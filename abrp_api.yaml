  /vehicle-model/by-typecode/{typecode}/image/{scene}:
    get:
      security:
        - AbrpSessionAuth: []
          ApiKeyOptionalAuth: []
      summary: (alpha) Gets a vehicle image from the typecode
      description: |
        Returns a vehicle image. If the image is not found and hidden is false, this returns a 404.
      operationId: vehicle_model_get_image
      tags:
        - vehicle
      parameters:
        - $ref: "#/components/parameters/apiKeyOptional"
        - $ref: "#/components/parameters/abrpSession"
        - $ref: "#/components/parameters/typecodeInPath"
        - in: path
          required: true
          name: scene
          schema:
            $ref: "#/components/schemas/ImageScene"
        - in: query
          name: size
          required: false
          description: The image size in pixels to return. If not provided, the default size for the type will be returned.
          schema:
            $ref: "#/components/schemas/ImageSize"
        - in: query
          name: paint
          required: false
          description: |
            The paint to use. Accepts either one of the 8 base color enum values
            (BLACK, GREY, WHITE, BLUE, YELLOW, RED, ORANGE, GREEN) or a manufacturer
            imagin paint id (e.g. "pspc0096", including compound two-tone ids such as
            "pspc0343sspc0041"). Enum values are uppercase; imagin ids are lowercase.
            If not provided, the default color for the vehicle will be returned.
          schema:
            type: string
            pattern: ^(BLACK|GREY|WHITE|BLUE|YELLOW|RED|ORANGE|GREEN|pspc[0-9a-z]+)$
        - in: query
          name: licensePlate
          required: false
          description: The license plate to use. If not provided, no license plate will be shown
          schema:
            $ref: "#/components/schemas/LicensePlate"
        - in: query
          name: hidden
          required: false
          description: If true, the vehicle will be rendered as an hidden vehicle
          schema:
            $ref: "#/components/schemas/HiddenVehicle"
        - in: query
