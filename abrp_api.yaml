      discriminator:
        propertyName: status
        mapping:
          ok: "#/components/schemas/SuccessGeoCharger"
          error: "#/components/schemas/GetItemError"
    GooglePlaceIdsRequest:
      type: object
      anyOf:
        - required:
            - chargerIds
        - required:
            - googlePlaceIds
      properties:
        chargerIds:
          type: array
          items:
            $ref: "#/components/schemas/ChargerId"
          minItems: 1
          maxItems: 256
          description: List of charger IDs to lookup Google Place IDs for
          example:
            - 123
            - 456
            - 789
        googlePlaceIds:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 256
          description: List of Google Place IDs to lookup charger IDs for
          example:
            - ChIJN1t_tDeuEmsRUsoyG83frY4
            - ChIJAQAAAFauEmsRlJw3Dw3szbE
    GooglePlaceIdsResponse:
      type: object
      properties:
        chargerToGoogle:
          type: object
          additionalProperties:
            type: string
          description: Map of charger IDs to Google Place IDs. Only includes successful matches.
          example:
            "234987": ChIJrUV-qfCll0cRJBANVBbwxmQ
            "24501844": ChIJ1wRwYW70T0YRdn9FJoS7krA
        googleToCharger:
          type: object
          additionalProperties:
            type: string
          description: Map of Google Place IDs to charger IDs. Only includes successful matches.
          example:
            ChIJrUV-qfCll0cRJBANVBbwxmQ: "234987"
            ChIJ1wRwYW70T0YRdn9FJoS7krA: "24501844"
    PriceProductType:
      type: string
      example: ADHOC
      enum:
        - ADHOC
        - MSP
        - CPO_SUBSCRIPTION
        - UNKNOWN
      description: |
        A price can be of one of the following types:
        - ADHOC: The default price you at the station. Payment is made via a card / QR code.
        - MSP: A price that is obtained through using a MSP.
        - CPO_SUBSCRIPTION: A price that is obtained by a subscription to the CPO.
        - UNKNOWN: A price that doesn't fit the other categories or has an unknown type.
    SubscriptionType:
      type: string
      enum:
        - MONTHLY
        - YEARLY
        - ONE_OFF
        - UNKNOWN
      description: The type of the subscription.
    Subscription:
      type: object
      required:
        - type
      properties:
        type:
          $ref: "#/components/schemas/SubscriptionType"
        fee:
          type: number
          description: |
            The fee for the subscription. The currency is defined in the price product.
      description: Information related to the subscription.
    ChargerPriceProduct:
      type: object
      required:
        - name
        - currency
        - type
        - isVerified
      properties:
        name:
          type: string
          description: The name of the product
          example: be.ENERGISED
        description:
          type: string
          description: The description of the product.
          example: be.ENERGISED
        currency:
          $ref: "#/components/schemas/Currency"
        type:
          $ref: "#/components/schemas/PriceProductType"
        subscription:
          $ref: "#/components/schemas/Subscription"
        isVerified:
          type: boolean
          description: Whether the price/product data has been verified.
          example: true
    PriceComponent:
      type: object
      required:
        - type
        - price
      properties:
        type:
          $ref: "#/components/schemas/PriceType"
        price:
          type: number
          example: 0.5
          description: The applicable price including vat.
        vat:
          type: number
          example: 19
          description: The applicable VAT
    TimeRestriction:
      type: object
      properties:
        from:
          type: integer
          example: 21600
          description: Seconds from 00:00. A missing values indicates that it is active from 00:00.
        to:
          type: integer
          example: 72000
          description: Seconds from 00:00. A missing values indicates that it is active until 23:59.
    PriceRestrictions:
      type: object
      properties:
        time:
          $ref: "#/components/schemas/TimeRestriction"
    PriceElement:
      type: object
      required:
        - components
      properties:
        components:
          type: array
          items:
            $ref: "#/components/schemas/PriceComponent"
          description: The different elements of the price. Add them together to get the total price.
        restrictions:
          $ref: "#/components/schemas/PriceRestrictions"
          description: |
            Restrictions for when the price is active. A price is active if all restrictions are fulfilled.
            A missing value indicate that there are no restrictions.
    PriceV2:
      type: object
      required:
        - id
        - elements
        - score
      properties:
        id:
          type: string
          description: A unique identifier for the price.
          example: abc-123-456
        cardId:
          $ref: "#/components/schemas/CardId"
        score:
          type: integer
          description: Higher is better. Used for sorting.
          minimum: 0
        product:
          $ref: "#/components/schemas/ChargerPriceProduct"
        elements:
          type: array
          items:
            $ref: "#/components/schemas/PriceElement"
          description: All elements of the prices.
        currentPrice:
          type: array
          items:
            $ref: "#/components/schemas/PriceComponent"
          description: The currently active price components.
    PriceConnector:
      type: object
      required:
        - standard
        - power
      properties:
        standard:
          $ref: "#/components/schemas/ConnectorType"
        power:
          type: number
          description: The maximum power that can be supplied by the connector.
          example: 150000
    PriceMapping:
      type: object
      required:
        - priceIds
        - connectors
      properties:
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/PriceConnector"
        priceIds:
          type: array
          items:
            type: string
            description: A unique identifier for the price.
            example: abc-123-456
    ChargerPriceTag:
      type: string
      enum:
        - PARKING_FEE
      description: |
        Tags that signals information about the all prices of the location.
    OccupancyHistogram:
      type: object
      required:
        - shape
        - risk
      properties:
        shape:
          type: array
          minItems: 168
          maxItems: 168
          items:
            type: number
            format: float
            minimum: 0
            maximum: 1
          description: |
            Weekly occupancy SHAPE (silhouette), 168 entries, 0-1. Entry index i maps to weekday = i/24 (0 = Monday, 6 = Sunday) and hour = i%24. Each value is the station's utilization for that hour, floor-subtracted, normalized to the station's own peak, then gamma-lifted (peak -> 1.0). Visual rhythm ("popular times"), NOT an absolute busyness figure.
        risk:
          type: array
          minItems: 168
          maxItems: 168
          items:
            type: integer
            minimum: 0
            maximum: 2
          description: |
            Per-hour queue risk LEVEL, 168 entries: 0 = low, 1 = medium, 2 = high. Derived from the probability the site is >=90% of stalls occupied at that hour (p90), bucketed by internal thresholds. Same index mapping as shape.
      description: |
        Weekly predicted busy-times for a charger. shape drives bar height (silhouette); risk is the honest per-hour queue-risk the client may use to scale/color. Object envelope so future fields stay non-breaking.
    ChargerImageId:
      type: string
      description: Id of an image for a charger
      example: 123-imageid
    ChargerImageVariant:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: A link to an image of the charger.
          example: https://picsum.photos/800/600
        width:
          type: integer
          description: The width of the image in pixels.
          example: 800
        height:
          type: integer
          description: The height of the image in pixels.
          example: 600
        contentType:
          type: string
          description: The mimetype from from the image.
          example: image/jpeg
    ChargerImage:
      type: object
      required:
        - id
