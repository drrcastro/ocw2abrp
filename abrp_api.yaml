        application/json:
          schema:
            type: object
            allOf:
              - $ref: "#/components/schemas/MetaPaginationProperty"
              - type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChargerFeaturesObject"
    NetworkListOk:
      description: Returns a list of networks.
      content:
        application/json:
          schema:
            type: object
            allOf:
              - $ref: "#/components/schemas/MetaPaginationProperty"
              - type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChargerNetwork"
    NetworkSearchOk:
      description: Returns a list of charger networks.
      content:
        application/json:
          schema:
            required:
              - items
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/ChargerNetwork"
    NetworkGetOk:
      description: Detailed information about a list of network.
