      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/GeoChargerResponseItem"
    GooglePlaceIdsOk:
      description: Returns ID mappings for the requested lookups. Only successful matches are included in the response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GooglePlaceIdsResponse"
    ChargerPricesOk:
      description: Positive response with information about the price of a charger.
      content:
        application/json:
          schema:
            required:
              - items
              - mapping
              - tags
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/PriceV2"
              mapping:
                type: array
                items:
                  $ref: "#/components/schemas/PriceMapping"
              tags:
                type: array
                items:
                  $ref: "#/components/schemas/ChargerPriceTag"
    ChargerOccupancyOk:
      description: Weekly predicted occupancy histogram for the charger.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OccupancyHistogram"
    NoContent:
      description: No Content
      content:
        text/plain:
          schema:
            type: string
            example: No Content
    ChargerMediaOk:
      description: Positive response with image meta data for the specified charger.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChargerImages"
    MediaUploadAccepted:
      description: The media upload request has been accepted. The image is queued for review and processing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChargerImage"
    ChargerEvseStatusOk:
      description: A positive response with real-time status for the specified charger.
      content:
        application/json:
          schema:
            type: object
            required:
              - items
              - statuses
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/ChargerEvseStatusesEntry"
              statuses:
                type: array
                items:
                  $ref: "#/components/schemas/EVSEStatus"
    Accepted:
      description: |
        The request has been accepted for processing, but the processing has not been completed.
         The request might or might not be eventually acted upon, and may be disallowed when processing occurs.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: Accepted
    TiledChargerSearchOk:
      description: Returns a grid containing the matching chargers.
      content:
        application/json:
          schema:
            type: object
            allOf:
              - type: object
                required:
                  - tilesToDisplay
                  - cacheKeyOrder
                  - tilesToDiscard
                  - newTiles
                  - meta
                properties:
                  cacheKeyOrder:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChargerTileKey"
                    description: |
                      A sorted list of the non-used tile keys. They are sorted based on the likelihood of being displayed again. 
                      The first entries will always be the same as those sent in tiles to display. The client decides on how many of the tiles to keep in the cache.
                  tilesToDiscard:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChargerTileKey"
                    description: |
                      A list of keys that are should be discarded on the client. These are either extremely unlikely to be shown again
                      or has been deprecated due to ttl.
                  tilesToDisplay:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChargerTileKey"
                    description: A list of keys that should be displayed on the map.
                  newTiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChargerTile"
                  meta:
                    $ref: "#/components/schemas/TiledChargerSearchMeta"
    ChargerGeoSearchOk:
      description: Returns a list of chargers matching the provided query.
      content:
        application/json:
          schema:
            type: object
            allOf:
              - type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GeoSearchCharger"
    BboxesChargerIdsSearchOk:
      description: Returns a list of charger ids matching the provided bounding boxes.
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/ChargerIdTile"
    ChargerDetourOk:
