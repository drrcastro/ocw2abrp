                properties:
                  google_session:
                    $ref: "#/components/schemas/AutoCompleteSession"
                    description: |
                      Session token for Google Places API. Only returned when GOOGLE_AUTOSEARCH
                      mode is requested. This session should be reused in subsequent calls and
                      is required for the `/poi/autosuggest/result` endpoint.
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/AutoCompleteItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
