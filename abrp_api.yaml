  /charger/_search/tiled:
    post:
      security:
        - ApiKeyAuth: []
        - ApiKeyAuth: []
          AbrpSessionAuth: []
      summary: (alpha) Tiled charger search
      description: |
        Mainly used for displaying chargers on the map. The earth is split into tiles based on zoom-level.

        The tiling has the following implications:
          - The same chargers are always returned for a specific zoom level/location.
          - It is possible to cache the result on the client. This enables less data transfer and faster response times.
          - The result will be more evenly distributed.

        The recommend approach is to cache the tiles returned from the client. This is enabled through sending
        the tiles cached on the client as in input parameter. The server will then respond with a sorted list of tile keys, the content of the unknown tiles, and the minimum
        number of tiles to display. Always render the minimum number of tiles on the map. It is however up to the client to decide
        on how many of the tiles it wants to cache. The backend will handle invalidating tiles if they are outdated.
      operationId: tiled_bbox_search
      tags:
        - charger
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/abrpSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TiledSchema"
            examples:
              simple:
                value:
                  southWest:
                    lat: 55.5
                    long: 13.1
                  northEast:
                    lat: 55.75
                    long: 13.3
                  filter:
                    connectorTypes:
                      - CCS
                      - SC
                      - TYPE2
                  boost:
                    networkIds:
                      - 1
                  avoid:
                    networkIds:
                      - 2
                  cachedTiles:
                    - ChIJAAAAAMC6S0ARAAAAAAAxKkASEgkAAAAAYMBLQBEAAAAAAF4qQBgMIJURKO4ZMAE4CEIMCPy51bAGEICWyfoC
                    - ChIJAAAAAGDAS0ARAAAAAAAxKkASEgkAAAAAAMZLQBEAAAAAAF4qQBgMIJURKO8ZMAFCDAj8udWwBhC8m8n6Ag==
      responses:
        "200":
          $ref: "#/components/responses/TiledChargerSearchOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /charger/_search/bounding-box:
    post:
